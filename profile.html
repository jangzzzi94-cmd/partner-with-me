<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로필 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partners</span></a>
<nav><a href="admin.html" id="adminLink" style="display:none">관리자</a><a href="admin-limits.html" id="adminLimitsLink" style="display:none">당타사한도</a><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap" style="max-width:640px;">
<h1>프로필</h1>
<p class="sub">별명을 설정하면 대시보드 등 화면에 이메일 대신 별명으로 표시됩니다.</p>

<div class="auth-card" style="max-width:100%;margin-bottom:20px;">
  <h2 style="font-size:16px;margin:0 0 16px;color:var(--navy-950);">기본 정보</h2>
  <div class="field"><label>이메일</label><input type="text" id="infoEmail" readonly style="background:var(--paper);color:var(--muted);"></div>
  <div class="field"><label>등급</label><input type="text" id="infoRole" readonly style="background:var(--paper);color:var(--muted);"></div>
  <div class="field" style="margin-bottom:0;"><label>가입일</label><input type="text" id="infoJoined" readonly style="background:var(--paper);color:var(--muted);"></div>
</div>

<div class="auth-card" style="max-width:100%;">
  <h2 style="font-size:16px;margin:0 0 16px;color:var(--navy-950);">별명 설정</h2>
  <form id="nicknameForm">
    <div class="field">
      <label>별명</label>
      <input type="text" id="nicknameInput" maxlength="20" placeholder="예: 김대박 설계사">
    </div>
    <button type="submit" class="btn-primary" id="saveBtn">저장</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<div class="auth-card" style="max-width:100%;margin-top:20px;">
  <h2 style="font-size:16px;margin:0 0 6px;color:var(--navy-950);">보장분석표 표지 스타일</h2>
  <p class="sub" style="margin:0 0 16px;">보장분석표 엑셀 다운로드 시 첫 페이지(표지)에 사용될 스타일을 선택하세요. 별도로 선택하지 않으면 관리자가 지정한 기본 스타일이 사용됩니다.</p>
  <div id="styleGallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:14px;"></div>
  <div class="msg" id="coverMsg"></div>
</div>
<!-- 앞으로 프로필에 더 적고 싶은 내용이 생기면 위 카드들처럼 새 <div class="auth-card"> 섹션을 추가하면 됩니다. -->
</div>
<script src="assets/supabase-client.js"></script>
<script>
let myProfileForCover = null;
let coverStylesCache = [];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function renderStyleGallery(){
  const gallery = document.getElementById('styleGallery');
  gallery.innerHTML = '';
  if(!coverStylesCache.length){
    gallery.innerHTML = '<div class="sub" style="grid-column:1/-1;">아직 관리자가 등록한 표지 스타일이 없습니다.</div>';
    return;
  }
  const selectedId = myProfileForCover ? myProfileForCover.cover_style_id : null;
  coverStylesCache.forEach(function(style){
    const isSelected = selectedId ? (style.id === selectedId) : !!style.is_default;
    const card = document.createElement('div');
    card.style.cssText = 'cursor:pointer;border:2px solid ' + (isSelected ? 'var(--navy-900)' : 'var(--line)') + ';border-radius:8px;overflow:hidden;background:var(--paper);';
    card.innerHTML =
      '<div style="aspect-ratio:297/210;overflow:hidden;background:#eee;">' +
        '<img src="' + getCoverImageUrl(style.image_path) + '" style="display:block;width:100%;height:100%;object-fit:cover;">' +
      '</div>' +
      '<div style="padding:8px 10px;font-size:13px;">' +
        '<div style="font-weight:600;color:var(--navy-950);">' + escapeHtml(style.name) +
          (style.is_default ? ' <span style="font-size:11px;color:var(--muted);font-weight:400;">(기본)</span>' : '') +
        '</div>' +
        (isSelected ? '<div style="color:var(--navy-900);font-size:12px;margin-top:2px;">✓ 사용 중</div>' : '') +
      '</div>';
    card.addEventListener('click', async ()=>{
      if(isSelected) return;
      await selectCoverStyle(style.id);
    });
    gallery.appendChild(card);
  });
}

async function selectCoverStyle(styleId){
  const msg = document.getElementById('coverMsg');
  msg.className = 'msg'; msg.textContent = '';
  const result = await updateMyCoverStyle(styleId);
  if(!result.ok){
    msg.className = 'msg err show';
    msg.textContent = '저장 실패: ' + result.message;
    return;
  }
  if(myProfileForCover) myProfileForCover.cover_style_id = styleId;
  renderStyleGallery();
  msg.className = 'msg ok show';
  msg.textContent = '표지 스타일이 저장되었습니다.';
}

(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  const profile = await getMyProfile();
  if(profile){
    myProfileForCover = profile;
    if(profile.role === 'admin'){
      document.getElementById('adminLink').style.display = 'inline';
      document.getElementById('adminLimitsLink').style.display = 'inline';
    }
    var roleLabels = { admin:'관리자', silver:'실버', gold:'골드' };
    document.getElementById('infoEmail').value = profile.email || session.user.email || '-';
    document.getElementById('infoRole').value = roleLabels[profile.role] || profile.role || '-';
    document.getElementById('infoJoined').value = profile.created_at ? new Date(profile.created_at).toLocaleDateString('ko-KR') : '-';
    document.getElementById('nicknameInput').value = profile.nickname || '';
    coverStylesCache = await getCoverStyles();
    renderStyleGallery();
  }
})();

document.getElementById('nicknameForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  const val = document.getElementById('nicknameInput').value.trim();
  if(val.length > 20){
    msg.className = 'msg err show';
    msg.textContent = '별명은 20자 이내로 입력해주세요.';
    return;
  }
  btn.disabled = true; btn.textContent = '저장 중...';
  const result = await updateMyNickname(val);
  btn.disabled = false; btn.textContent = '저장';
  if(!result.ok){
    msg.className = 'msg err show';
    msg.textContent = '저장 실패: ' + result.message;
    return;
  }
  msg.className = 'msg ok show';
  msg.textContent = '저장되었습니다.';
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
