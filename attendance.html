<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>출근보고·근태 | With Partners</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --card2:#fbfcfd; --line:#e6e9ef; --line2:#d3d9e3;
  --tx:#171b23; --tx2:#5c6577; --tx3:#8b94a6;
  --pri:#2f6bff; --pri2:#1e55e0; --pri-soft:#eaf0ff;
  --ok:#0f9d58; --ok-soft:#e6f6ed;
  --warn:#c77700; --warn-soft:#fff3e0;
  --dan:#d92d20; --dan-soft:#fdeceb;
  --pur:#7c4dff; --pur-soft:#f0eaff;
  --cy:#0a8fa3; --cy-soft:#e3f6f9;
  --r:14px; --rs:10px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.07);
  --sh-s:0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#ccd2dc;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  /* 메인 사이트(dashboard.html 등)의 .navbar와 같은 네이비 톤으로 통일 - 근태 페이지도
     같은 사이트의 한 화면처럼 보이도록 상단 바를 맞춘다. */
  position:sticky;top:0;z-index:40;background:#0a1a30;
  border-bottom:1px solid #16305c;padding:14px 16px;
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.topbar .logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:#fff}
.topbar .logo span{color:#8fb4e3}
.topbar .sp{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);
  border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;box-shadow:var(--sh-s)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--pri);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto}
.main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:16px 16px 104px}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto;scrollbar-width:none;box-shadow:0 -2px 12px rgba(16,24,40,.05);
}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:60px;padding:7px 5px;border-radius:var(--rs);display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:10.5px;font-weight:700;
  transition:.15s;white-space:nowrap}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri);background:var(--pri-soft)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  margin-bottom:12px;box-shadow:var(--sh-s)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.3px}
.card-h .sp{flex:1}
.sec-t{font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.3px;margin:22px 0 10px}
.sec-t:first-child{margin-top:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}

/* ---------- stat ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh-s)}
.stat .lb{font-size:11.5px;color:var(--tx3);font-weight:700;margin-bottom:7px}
.stat .vl{font-size:23px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.stat .sub{font-size:11.5px;color:var(--tx3);margin-top:5px}
.stat.acc-r{border-color:#f7c9c5;background:linear-gradient(180deg,var(--dan-soft),#fff)}
.stat.acc-r .vl{color:var(--dan)}
.stat.acc-g{border-color:#b8e3ca;background:linear-gradient(180deg,var(--ok-soft),#fff)}
.stat.acc-g .vl{color:var(--ok)}
.stat.acc-b{border-color:#c3d5ff;background:linear-gradient(180deg,var(--pri-soft),#fff)}
.stat.acc-b .vl{color:var(--pri)}
.stat.acc-p{border-color:#d9c9ff;background:linear-gradient(180deg,var(--pur-soft),#fff)}
.stat.acc-p .vl{color:var(--pur)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);
  border:1px solid var(--line2);color:var(--tx);border-radius:var(--rs);padding:9px 14px;
  font-size:13.5px;font-weight:700;transition:.14s;white-space:nowrap;box-shadow:var(--sh-s)}
.btn:hover{background:#f7f9fc;border-color:#c2cad6}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2);border-color:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dan{background:var(--dan);border-color:var(--dan);color:#fff}
.btn.gho{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- forms ---------- */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.inp{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);
  padding:11px 13px;font-size:14.5px;transition:.14s;outline:none;color:var(--tx)}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp::placeholder{color:#a9b2c1}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235c6577' stroke-width='2.4' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
textarea.inp{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.45}

/* ---------- badges ---------- */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.bdg.b{background:var(--pri-soft);color:var(--pri);border-color:#cfdcff}
.bdg.g{background:var(--ok-soft);color:var(--ok);border-color:#bfe6cf}
.bdg.r{background:var(--dan-soft);color:var(--dan);border-color:#f7cdc9}
.bdg.y{background:var(--warn-soft);color:var(--warn);border-color:#ffe0b3}
.bdg.p{background:var(--pur-soft);color:var(--pur);border-color:#ddcdff}
.bdg.c{background:var(--cy-soft);color:var(--cy);border-color:#bfe9ef}
.bdg.n{background:#f0f2f6;color:var(--tx2);border-color:var(--line)}

.seg{display:flex;background:#eef1f6;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.14s}
.seg button.on{background:#fff;color:var(--pri);box-shadow:var(--sh-s)}
.seg.sm button{padding:6px 4px;font-size:11.5px}

.tpick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tpick button{border:1.5px solid var(--line2);background:#fff;border-radius:var(--r);padding:14px 10px;
  text-align:left;transition:.15s}
.tpick button .tt{font-size:15px;font-weight:800;margin-bottom:3px}
.tpick button .td{font-size:11px;color:var(--tx3);line-height:1.4}
.tpick button.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.tpick button.on .tt{color:var(--pri)}
.tpick button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- table ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:800;color:var(--tx3);
  background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px 16px;text-align:center;color:var(--tx3);font-size:13px}

.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .sp{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14px}
.row .ds{font-size:11.5px;color:var(--tx3);margin-top:2px}

.rk{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;background:#eef1f6;color:var(--tx2);flex:0 0 auto}
.rk.r1{background:linear-gradient(135deg,#ffd66b,#f0a500);color:#4a2f00}
.rk.r2{background:linear-gradient(135deg,#e2e8f0,#b6c0cf);color:#2b3444}
.rk.r3{background:linear-gradient(135deg,#f0b787,#d08850);color:#3d2100}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:start}
.cal .dw{text-align:center;font-size:10.5px;font-weight:800;color:var(--tx3);padding:6px 0}
.cal .dw.s{color:var(--dan)}.cal .dw.u{color:var(--pri)}
.cel{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.13s}
.cel:hover{border-color:var(--line2);background:#fafbfd}
.cel.off{background:#f4f6f9;opacity:.7}
.cel.tod{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.cel.hol{background:#fff7f6}
.cel .dn{font-size:11px;font-weight:800;color:var(--tx2)}
.cel .dn.s{color:var(--dan)}.cel .dn.u{color:var(--pri)}
.cel .ev{font-size:9.5px;font-weight:700;padding:2px 4px;border-radius:4px;line-height:1.35;
  white-space:normal;word-break:break-all}
.ev.r{background:var(--dan-soft);color:var(--dan)}
.ev.y{background:var(--warn-soft);color:var(--warn)}
.ev.g{background:var(--ok-soft);color:var(--ok)}
.ev.p{background:var(--pur-soft);color:var(--pur)}
.ev.b{background:var(--pri-soft);color:var(--pri)}
@media(max-width:560px){.cel{min-height:52px;padding:3px}.cel .ev{font-size:8px;padding:1px 3px}}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .16s}
@keyframes fi{from{opacity:0}}
.mod{background:#fff;border-radius:18px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(16,24,40,.25);animation:su .2s cubic-bezier(.2,.9,.3,1)}
.mod.wide{max-width:760px}
@keyframes su{from{transform:translateY(18px);opacity:0}}
.mod-h{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;z-index:2}
.mod-h h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.mod-h .sp{flex:1}
.mod-b{padding:18px}
.mod-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;
  position:sticky;bottom:0;background:#fff}
.mod-f .btn{flex:1}
.xbtn{width:30px;height:30px;border-radius:9px;background:#f0f2f6;display:flex;align-items:center;
  justify-content:center;color:var(--tx2);font-size:17px;line-height:1}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 480px at 50% -10%,#e6eeff,transparent 70%)}
.auth-box{width:100%;max-width:392px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .ic{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--pri),var(--pur));
  display:flex;align-items:center;justify-content:center;margin:0 auto 13px;font-size:27px;
  box-shadow:0 8px 26px rgba(47,107,255,.28)}
.auth-logo h1{margin:0 0 5px;font-size:21px;font-weight:800;letter-spacing:-.6px}
.auth-logo p{margin:0;font-size:12.5px;color:var(--tx3)}

/* ---------- misc ---------- */
.upl{border:1.5px dashed var(--line2);border-radius:var(--r);padding:22px 14px;text-align:center;
  cursor:pointer;transition:.14s;background:#fafbfd}
.upl:hover{border-color:var(--pri);background:var(--pri-soft)}
.upl .ic{font-size:26px;margin-bottom:7px;opacity:.7}
.upl .t{font-size:13px;font-weight:700}
.upl .s{font-size:11px;color:var(--tx3);margin-top:3px}
.thumb{width:100%;border-radius:var(--rs);border:1px solid var(--line);display:block}
.thumb.sm{width:64px;height:64px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:300;background:#171b23;
  color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;
  font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.25);animation:tin .2s;max-width:88vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,14px);opacity:0}}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--dan)}
.divider{height:1px;background:var(--line);margin:14px 0}
.mono{font-variant-numeric:tabular-nums}
.acct{background:#f7f9fc;border:1px dashed var(--line2);border-radius:var(--rs);padding:12px 14px;
  display:flex;align-items:center;gap:10px}
.acct .t{flex:1;font-size:13.5px;font-weight:700;word-break:break-all}
.sw{position:relative;width:42px;height:24px;flex:0 0 auto;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .tr{position:absolute;inset:0;background:#dfe4ec;border-radius:999px;transition:.16s}
.sw .tr:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.16s;box-shadow:var(--sh-s)}
.sw input:checked + .tr{background:var(--pri)}
.sw input:checked + .tr:before{transform:translateX(18px)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:12px;border:1px solid}
.banner.i{background:var(--pri-soft);border-color:#cfdcff;color:#1a4bc0}
.banner.w{background:var(--warn-soft);border-color:#ffe0b3;color:#8a5300}
.banner.d{background:var(--dan-soft);border-color:#f7cdc9;color:#9b2018}
.banner.s{background:var(--ok-soft);border-color:#bfe6cf;color:#0b7a44}
.banner b{color:inherit}
.cnt{display:flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);overflow:hidden}
.cnt button{width:40px;height:40px;font-size:18px;font-weight:700;color:var(--tx2);background:#f4f6f9}
.cnt button:hover{color:var(--pri)}
.cnt .v{flex:1;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.hide{display:none !important}
.scroll-x{overflow-x:auto;display:flex;gap:8px;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.ck{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--rs);background:#fff;margin-bottom:7px;transition:.13s}
.ck.done{background:var(--ok-soft);border-color:#bfe6cf}
.ck .box{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;
  font-size:13px;color:#fff;font-weight:900;margin-top:1px}
.ck.done .box{background:var(--ok);border-color:var(--ok)}
.ck .tx{flex:1;font-size:13.5px;line-height:1.45;word-break:break-word}
.ck.done .tx{color:var(--ok);text-decoration:line-through;text-decoration-color:rgba(15,157,88,.4)}
.ck .del{color:var(--tx3);font-size:15px;padding:0 3px;line-height:1}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid .ph{position:relative;aspect-ratio:1;border-radius:var(--rs);overflow:hidden;
  border:1px solid var(--line);background:#f4f6f9}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid .ph .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.photo-grid .add{aspect-ratio:1;border:1.5px dashed var(--line2);border-radius:var(--rs);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--tx3);font-size:11px;font-weight:700;background:#fafbfd}
.photo-grid .add:hover{border-color:var(--pri);color:var(--pri)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
/* ============================================================================
   팀 근태 · 벌금 관리 시스템 v2  (Supabase + GitHub + Vercel)
   ============================================================================ */

/* ============================ 등급 ============================ */
const GRADES = {
  "후보자": { fine: false, admin: false, tl: false, color: "n", desc: "시스템 사용 · 벌금 면제" },
  "AP":    { fine: true,  admin: false, tl: false, color: "b", desc: "벌금 적용" },
  "TL":    { fine: true,  admin: false, tl: true,  color: "p", desc: "벌금 적용 · 담당 인원 관리" },
  "SM":    { fine: false, admin: true,  tl: true,  color: "g", desc: "관리자 전권 · 벌금 미적용" }
};
const GRADE_ORDER = ["후보자", "AP", "TL", "SM"];
function gradeOf(u) { return (u && GRADES[u.grade]) ? u.grade : "후보자"; }
function gradeInfo(u) { return GRADES[gradeOf(u)]; }

/* ============================ 기본 설정값 ============================ */
const DEFAULT_SETTINGS = {
  checkinOpen: "05:00",        // 이 시각부터 출근 사진 등록 가능
  workStart: "08:00",          // (기본) 출근 기준 시각
  absentBy: "08:50",           // 이 시각까지 미출근이면 결근 처리
  absentFine: 50000,           // 결근(미출근) 벌금
  absentBy2: "10:00",          // 이 시각까지도 출근 사진이 없으면(또는 이 시각 이후에야 등록하면) 상향된 결근 벌금 적용
  absentFine2: 100000,         // 2차(오전 10시) 결근 벌금
  latePerMin: 1000,            // (기본) 지각 1분당
  lateMax: 50000,              // (기본) 지각 상한
  photoMin: 3,                 // 하루 최소 워킹사진 수
  photoFine: 10000,
  photoFrom: "10:00",          // 워킹사진 인정 시작

/* ============================ 유틸 ============================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const pad = n => String(n).padStart(2, "0");

function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function dow(s) { return parseD(s).getDay(); }
const DOWK = ["일", "월", "화", "수", "목", "금", "토"];
function fmtD(s) { const d = parseD(s); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOWK[d.getDay()] + ")"; }
function fmtDL(s) { const d = parseD(s); return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " (" + DOWK[d.getDay()] + ")"; }
function hm2min(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function tsHM(ts) { if (!ts) return null; const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function tsFmt(ts) { if (!ts) return "-"; const d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function tsFmtFull(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
/** 날짜 s 의 HH:MM 시각을 ms 로 */
function atTime(s, hm) { const [h, m] = hm.split(":").map(Number); const d = parseD(s); d.setHours(h, m, 0, 0); return d.getTime(); }
function initial(n) { return (n || "?").trim().slice(-2); }
function uid8() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function monthOf(s) { return s.slice(0, 7); }
function prevMonth(ym) {
  let [y, m] = ym.split("-").map(Number); m--; if (m < 1) { m = 12; y--; }
  return y + "-" + pad(m);
}

function toast(msg, kind) {
  $$(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function compressImage(file, maxW, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, (maxW || 900) / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = quality || 0.72, out = c.toDataURL("image/jpeg", q);
        while (out.length > 700000 && q > 0.3) { q -= 0.12; out = c.toDataURL("image/jpeg", q); }
        res(out);
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ============================ 근무일 / 대상일 ============================ */
function isWorkday(date, holidays) {
  const h = holidays[date];
  if (h && typeof h.work === "boolean") return h.work;
  const w = dow(date);
  // 요일별 기본 근무일 여부는 관리자 설정(S.workDays, 0=일~6=토)을 따른다 - 기본값은 월~금.
  // 특정 날짜만 다르게 하고 싶으면(임시 휴무/특근 등) 위 holidays 오버라이드를 쓰면 된다.
  const S = SET();
  const wd = Array.isArray(S.workDays) && S.workDays.length ? S.workDays : [1, 2, 3, 4, 5];
  return wd.indexOf(w) !== -1;
}
function holidayName(date, holidays) { const h = holidays[date]; return h && h.name ? h.name : ""; }

/** 지금 보고해야 할 "다음 근무일" — 대상일 08:00 이 지나면 그 다음 근무일로 넘어감 */
function nextReportDate(H, S) {
  const roll = (S && S.reportRollover) || "08:00";
  let d = today();
  for (let i = 0; i < 40; i++) {
    if (isWorkday(d, H) && Date.now() < atTime(d, roll)) return d;
    d = addDays(d, 1);
  }
  return d;
}

/** 출근보고 마감 시각(ms) */
function reportDeadlineTs(date, type, S) {
  if (type === "개직") return atTime(date, S.gaejikDeadline || "03:00");
  return atTime(addDays(date, -1), S.reportDeadline || "22:00");
}

/* ============================================================================
   벌금 규칙 엔진 v2
   ============================================================================ */
function computeDay(date, daily, S, H, user, beforeEffective) {
  const out = [];
  if (!isWorkday(date, H)) return out;
  if (user && !gradeInfo(user).fine) return out;        // 후보자 등급은 전면 면제

  const past = date < today();
  const d = daily || {};
  const type = d.type || null;
  const rule = typeRule(S, type);

  /* 1) 출근보고 — 전날 마감까지 다음날 근무유형 선택
     마감(전날 22:00)이 지나면 그 순간 바로 확정 벌금으로 잡히고, 다음날까지 기다리지 않는다.
     beforeEffective(가입 당일인데 정식 집계 시작은 다음날부터인 경우)면 건너뛴다 - 이 날은
     아직 정식으로 보고 의무가 생기기 전이라 "제출 안 함"을 벌금으로 묻지 않는다. */
  if (!beforeEffective && (S.reportForAll || type !== "개직")) {
    if (!type) {
      const dl0 = reportDeadlineTs(date, "출근", S);
      out.push({ kind: "report", amount: S.reportFine, reason: past ? "출근보고 미제출" : "아직 미제출", pending: Date.now() <= dl0 });
    } else {
      const dl = reportDeadlineTs(date, type, S);
      if (d.reportAt && d.reportAt > dl)
        out.push({ kind: "report", amount: S.reportFine, reason: "마감 후 제출 (" + tsFmt(d.reportAt) + ")" });
    }
  }

  /* 2) 출근 — 사진 업로드 시각 기준 지각 / 미출근
     - upAt(체크인)이 있으면 "실제로 한 행동"에 대한 평가이므로 beforeEffective여도 평가한다.
       단, 2차 마감(기본 10:00)을 넘겨서야 등록했다면 지각이 아니라 미출근으로 취급해
       상향된 벌금(기본 10만원)을 매긴다 - 사진을 아예 안 올리는 것과 실질적으로 같은
       상황이기 때문에, 뒤늦게라도 사진만 올리면 벌금이 오히려 줄어드는 허점을 막는다.
     - upAt이 아예 없으면 "안 한 것"에 대한 벌금이므로 beforeEffective인 날은 면제한다. */
  if (rule.late) {
    const upAt = d.checkinAt || null;
    const cut2 = atTime(date, S.absentBy2 || "10:00");
    if (upAt) {
      if (upAt > cut2) {
        out.push({ kind: "absent", amount: S.absentFine2,
                   reason: (S.absentBy2 || "10:00") + " 마감 이후 등록 (" + tsFmt(upAt) + ") · 미출근 처리" });
      } else {
        const hm = tsHM(upAt);
        const diff = hm2min(hm) - hm2min(rule.start);
        if (diff > 0)
          out.push({ kind: "late", amount: Math.min(diff * rule.perMin, rule.max),
                     reason: hm + " 등록 · 기준 " + rule.start + " 대비 " + diff + "분 초과" });
      }
    } else if (!beforeEffective) {
      const cut1 = atTime(date, S.absentBy || "08:50");
      if (Date.now() > cut2)
        out.push({ kind: "absent", amount: S.absentFine2,
                   reason: (S.absentBy2 || "10:00") + " 까지 출근사진 미등록" });
      else if (Date.now() > cut1)
        out.push({ kind: "absent", amount: S.absentFine,
                   reason: (S.absentBy || "08:50") + " 까지 출근사진 미등록" });
    }
  }

  /* 3) 워킹사진 보고 — 인정 시간대(기본 10:00~23:59)가 끝나는 순간 바로 확정 벌금으로 잡힌다.
     (부족한 채로 사진을 올리기 시작했어도, 아직 인정 시간대가 남아있으면 더 채울 수 있으니
     그 시간대가 끝나기 전까지는 "진행중"으로만 표시하고 확정하지 않는다.) */
  if (!beforeEffective && rule.photo) {
    const cnt = photoOkCount(d, date, S);
    const dayEnd = atTime(date, S.photoTo || "23:59") + 59999;
    if (cnt < S.photoMin && (past || Date.now() > dayEnd || cnt > 0))
      out.push({ kind: "photo", amount: S.photoFine,
                 reason: "워킹사진 " + cnt + "/" + S.photoMin + "장 (" + (S.photoFrom || "10:00") + "~" + (S.photoTo || "23:59") + " 인정)",
                 pending: Date.now() <= dayEnd });
  }

  /* 4) 일마감 — 인정 시간대(기본 13:00~23:59)가 끝나는 순간 바로 확정 벌금으로 잡힌다.
     단, 여행/휴가 기간으로 신청한 개직(d.gaejikTrip)은 "전체 적용" 설정(closingForAll)과
     무관하게 일마감 의무 자체를 면제한다 - 하루짜리 일반 개직은 이 예외를 타지 않으므로
     기존 동작(설정에 따라 일마감 여전히 필요) 그대로 유지된다. */
  if (!beforeEffective && !d.gaejikTrip && (S.closingForAll || type !== "개직")) {
    const from = atTime(date, S.closingFrom || "13:00");
    const to = atTime(date, S.closingTo || "23:59") + 59000;
    const saved = d.closingSavedAt || 0;
    const ok = saved >= from && saved <= to;
    if (!ok)
      out.push({ kind: "closing", amount: S.closingFine,
                 reason: past ? "일마감 미실행 (" + (S.closingFrom || "13:00") + "~" + (S.closingTo || "23:59") + ")"
                              : "아직 미실행", pending: Date.now() <= to });
  }
  return out;
}

/** 유형별 출근 규칙 (기준시각 / 분당 / 상한) */
function typeRule(S, type) {
  const base = { late: true, photo: true, start: S.workStart, perMin: S.latePerMin, max: S.lateMax };
  const r = (S.typeRules && S.typeRules[type]) || {};
  return {
    late: r.late !== undefined ? r.late : base.late,
    photo: r.photo !== undefined ? r.photo : base.photo,
    start: r.start || base.start,
    perMin: Number(r.perMin || base.perMin),
    max: Number(r.max || base.max)
  };
}
/** 워킹사진 정규화 — 과거 문자열 배열도 지원 */
function photoList(d) {
  return ((d && d.photos) || []).map(x => (typeof x === "string" ? { u: x, at: null } : x)).filter(x => x && x.u);
}
/** 인정 시간대(기본 10:00~23:59) 안에 올린 사진 수 */
function photoOkCount(d, date, S) {
  const from = atTime(date, S.photoFrom || "10:00");
  const to = atTime(date, S.photoTo || "23:59") + 59999;
  return photoList(d).filter(x => x.at == null || (x.at >= from && x.at <= to)).length;
}

/** 이 사람의 벌금 집계 시작일 — 가입 시점 이후부터만 */
function joinStart(u, S) {
  if (!u || !u.joinedAt) return "";
  const jd = dstr(new Date(u.joinedAt));
  // 그날 출근 등록창(기본 05:00)이 열리기 전에 가입했다면 당일부터, 아니면 다음날부터
  const base = u.joinedAt <= atTime(jd, (S && S.checkinOpen) || "05:00") ? jd : addDays(jd, 1);
  // feeStart: 벌금이 면제되는 등급(후보자/SM)에서 벌금이 적용되는 등급(AP/TL)으로 승급된 시점.
  // 가입일보다 늦게 승급된 기존 회원이라면 승급일부터만 집계해, 승급 이전 과거 기간에
  // 벌금이 소급 적용되지 않게 한다. 새로 가입한 사람은 feeStart가 없으므로 가입일 그대로 적용된다.
  return (u.feeStart && u.feeStart > base) ? u.feeStart : base;
}

function fineId(uid, date, kind) { return uid + "__" + date + "__" + kind; }
function dayId(uid, date) { return uid + "__" + date; }

/** r: { id, name, role, grade, birth, bday_year, gaejik, checklist, tl_members,
 *        last_grant, disabled, joined_at } - merged from get_team_names() + attendance_profiles */
function rowToUser(r) {
  return {

    birth: r.birth || "", grade: r.role === "admin" ? "SM" : (r.grade || "후보자"),
    role: r.role, approved: true, disabled: !!r.disabled,
    gaejik: Number(r.gaejik || 0), bdayYear: Number(r.bday_year || 0),
    checklist: Array.isArray(r.checklist) ? r.checklist : [],
    tlMembers: Array.isArray(r.tl_members) ? r.tl_members : [],
    lastGrant: r.last_grant || "",
    feeStart: r.fee_start || "",
    hidden: !!r.hidden,
    joinedAt: r.joined_at ? new Date(r.joined_at).getTime() : 0
  };
}
/** attendance_profiles 컬럼으로만 매핑 (이름/이메일/포인트는 기존 profiles 테이블을 그대로 쓰므로 여기서 다루지 않음) */
function userToAttendanceRow(d) {
  const o = {};
  if ("birth" in d) o.birth = d.birth || null;
  if ("grade" in d) o.grade = d.grade;
  if ("disabled" in d) o.disabled = !!d.disabled;
  if ("gaejik" in d) o.gaejik = Number(d.gaejik || 0);
  if ("bdayYear" in d) o.bday_year = Number(d.bdayYear || 0);
  if ("checklist" in d) o.checklist = d.checklist || [];
  if ("tlMembers" in d) o.tl_members = d.tlMembers || [];
  if ("lastGrant" in d) o.last_grant = d.lastGrant || null;
  if ("feeStart" in d) o.fee_start = d.feeStart || null;
  if ("hidden" in d) o.hidden = !!d.hidden;
  return o;
}
function rowToDoc(r) { return Object.assign({}, r.data || {}, { id: r.id }); }

const DB = {
  mode: "demo", ready: false, sb: null,
  cache: { users: {}, daily: {}, fines: {}, glog: {}, holidays: {}, settings: {} },
  subs: [],
  onChange(fn) { this.subs.push(fn); },
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
};

DB.loadAll = async function () {
  const jobs = Object.keys(TABLES).map(async col => {
    const T = TABLES[col];
    const { data, error } = await this.sb.from(T.table).select("*");
    if (error) { console.warn("load " + col, error.message); return; }
    const o = {};
    (data || []).forEach(r => { const d = rowToDoc(r); o[d.id] = d; });
    this.cache[col] = o;
  });
  jobs.push((async () => {
    const [namesRes, attRes] = await Promise.all([
      this.sb.rpc("get_team_names"),
      this.sb.from("attendance_profiles").select("*"),
    ]);
    if (namesRes.error) { console.warn("load users", namesRes.error.message); return; }
    const attByUid = {};
    (attRes.data || []).forEach(r => { attByUid[r.uid] = r; });
    const o = {};
    (namesRes.data || []).forEach(n => {
      const a = attByUid[n.id] || {};
      const merged = rowToUser(Object.assign({}, a, { id: n.id, name: n.name, role: n.role }));
      o[merged.id] = merged;
    });
    this.cache.users = o;
  })());
  await Promise.all(jobs);
  this.ready = true;
  this.emit();
};

DB.subscribeRT = function () {
  const ch = this.sb.channel("teamfine");
  Object.keys(TABLES).forEach(col => {
    const T = TABLES[col];
    ch.on("postgres_changes", { event: "*", schema: "public", table: T.table }, payload => {
      try {
        if (payload.eventType === "DELETE") {
          const oid = payload.old && (T.json ? payload.old.id : payload.old.uid);
          if (oid) delete this.cache[col][oid];
        } else {
          const d = T.json ? rowToDoc(payload.new) : rowToUser(payload.new);
          this.cache[col][d.id] = d;
        }
        this.emit();
      } catch (e) { console.error(e); }
    });
  });
  ch.subscribe();
};

/** daily/fines/glog/holidays/settings 는 id 기준 upsert, users(attendance_profiles) 는 uid 기준 upsert */
DB.set = async function (col, id, data) {
  if (this.mode !== "sb") {
    this.cache[col][id] = Object.assign({}, this.cache[col][id] || {}, data, { id });
    this.emit(); return;
  }
  const prev = this.cache[col][id] || {};
  const merged = Object.assign({}, prev, data, { id });
  this.cache[col][id] = merged;
  this.emit();

  let error = null;
  if (col === "users") {
    const patch = userToAttendanceRow(data);
    if (Object.keys(patch).length) {
      const row = Object.assign({ uid: id }, patch);
      ({ error } = await this.sb.from("attendance_profiles").upsert(row, { onConflict: "uid" }));
    }
  } else {
    const T = TABLES[col];
    const body = Object.assign({}, merged); delete body.id;
    const row = { id, data: body };
    if (T.uid) row.uid = body.uid || null;
    if (T.date) row.date = body.date || null;
    ({ error } = await this.sb.from(T.table).upsert(row, { onConflict: "id" }));
  }
  if (error) {
    if (prev.id) this.cache[col][id] = prev; else delete this.cache[col][id];
    this.emit();
    throw new Error(error.message);
  }
};

DB.del = async function (col, id) {
  if (this.mode !== "sb") { delete this.cache[col][id]; this.emit(); return; }
  if (col === "users") {
    const { error } = await this.sb.from("attendance_profiles").delete().eq("uid", id);
    if (error) throw new Error(error.message);
    delete this.cache[col][id]; this.emit(); return;
  }
  const T = TABLES[col];
  const { error } = await this.sb.from(T.table).delete().eq("id", id);
  if (error) throw new Error(error.message);
  delete this.cache[col][id]; this.emit();
};
DB.add = async function (col, data) {
  const id = uid8();
  await this.set(col, id, Object.assign({}, data, { id }));
  return id;
};
DB.get = function (col, id) { return this.cache[col][id] || null; };
DB.all = function (col) { return Object.values(this.cache[col]); };

DB.uploadImage = async function (dataUrl, folder) {
  if (this.mode !== "sb") return dataUrl;
  try {
    const bin = atob(dataUrl.split(",")[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const path = (Auth.user ? Auth.user.uid : "anon") + "/" + (folder || "img") + "-" + uid8() + ".jpg";
    const { error } = await this.sb.storage.from("attendance-proofs")
      .upload(path, new Blob([arr], { type: "image/jpeg" }), { contentType: "image/jpeg" });
    if (error) { console.warn("upload", error.message); return dataUrl; }
    const { data } = await this.sb.storage.from("attendance-proofs").createSignedUrl(path, 60 * 60 * 24 * 365);
    return (data && data.signedUrl) || dataUrl;
  } catch (e) { console.warn(e); return dataUrl; }
};

function SET() { return Object.assign({}, DEFAULT_SETTINGS, DB.get("settings", "global") || {}); }
function HOLIDAYS() { return DB.cache.holidays; }
function USERS() { return DB.all("users").sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")); }
function ACTIVE_USERS() { return USERS().filter(u => u.approved && !u.disabled); }

function collectFines(opt) {
  opt = opt || {};
  const S = SET(), H = HOLIDAYS();
  const users = opt.uid ? USERS().filter(u => u.uid === opt.uid) : ACTIVE_USERS();
  const tdy = today();
  let from = opt.from || S.startDate || "";
  let to = opt.to || tdy;
  if (to > tdy) to = tdy;
  const list = [];

  users.forEach(u => {
    let start = from || addDays(tdy, -60);
    const js = joinStart(u, S);              // 정식 벌금 집계 시작일 (feeStart/가입시각 반영, 늦게 가입했으면 다음날부터)
    // 가입 시각이 늦어(예: 오후에 가입) js가 다음날로 밀렸더라도, 실제 가입한 그날 스스로
    // 체크인을 했다면(=행동을 한 경우) 그 지각 여부만은 평가해야 하므로 반복 시작일을
    // 실제 가입일까지 앞당긴다. computeDay에는 beforeEffective를 넘겨 "안 한 것"에 대한
    // 벌금(미출근/보고/사진/일마감)은 여전히 js 이전엔 적용되지 않도록 막는다.
    const raw = u && u.joinedAt ? dstr(new Date(u.joinedAt)) : "";
    let loopStart = js;
    if (raw && (!js || raw < js) && raw >= start) loopStart = raw;
    if (loopStart && loopStart > start) start = loopStart;
    if (start > to) { return; }              // 가입 전 구간만 요청된 경우 → 벌금 없음
    let d = start;
    let guard = 0;
    while (d <= to && guard++ < 800) {
      const daily = DB.get("daily", dayId(u.uid, d));
      const beforeEffective = !!(js && d < js);
      computeDay(d, daily, S, H, u, beforeEffective).forEach(f => {
        const id = fineId(u.uid, d, f.kind);
        const ov = DB.get("fines", id) || {};
        if (ov.deleted) return;
        list.push({
          id, uid: u.uid, name: u.name, date: d, kind: f.kind,
          amount: ov.amount != null ? ov.amount : f.amount,
          reason: ov.memo || f.reason,
          pending: !!f.pending, waived: !!ov.waived,
          status: ov.status || "unpaid",
          proof: ov.proof || null, proofAt: ov.proofAt || null,
          confirmedAt: ov.confirmedAt || null, confirmedBy: ov.confirmedBy || null,
          batch: ov.batch || null, auto: true, pointsDeducted: !!ov.pointsDeducted,
          pointsUsed: Number(ov.pointsUsed || 0), pointsUsedAt: ov.pointsUsedAt || null
        });
      });
      d = addDays(d, 1);
    }
  });

  DB.all("fines").filter(f => f.manual && !f.deleted).forEach(f => {
    if (opt.uid && f.uid !== opt.uid) return;
    if (f.date < (from || "0000") || f.date > to) return;
    const u = DB.get("users", f.uid);
    list.push({
      id: f.id, uid: f.uid, name: (u && u.name) || "?", date: f.date,
      kind: f.kind || "etc", amount: f.amount || 0, reason: f.memo || "관리자 추가",
      pending: false, waived: !!f.waived, status: f.status || "unpaid",
      proof: f.proof || null, proofAt: f.proofAt || null,
      confirmedAt: f.confirmedAt || null, confirmedBy: f.confirmedBy || null,
      batch: f.batch || null, auto: false, pointsDeducted: !!f.pointsDeducted,
      pointsUsed: Number(f.pointsUsed || 0), pointsUsedAt: f.pointsUsedAt || null
    });
  });

  list.sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name, "ko"));
  return list;
}
function sumFines(list, filter) {
  return list.filter(f => !f.waived && !f.pending).filter(filter || (() => true))
    .reduce((s, f) => s + (f.amount || 0), 0);
}
/** 확정된 미납 벌금 (즉시 납부 알림 대상) */
function unpaidOf(uid) {
  return collectFines({ uid }).filter(f => !f.waived && !f.pending && f.status === "unpaid");
}
/** 오늘 이미 벌금 대체 납입에 사용한 포인트 합계 (일일 한도 20,000P 체크용, 화면 표시용 -
 *  실제 한도 초과 여부는 attendance_deduct_points_for_fine RPC가 서버에서 최종 검증한다) */
function pointsUsedToday(uid) {
  const tdy = today();
  return DB.all("fines")
    .filter(f => f.uid === uid && f.pointsUsedAt && dstr(new Date(f.pointsUsedAt)) === tdy)
    .reduce((s, f) => s + Number(f.pointsUsed || 0), 0);
}

/* ============================ 개직 변동 ============================ */
/** 관리자가 다른 회원의 개직을 조정할 때 쓴다(관리자 전용 - attendance_profiles 직접 upsert,
 *  RLS상 관리자만 허용됨). 본인 스스로의 개직 사용/환급(보고 화면에서 "개직" 선택)은 이 함수가
 *  아니라 아래 useMyGaejik()을 써야 한다 - 일반 회원은 이 함수로 자기 자신을 호출해도
 *  attendance_profiles RLS(관리자만 수정 가능)에 막혀 "권한이 없습니다" 오류가 난다. */
async function changeGaejik(uid, delta, reason, auto) {
  const u = DB.get("users", uid); if (!u) return;
  const after = Number(u.gaejik || 0) + delta;
  await DB.set("users", uid, { gaejik: after });
  await DB.add("glog", {
    uid, name: u.name, delta, after, reason,
    auto: !!auto, by: (Auth.profile && Auth.profile.name) || "시스템",
    at: Date.now(), date: today()
  });
}

/** 회원 본인이 자기 개직을 쓰거나(-1) 취소/환급(+1)할 때 쓴다. attendance_profiles는
 *  관리자만 수정할 수 있게 RLS가 걸려있어(위 changeGaejik처럼 직접 upsert하면 거부됨),
 *  본인 행만 안전하게 건드리는 서버 RPC(attendance_use_my_gaejik)를 거친다. 성공하면
 *  실시간 구독이 따로 갱신해주기 전에도 화면에 바로 반영되도록 로컬 캐시를 낙관적으로
 *  패치한다. */
async function useMyGaejik(delta, reason) {
  const r = await attendanceUseMyGaejik(delta, reason);
  if (!r.ok) throw new Error(r.message);
  const uid = Auth.user.uid;
  const u = DB.cache.users[uid];
  if (u) u.gaejik = r.gaejik;
  if (Auth.profile && Auth.profile.uid === uid) Auth.profile.gaejik = r.gaejik;
  DB.emit();
  return r.gaejik;
}

function cleanErr(e) {
  const m = String((e && e.message) || e);
  if (/already registered|already been registered|User already/i.test(m)) return "이미 가입된 이메일입니다.";
  if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다.";
  if (/Email not confirmed/i.test(m)) return "이메일 인증을 먼저 완료해주세요.";
  if (/Password should be at least/i.test(m)) return "비밀번호는 6자 이상이어야 합니다.";
  if (/Unable to validate email|invalid format/i.test(m)) return "이메일 형식이 올바르지 않습니다.";
  if (/row-level security|permission denied|권한이 없습니다/i.test(m)) return "권한이 없습니다. 관리자만 가능한 작업입니다.";
  if (/relation .* does not exist|schema cache|column .* does not exist/i.test(m))
    return "데이터베이스 설정이 최신이 아닙니다. 관리자에게 문의해주세요.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "네트워크 연결을 확인해주세요.";
  return m;
}

      (o.onOk ? '<button class="btn pri" id="mO">' + esc(o.okText || "저장") + "</button>" : "") +
      "</div>") + "</div>";
  document.body.appendChild(el);
  if (!o.noClose) el.onclick = e => { if (e.target === el) closeModal(); };
  const x = $("#mX"); if (x) x.onclick = closeModal;
  const c = $("#mC"); if (c) c.onclick = closeModal;
  const ok = $("#mO");
  if (ok) ok.onclick = async () => {
    ok.disabled = true;
    try { const r = await o.onOk(); if (r !== false) closeModal(); else ok.disabled = false; }
    catch (e) { toast(cleanErr(e), "err"); ok.disabled = false; }
  };
  if (o.after) o.after();
  return el;
}
function closeModal() { const e = $("#ovl"); if (e) e.remove(); }
function confirmM(msg, onYes) {
  modal({ title: "확인", body: '<div style="font-size:14px;line-height:1.6">' + msg + "</div>",
    okText: "확인", cancelText: "취소", onOk: async () => { await onYes(); } });
}

}

      '<div style="margin-top:9px"><button class="btn pri sm" data-nav="report">지금 선택하기</button></div></div>';
  }

  /* 오늘 체크리스트 */
  if (wToday) {
    const rule = typeRule(S, dToday.type);
    const items = [];
    if (rule.late) {
      const at = dToday.checkinAt;
      const hm = tsHM(at);
      const diff = at ? hm2min(hm) - hm2min(rule.start) : null;
      const absentCut = atTime(tdy, S.absentBy);

  h += '<div class="sec-t">내 최근 벌금</div><div class="card pad0">' +
    (recent.length ? recent.map(fineRow).join("") : '<div class="empty">아직 벌금 내역이 없습니다 👏</div>') + "</div>";
  return h;

function fineBadge(f) {

}

    const overCut2 = at ? at > cut2 : Date.now() > cut2;
    return { u, d, r, at, hm, diff, overCut2 };

      const late = r.diff > 0 && !r.overCut2;

          ? '<img src="' + r.d.checkinPhoto + '" class="thumb sm" style="cursor:pointer" data-img="' + r.d.checkinPhoto + '" data-imgt="' + esc(r.u.name) + ' 출근 · ' + (r.hm || "") + '">'
          : '<div class="thumb sm" style="display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:20px">—</div>') +
        '<div class="sp"><div class="nm">' +
        (canOpenProfile(r.u.uid)
          ? '<span class="lnk" data-profile="' + r.u.uid + '" style="cursor:pointer;text-decoration:underline;text-underline-offset:2px">' + esc(r.u.name) + "</span>"
          : esc(r.u.name)) +
        (r.d.type ? ' <span class="bdg ' + TYPES[r.d.type].color + '">' + r.d.type + "</span>" : "") + "</div>" +
        '<div class="ds">' + (r.at ? "등록 " + r.hm + " · 기준 " + r.r.start + (r.overCut2 ? " · " + (S.absentBy2 || "10:00") + " 마감 후" : late ? " · " + r.diff + "분 초과" : " · 정상") : "미등록") + "</div></div>" +
        '<div style="text-align:right">' +
        (exempt ? '<span class="bdg n">미적용</span>'
          : r.overCut2 ? '<span class="bdg r">' + won(S.absentFine2) + "</span>"
          : r.at ? (late ? '<span class="bdg r">' + won(Math.min(r.diff * r.r.perMin, r.r.max)) + "</span>" : '<span class="bdg g">정상</span>')
          : (Date.now() > atTime(date, S.absentBy) ? '<span class="bdg r">미출근</span>' : '<span class="bdg y">대기</span>')) +
        (admin ? '<div style="margin-top:5px"><input class="inp" type="time" style="padding:4px 6px;font-size:11.5px;width:98px" value="' +
          (r.hm || "") + '" data-ct="' + r.u.uid + '"></div>' : "") +
        "</div></div>" +
        (extra.length || r.d.reasonPhoto
          ? '<div style="padding:0 14px 12px 14px">' +
            (extra.length ? '<div class="banner i" style="margin:0 0 8px;font-size:12px">' + extra.join("<br>") + "</div>" : "") +
            (r.d.reasonPhoto ? '<img src="' + r.d.reasonPhoto + '" class="thumb" style="max-width:220px;cursor:pointer" data-img="' + r.d.reasonPhoto + '" data-imgt="' + esc(r.u.name) + ' 직출 증빙">' : "") +
            "</div>" : "") +
        "</div>";
    }).join("") : '<div class="empty">승인된 팀원이 없습니다</div>') + "</div>";

  if (admin) h += '<div class="hint" style="margin-top:8px">관리자는 시각 칸을 직접 고쳐 저장할 수 있습니다. 비우면 미등록 처리됩니다.</div>';
  return h;
}

function bindCheckin() {
  const p = Auth.profile, S = SET();
  $("#ckPrev").onclick = () => { App.checkDate = addDays(App.checkDate, -1); render(); };
  const nx = $("#ckNext");
  if (nx) nx.onclick = () => { if (App.checkDate < today()) { App.checkDate = addDays(App.checkDate, 1); render(); } };
  $("#ckToday").onclick = () => { App.checkDate = today(); render(); };
  $("#ckDate").onchange = e => { App.checkDate = e.target.value > today() ? today() : e.target.value; render(); };

  const hol = $("#ckHol");
  if (hol) hol.onclick = async () => {
    const d = App.checkDate, H = HOLIDAYS(), cur = isWorkday(d, H), ex = H[d] || {};
    await DB.set("holidays", d, { date: d, name: ex.name || (dow(d) === 0 || dow(d) === 6 ? "주말 근무" : "공휴일"), work: !cur });
    toast(!cur ? "근무일로 지정됨" : "휴무일로 지정됨", "ok");
  };

  const file = $("#ckFile");
  const doUpload = () => file && file.click();
  const up = $("#ckUp"); if (up) up.onclick = doUpload;
  const re = $("#ckReUp"); if (re) re.onclick = doUpload;
  if (file) file.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const openTs = atTime(today(), S.checkinOpen || "05:00");
    if (Date.now() < openTs) { e.target.value = ""; return toast("출근 등록은 " + (S.checkinOpen || "05:00") + " 부터 가능합니다", "err"); }
    try {
      toast("사진 처리 중…");
      const raw = await compressImage(f, 900, .72);
      const url = await DB.uploadImage(raw, "checkin");
      const now = Date.now();
      await DB.set("daily", dayId(p.uid, today()), {
        uid: p.uid, date: today(), checkinPhoto: url, checkinAt: now, updatedAt: now
      });
      const myR = typeRule(S, (DB.get("daily", dayId(p.uid, today())) || {}).type);
      const diff = hm2min(tsHM(now)) - hm2min(myR.start);
      if (diff > 0) {
        const amt = Math.min(diff * myR.perMin, myR.max);
        toast("기준 " + myR.start + " 초과 " + diff + "분 · " + won(amt), "err");
        App.payShown = false;
        setTimeout(() => { const l = unpaidOf(p.uid); if (l.length) openPayModal(l, true); }, 700);
      } else toast("정상 출근 등록 완료 👍", "ok");
    } catch (er) { toast(cleanErr(er), "err"); }
  };

  $$("[data-ct]").forEach(el => el.onchange = async () => {
    const uid = el.dataset.ct, date = App.checkDate;
    let ts = null;
    if (el.value) { const [hh, mm] = el.value.split(":").map(Number); const d = parseD(date); d.setHours(hh, mm, 0, 0); ts = d.getTime(); }
    await DB.set("daily", dayId(uid, date), { uid, date, checkinAt: ts, checkinBy: Auth.profile.name, updatedAt: Date.now() });
    toast("저장됨", "ok");
  });

  $$("[data-profile]").forEach(el => el.onclick = e => { e.stopPropagation(); openMemberProfile(el.dataset.profile, App.checkDate); });
}

   보고 — 출근보고 · 워킹사진 · 일마감 체크리스트
   ============================================================================ */
let ckItems = null;      // 일마감 체크리스트 임시 상태
let ckItemsDate = null;  // ckItems가 어느 날짜(tdy) 것인지 - 자정을 넘겨 탭을 계속 열어두고
                          // 있어도 어제 체크리스트가 오늘 것인 양 계속 보이지 않도록 날짜가
                          // 바뀌면 새로 불러온다.

function todayItems(p, dToday, dateKey) {
  if (ckItems && ckItemsDate === dateKey) return ckItems;
  ckItemsDate = dateKey;
  if (Array.isArray(dToday.closingItems) && dToday.closingItems.length)
    ckItems = dToday.closingItems.map(x => ({ t: x.t, done: !!x.done }));
  else
    ckItems = (p.checklist || []).map(t => ({ t: typeof t === "string" ? t : (t.t || ""), done: false }));
  return ckItems;
}

/** 일마감 체크리스트를 지금 상태 그대로 저장한다. 체크/텍스트수정/추가/삭제를 할 때마다
 *  자동으로 호출되어(자세한 건 bindReport의 각 핸들러 참고), "저장하기"를 누르지 않아도
 *  탭을 닫거나 새로고침해도 방금까지 한 변경사항이 사라지지 않게 한다.
 *  closingSavedAt(벌금 면제 기준 시각)은 "인정 시간" 안에 있을 때만 갱신한다 - 그래야
 *  인정 시간 안에 이미 완료 처리를 받은 뒤, 인정 시간이 지나서 오탈자를 고치는 등의
 *  사소한 수정을 해도 그 완료 기록이 지워지고 벌금이 붙는 일이 생기지 않는다. */
async function saveClosing(p, tdy, S, items, opt) {
  opt = opt || {};
  const clean = items.filter(x => x.t);
  ckItems = clean;
  const now = Date.now();
  const from = atTime(tdy, S.closingFrom), to = atTime(tdy, S.closingTo) + 59000;
  const nowInWindow = now >= from && now <= to;
  const patch = { uid: p.uid, date: tdy, closingItems: clean, updatedAt: now };
  if (nowInWindow) patch.closingSavedAt = now;
  try {
    await DB.set("daily", dayId(p.uid, tdy), patch);
    // attendance_profiles(=users)는 본인이라도 테이블을 직접 update할 수 없고(RLS가 관리자
    // 전용) RPC로만 가능하다 - 예전에는 여기서 그냥 DB.set("users", ...)를 직접 호출해서
    // 관리자 계정만 조용히 성공하고 나머지 팀원은 전부 실패(에러가 삼켜져서 화면엔 아무 표시도
    // 안 됨)했다. 그래서 오늘 체크한 항목 자체(daily.closingItems)는 잘 저장돼도, "항목 목록"
    // 템플릿(users.checklist)이 저장 안 돼서 다음날 체크리스트가 통째로 빈 채로 떴던 것.
    const chk = await updateMyAttendanceChecklist(clean.map(x => x.t));
    if (!chk.ok) throw new Error(chk.message);
    const uid = p.uid, u = DB.cache.users[uid];
    if (u) u.checklist = clean.map(x => x.t);
    if (Auth.profile && Auth.profile.uid === uid) Auth.profile.checklist = clean.map(x => x.t);
    DB.emit();
  } catch (e) {
    toast("일마감 저장 실패: " + cleanErr(e), "err");
    return;
  }
  if (opt.toast) {
    const savedOk = nowInWindow || (() => {
      const cur = DB.get("daily", dayId(p.uid, tdy)) || {};
      return cur.closingSavedAt >= from && cur.closingSavedAt <= to;
    })();
    toast(savedOk ? "일마감 저장 완료 👍" : "저장됨 · 인정 시간(" + S.closingFrom + "~" + S.closingTo + ") 밖입니다", savedOk ? "ok" : "err");
  }
}

  // 마감 후 제출로 오판되어 벌금이 잘못 붙는 문제가 있었다 - 이 잠금은 그 상황 자체가
