        '<div class="hint" style="margin-bottom:6px">📌 예정된 여행</div>' +
        tripList.map(dates => '<div class="row" style="padding:8px 0">' +
          '<div class="sp"><div class="nm">' + fmtD(dates[0]) + ' ~ ' + fmtD(dates[dates.length - 1]) + '</div>' +
          '<div class="ds">평일 ' + dates.length + '일 · 개직 ' + dates.length + '개 사용</div></div></div>').join("") +
        "</div>" : "") +
      "</div>";
  }

  {
    // 워킹사진/일마감은 휴무일(주말·공휴일)이라고 화면에서 아예 숨기지 않는다 - 자유롭게 일할
    // 수도 있으니 항목은 언제나 열어두고, 그냥 휴무일에는 벌금만 적용되지 않는다는 안내만 준다.
    const wdToday = isWorkday(tdy, H);
    if (!wdToday) h += '<div class="banner n" style="margin-top:12px">🏖 오늘은 휴무일입니다 · 아래 기록은 자유롭게 남기셔도 벌금은 적용되지 않습니다.</div>';
    const rule = S.typeRules[dT.type] || { late: true, photo: true };

    /* 워킹사진 */
    if (rule.photo) {
      const photos = photoList(dT);
      const okCnt = photoOkCount(dT, tdy, S);
      const pFrom = atTime(tdy, S.photoFrom || "10:00"), pTo = atTime(tdy, S.photoTo || "23:59") + 59999;
      const inWin = Date.now() >= pFrom && Date.now() <= pTo;
      h += '<div class="sec-t">워킹사진 보고 · ' + fmtD(tdy) + "</div>" +
        '<div class="card"><div class="card-h"><h3>🖼 워킹사진</h3><div class="sp"></div>' +
        (okCnt >= S.photoMin ? '<span class="bdg g">완료</span>' : '<span class="bdg y">' + okCnt + "/" + S.photoMin + "</span>") + "</div>" +
        '<div class="banner ' + (okCnt >= S.photoMin ? "s" : inWin ? "i" : "w") + '">인정 시간 <b>' +
        (S.photoFrom || "10:00") + " ~ " + (S.photoTo || "23:59") + "</b> · " + S.photoMin + "장 이상이면 자동 완료 · 미달 시 " + won(S.photoFine) +
        (inWin ? "" : "<br>지금은 인정 시간이 아닙니다. 올려도 집계에 포함되지 않습니다.") + "</div>" +
        '<div class="photo-grid">' +
        photos.map((x, i) => {
          const good = x.at == null || (x.at >= pFrom && x.at <= pTo);
          return '<div class="ph" style="' + (good ? "" : "opacity:.45") + '"><img src="' + x.u + '" data-img="' + x.u + '" data-imgt="워킹사진 ' + (i + 1) + (x.at ? " · " + tsHM(x.at) : "") + '">' +
            '<button class="x" data-delph="' + i + '">✕</button>' +
            (x.at ? '<div style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;text-align:center;padding:2px">' +
              tsHM(x.at) + (good ? "" : " 미인정") + "</div>" : "") + "</div>";
        }).join("") +
        (photos.length < 12 ? '<button class="add" id="phAdd"><span style="font-size:20px">＋</span>사진 추가</button>' : "") +
        "</div>" +
        '<input type="file" accept="image/*" id="phFile" class="hide" multiple></div>';
    }

    /* 일마감 체크리스트 - 여행/휴가 기간(gaejikTrip)에는 표시하지 않는다 */
    if (!dT.gaejikTrip && (S.closingForAll || dT.type !== "개직")) {
      const items = todayItems(p, dT, tdy);
      const from = atTime(tdy, S.closingFrom), to = atTime(tdy, S.closingTo) + 59000;
      const saved = dT.closingSavedAt || 0;
      const ok = saved >= from && saved <= to;
      const nowInWindow = Date.now() >= from && Date.now() <= to;
      h += '<div class="sec-t">일마감 · ' + fmtD(tdy) + "</div>" +
        '<div class="card"><div class="card-h"><h3>📋 일마감 체크리스트</h3><div class="sp"></div>' +
        (ok ? '<span class="bdg g">완료</span>' : '<span class="bdg y">미완료</span>') + "</div>" +
        '<div class="banner ' + (ok ? "s" : nowInWindow ? "i" : "w") + '">' +
        (ok ? "✅ " + tsFmt(saved) + " 저장 완료 — 이후 수정은 자유롭게 하셔도 벌금과 무관합니다."
            : nowInWindow ? "오늘 <b>" + S.closingFrom + " ~ " + S.closingTo + "</b> 사이에 <b>저장하기</b>를 한 번만 누르면 인정됩니다."
            : "인정 시간은 <b>" + S.closingFrom + " ~ " + S.closingTo + "</b> 입니다. 지금 저장해도 벌금은 면제되지 않습니다.") +
        "</div>" +
        '<div id="ckList">' + items.map((it, i) =>
          '<div class="ck ' + (it.done ? "done" : "") + '">' +
          '<div class="box" data-cktog="' + i + '">' + (it.done ? "✓" : "") + "</div>" +
          '<div class="tx" contenteditable="true" data-cktx="' + i + '">' + esc(it.t) + "</div>" +
          '<button class="del" data-ckdel="' + i + '">✕</button></div>').join("") +
        (items.length ? "" : '<div class="empty">항목을 추가해 나만의 일마감 목록을 만들어보세요.<br>한 번 만들면 다음날에도 그대로 불러옵니다.</div>') +
        "</div>" +
        '<div class="btn-row" style="margin-top:10px">' +
        '<button class="btn sm" id="ckAdd">＋ 항목 추가</button>' +
        '<div style="flex:1"></div>' +
        '<span class="hint" style="margin:0">' + items.filter(x => x.done).length + " / " + items.length + " 완료</span></div>" +
        '<button class="btn pri full" id="ckSave" style="margin-top:12px">저장하기</button>' +
        '<div class="hint" style="text-align:center;margin-top:8px">체크는 양심에 맡깁니다 · 저장 시각만 기록됩니다</div></div>';
    }
  }

  /* 최근 기록 */
  const rows = [];
  for (let i = 1; i <= 21 && rows.length < 10; i++) {
    const ds = addDays(tdy, -i);
    if (!isWorkday(ds, H)) continue;
    rows.push({ ds, dd: DB.get("daily", dayId(p.uid, ds)) || {} });
  }
  h += '<div class="sec-t">최근 근무 기록</div><div class="card pad0"><div class="tw"><table>' +
    "<thead><tr><th>날짜</th><th>유형</th><th>출근</th><th class='num'>사진</th><th>일마감</th></tr></thead><tbody>" +
    (rows.length ? rows.map(r => {
      const from = atTime(r.ds, S.closingFrom), to = atTime(r.ds, S.closingTo) + 59000;
      const cs = r.dd.closingSavedAt || 0;
      return "<tr data-open-day='" + r.ds + "' data-uid='" + p.uid + "' style='cursor:pointer'><td>" + fmtD(r.ds) + "</td>" +
        "<td>" + (r.dd.type ? '<span class="bdg ' + TYPES[r.dd.type].color + '">' + r.dd.type + "</span>" : '<span class="bdg r">미보고</span>') + "</td>" +
        "<td class='mono'>" + (tsHM(r.dd.checkinAt) || "-") + "</td>" +
        "<td class='num'>" + photoOkCount(r.dd, r.ds, S) + "</td>" +
        "<td>" + (cs >= from && cs <= to ? "✅" : "—") + "</td></tr>";
    }).join("") : "<tr><td colspan='5'><div class='empty'>기록 없음</div></td></tr>") +
    "</tbody></table></div></div>";
  return h;
}

function bindReport() {
  const p = Auth.profile, S = SET(), H = HOLIDAYS(), tdy = today();
  const rDate = nextReportDate(H, S);
  let sel = (DB.get("daily", dayId(p.uid, rDate)) || {}).type || null;

  $$("[data-type]").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    sel = b.dataset.type;
    $$("[data-type]").forEach(x => x.classList.toggle("on", x.dataset.type === sel));
    $("#reasonWrap").classList.toggle("hide", sel !== "직출");
    $("#hospWrap").classList.toggle("hide", sel !== "병원근무");
    $("#gjPhotoWrap").classList.toggle("hide", sel !== "개직");
  });

  /* 여행/휴가 기간 신청 — 기간(평일 기준)만큼 개직을 한 번에 차감하고, 그 날들을 전부
     type:"개직" + gaejikTrip:true 로 저장한다. gaejikTrip 플래그가 있으면 computeDay에서
     일마감 의무까지 면제되고(위 renderTripPreview/computeDay 참고), 개직 자체가 이미
     출근/워킹사진 면제 유형이라 나머지는 자동으로 함께 면제된다.
     - 잔여가 모자라면 전체 거부(부분 신청 안 함) - 신청 도중 하루라도 실패하면 그 전까지
       처리된 날짜를 전부 롤백(환급 + 원상복구)한다.
     - 시작일은 항상 내일 이후만 허용 - 오늘 이미 출근 처리된 날짜는 애초에 포함될 수 없다. */
  const tripMinStr = addDays(tdy, 1);
  const tripFrom = $("#tripFrom"), tripTo = $("#tripTo"), tripPreview = $("#tripPreview"), tripApply = $("#tripApply");
  function tripWorkdays() {
    if (!tripFrom || !tripTo || !tripFrom.value || !tripTo.value) return null;
    if (tripFrom.value > tripTo.value) return null;
    const out = [];
    let dd = tripFrom.value, guard = 0;
    while (dd <= tripTo.value && guard++ < 370) {
      if (isWorkday(dd, H)) out.push(dd);
      dd = addDays(dd, 1);
    }
    return out;
  }
  function renderTripPreview() {
    if (!tripPreview) return;
    if (!tripFrom.value || !tripTo.value) { tripPreview.textContent = ""; return; }
    const days = tripWorkdays();
    if (!days) { tripPreview.innerHTML = '<span style="color:#e5484d">종료일이 시작일보다 빠릅니다.</span>'; return; }
    if (!days.length) { tripPreview.textContent = "선택한 기간에 평일이 없습니다."; return; }
    const need = days.length, have = Number(Auth.profile.gaejik || 0);
    tripPreview.innerHTML = "대상 평일 " + need + "일 · 필요 개직 " + need + "개 · 잔여 " + have + "개" +
      (have < need ? '<br><span style="color:#e5484d">개직이 ' + (need - have) + "개 부족합니다.</span>" : "");
  }
  if (tripFrom) tripFrom.onchange = () => {
    if (tripFrom.value < tripMinStr) tripFrom.value = tripMinStr;
    if (tripTo) { tripTo.min = tripFrom.value; if (tripTo.value && tripTo.value < tripFrom.value) tripTo.value = tripFrom.value; }
    renderTripPreview();
  };
  if (tripTo) tripTo.onchange = () => { if (tripTo.value < tripMinStr) tripTo.value = tripMinStr; renderTripPreview(); };
  if (tripApply) tripApply.onclick = async () => {
    if (!tripFrom.value || !tripTo.value) return toast("여행 시작일과 종료일을 선택해주세요", "err");
    if (tripFrom.value < tripMinStr) return toast("시작일은 내일부터 선택할 수 있습니다", "err");
    const days = tripWorkdays();
    if (!days) return toast("종료일이 시작일보다 빠릅니다", "err");
    if (!days.length) return toast("선택한 기간에 평일이 없습니다", "err");
    const need = days.length, have = Number(Auth.profile.gaejik || 0);
    if (have < need) return toast("개직이 " + (need - have) + "개 부족합니다 (필요 " + need + "개 · 잔여 " + have + "개)", "err");
    for (const dd of days) {
      const cur0 = DB.get("daily", dayId(p.uid, dd)) || {};
      if (cur0.type === "출근" && cur0.checkinAt) return toast(fmtD(dd) + "은(는) 이미 출근까지 완료되어 여행으로 신청할 수 없습니다.", "err");
    }
    const tripId = p.uid + "_" + Date.now();
    const done = [];
    tripApply.disabled = true;
    try {
      for (const dd of days) {
        const prev = DB.get("daily", dayId(p.uid, dd)) || {};
        await useMyGaejik(-1, "개직 사용(여행) · " + fmtDL(dd));
        await DB.set("daily", dayId(p.uid, dd), {
          uid: p.uid, date: dd, type: "개직",
          reason: "", hospital: "",
          gaejikUsed: true, gaejikTrip: true, gaejikTripId: tripId,
          reportAt: Date.now(), updatedAt: Date.now()
        });
        done.push({ date: dd, prev });
      }
      toast("여행 기간 신청 완료 · 개직 " + need + "개 차감됨", "ok");
    } catch (e) {
      for (let i = done.length - 1; i >= 0; i--) {
        const dd = done[i].date, prev = done[i].prev;
        try {
          await useMyGaejik(1, "여행 신청 실패 롤백 · " + fmtDL(dd));
          await DB.set("daily", dayId(p.uid, dd), {
            type: prev.type || null, reason: prev.reason || "", hospital: prev.hospital || "",
            gaejikUsed: !!prev.gaejikUsed, gaejikTrip: false, gaejikTripId: null,
            reportAt: prev.reportAt || null, updatedAt: Date.now()
          });
        } catch (e2) { console.error(e2); }
      }
      toast("여행 신청 중 오류가 발생해 취소했습니다: " + cleanErr(e), "err");
      tripApply.disabled = false;
    }
  };

  /* 개직 · SM보고/준비방 보고 캡쳐이미지
     사진을 올리는 순간 "개직"으로 자동 제출 + 자동 차감까지 함께 처리한다(별도로
     "보고 제출" 버튼을 누를 필요 없음). 단, 이미 개직으로 제출되어 차감이 끝난 상태에서
     사진만 다시 올리는 경우(재업로드)는 중복 차감하지 않는다. 개직→다른 유형으로 바꿔
     되돌리는(환급) 로직은 아래 #rSave 클릭 핸들러에 그대로 남아있다 - 여기서는 건드리지 않는다. */
  const gjUp = $("#gjUp"), gjFile = $("#gjFile");
  if (gjUp) gjUp.onclick = () => gjFile.click();
  if (gjFile) gjFile.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      toast("이미지 처리 중…");
      const raw = await compressImage(f, 900, .72);
      const url = await DB.uploadImage(raw, "gaejik");
      const cur = DB.get("daily", dayId(p.uid, rDate)) || {};
      if (cur.type === "출근" && cur.checkinAt) {
        await DB.set("daily", dayId(p.uid, rDate), { uid: p.uid, date: rDate, gaejikPhoto: url, updatedAt: Date.now() });
        toast("이미 출근까지 완료된 보고는 수정할 수 없어 사진만 첨부됐습니다. 관리자에게 문의해주세요.", "err");
        return;
      }
      const already = cur.type;
      const wasUsed = !!cur.gaejikUsed;
      let used = wasUsed;
      const typeChanged = already !== "개직";
      if (!wasUsed) {
        if (Number(Auth.profile.gaejik || 0) < 1) {
          await DB.set("daily", dayId(p.uid, rDate), { uid: p.uid, date: rDate, gaejikPhoto: url, updatedAt: Date.now() });
          toast("개직 잔여가 없어 사진만 첨부됐습니다. 근무 유형은 반영되지 않았습니다.", "err");
          return;
        }
        await useMyGaejik(-1, "개직 사용 · " + fmtDL(rDate)); used = true;
      }
      const patch = {
        uid: p.uid, date: rDate, type: "개직",
        reason: "", hospital: "",
        gaejikPhoto: url,
        gaejikUsed: used, updatedAt: Date.now()
      };
      if (typeChanged || !cur.reportAt) patch.reportAt = Date.now();
      await DB.set("daily", dayId(p.uid, rDate), patch);
      sel = "개직";
      $$("[data-type]").forEach(x => x.classList.toggle("on", x.dataset.type === sel));
      const dl = reportDeadlineTs(rDate, "개직", S);
      const checkAt = typeChanged || !cur.reportAt ? Date.now() : cur.reportAt;
      toast(checkAt > dl ? "개직 보고 저장 · 마감 후 제출로 벌금 대상입니다" : "캡쳐이미지 첨부 및 개직 보고 자동 완료", checkAt > dl ? "err" : "ok");
    } catch (er) { toast(cleanErr(er), "err"); }
  };

  /* 직출 증빙 이미지 */
  const rzUp = $("#rzUp"), rzFile = $("#rzFile");
  if (rzUp) rzUp.onclick = () => rzFile.click();
  if (rzFile) rzFile.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      toast("이미지 처리 중…");
      const raw = await compressImage(f, 900, .72);
      const url = await DB.uploadImage(raw, "reason");
      await DB.set("daily", dayId(p.uid, rDate), { uid: p.uid, date: rDate, reasonPhoto: url, updatedAt: Date.now() });
      toast("증빙 이미지 첨부됨", "ok");
    } catch (er) { toast(cleanErr(er), "err"); }
  };

  const sv = $("#rSave");
  if (sv) sv.onclick = async () => {
    if (!sel) return toast("근무 유형을 선택해주세요", "err");
    const reason = $("#rReason") ? $("#rReason").value.trim() : "";
    const hosp = $("#rHosp") ? $("#rHosp").value.trim() : "";
    if (sel === "직출" && !reason) return toast("직출은 사유를 반드시 입력해주세요", "err");
    if (sel === "병원근무" && !hosp) return toast("병원근무는 병원명을 입력해주세요", "err");
    const cur = DB.get("daily", dayId(p.uid, rDate)) || {};
    if (cur.type === "출근" && cur.checkinAt) return toast("이미 출근까지 완료된 보고는 수정할 수 없습니다. 관리자에게 문의해주세요.", "err");
    const already = cur.type;
    if (sel === "직출" && already !== "직출" && Date.now() > atTime(tdy, S.jikchulDeadline || "22:00"))
      return toast("오후 10시 이후에는 직출을 선택할 수 없습니다.", "err");
    const wasUsed = !!cur.gaejikUsed;
    let used = wasUsed;
    // 유형을 실제로 바꿀 때만 reportAt(제출 시각)을 지금 시각으로 갱신한다. 이미 제출해둔
    // 유형 그대로 다시 저장만 하는 경우(예: 아무 변경 없이 "보고수정"을 누르는 경우)까지
    // reportAt이 갱신되면, 원래 마감 전에 냈던 보고가 지금(마감 후) 시각으로 다시 찍혀서
    // "마감 후 제출" 벌금이 잘못 붙는 문제가 있었다 - 이걸 막기 위한 조건이다.
    const typeChanged = sel !== already;
    try {
      sv.disabled = true;
      if (sel === "개직" && !wasUsed) {
        if (Number(Auth.profile.gaejik || 0) < 1) { sv.disabled = false; return toast("개직 잔여가 없습니다", "err"); }
        await useMyGaejik(-1, "개직 사용 · " + fmtDL(rDate)); used = true;
      } else if (sel !== "개직" && wasUsed) {
        await useMyGaejik(+1, "개직 취소 · " + fmtDL(rDate) + " → " + sel); used = false;
      }
      const patch = {
        uid: p.uid, date: rDate, type: sel,
        reason: sel === "직출" ? reason : "",
        hospital: sel === "병원근무" ? hosp : "",
        gaejikUsed: used, updatedAt: Date.now()
      };
      if (typeChanged || !cur.reportAt) patch.reportAt = Date.now();
      await DB.set("daily", dayId(p.uid, rDate), patch);
      const dl = reportDeadlineTs(rDate, sel, S);
      const checkAt = typeChanged || !cur.reportAt ? Date.now() : cur.reportAt;
      toast(checkAt > dl ? sel + " 보고 저장 · 마감 후 제출로 벌금 대상입니다" : sel + " 보고 완료", checkAt > dl ? "err" : "ok");
    } catch (e) { toast(cleanErr(e), "err"); sv.disabled = false; }
  };

  /* 워킹사진 */
  const phAdd = $("#phAdd"), phFile = $("#phFile");
  if (phAdd) phAdd.onclick = () => phFile.click();
  if (phFile) phFile.onchange = async e => {
    const files = Array.from(e.target.files || []); if (!files.length) return;
    try {
      toast("사진 " + files.length + "장 처리 중…");
      const cur = DB.get("daily", dayId(p.uid, tdy)) || {};
      const arr = photoList(cur);
      for (const f of files) {
        const raw = await compressImage(f, 800, .7);
        arr.push({ u: await DB.uploadImage(raw, "walk"), at: Date.now() });
      }
      await DB.set("daily", dayId(p.uid, tdy), {
        uid: p.uid, date: tdy, photos: arr, photoAt: Date.now(), updatedAt: Date.now()
      });
      const ok = photoOkCount({ photos: arr }, tdy, S);
      toast(ok >= S.photoMin ? "워킹사진 " + ok + "장 · 완료 👍" : "저장됨 · 인정 " + ok + "/" + S.photoMin + "장", ok >= S.photoMin ? "ok" : "err");
    } catch (er) { toast(cleanErr(er), "err"); }
  };
  $$("[data-delph]").forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.delph);
    const cur = DB.get("daily", dayId(p.uid, tdy)) || {};
    const arr = photoList(cur); arr.splice(i, 1);
    await DB.set("daily", dayId(p.uid, tdy), { uid: p.uid, date: tdy, photos: arr, updatedAt: Date.now() });
    toast("삭제됨");
  });

  /* 일마감 체크리스트 — 체크/텍스트수정/추가/삭제를 할 때마다 자동 저장된다(디바운스 적용).
     "저장하기" 버튼은 그대로 두되, 즉시 저장 + 인정시간 안내 토스트 용도로만 남는다. */
  const dT = DB.get("daily", dayId(p.uid, tdy)) || {};
  const items = todayItems(p, dT, tdy);
  let ckAutoTimer = null;
  const autoSaveClosing = () => {
    clearTimeout(ckAutoTimer);
    ckAutoTimer = setTimeout(() => { saveClosing(p, tdy, S, items, { toast: false }); }, 500);
  };
  $$("[data-cktog]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.cktog); items[i].done = !items[i].done; render(); autoSaveClosing();
  });
  $$("[data-ckdel]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.ckdel); items.splice(i, 1); render(); autoSaveClosing();
  });
  $$("[data-cktx]").forEach(el => el.onblur = () => {
    items[Number(el.dataset.cktx)].t = el.textContent.trim(); autoSaveClosing();
  });
  const add = $("#ckAdd");
  if (add) add.onclick = () => {
    items.push({ t: "", done: false }); render();
    setTimeout(() => { const list = $$("[data-cktx]"); const last = list[list.length - 1]; if (last) last.focus(); }, 60);
  };
  const save = $("#ckSave");
  if (save) save.onclick = async () => {
    clearTimeout(ckAutoTimer);
    $$("[data-cktx]").forEach(el => { items[Number(el.dataset.cktx)].t = el.textContent.trim(); });
    await saveClosing(p, tdy, S, items, { toast: true });
  };
}

/* ============================================================================
   벌금
   ============================================================================ */
let fineFilterUser = "all", fineMonth = "all", fineSel = new Set();

function viewFines() {
  const admin = Auth.isAdmin(), S = SET(), p = Auth.profile;
  // 관리자가 "숨김" 처리한 팀원은 팀벌금 페이지(전체 목록)에서 제외한다.
  // 본인이 스스로 볼 때는(비관리자 뷰) 숨김 여부와 상관없이 항상 자기 벌금은 보인다.
  const all = admin
    ? collectFines({}).filter(f => !(DB.get("users", f.uid) || {}).hidden)
    : collectFines({ uid: p.uid });
  const tab = App.finesTab;

  let list = all.filter(f => !f.pending);
  if (tab === "unpaid") list = list.filter(f => !f.waived && f.status === "unpaid");
  else if (tab === "submitted") list = list.filter(f => f.status === "submitted");
  else if (tab === "paid") list = list.filter(f => f.status === "paid");
  else if (tab === "waived") list = list.filter(f => f.waived);
  if (admin && fineFilterUser !== "all") list = list.filter(f => f.uid === fineFilterUser);
  if (fineMonth !== "all") list = list.filter(f => f.date.startsWith(fineMonth));
  const months = Array.from(new Set(all.map(f => monthOf(f.date)))).sort().reverse();

  let h = '<div class="card"><div class="card-h"><h3>💳 벌금 입금 계좌</h3></div>' +
    '<div class="acct"><span class="t">' + esc(S.account) + '</span><button class="btn xs" id="cpA">복사</button></div>' +
    '<div class="hint" style="margin-top:9px">입금 후 이체 캡쳐를 올리면 관리자가 확인합니다. 여러 건을 한 번에 묶어서도 가능합니다.</div></div>';

  h += '<div class="grid g3">' +
    '<div class="stat acc-r"><div class="lb">미납</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "unpaid" && !f.waived)) + "</div></div>" +
    '<div class="stat acc-b"><div class="lb">확인대기</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "submitted")) + "</div></div>" +
    '<div class="stat acc-g"><div class="lb">납부완료</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "paid")) + "</div></div></div>";

  h += '<div class="seg sm" style="margin:14px 0 12px">' +
    [["unpaid", "미납"], ["submitted", "확인대기"], ["paid", "완료"], ["waived", "포인트납입"], ["all", "전체"]]
      .map(([k, t]) => '<button data-ftab="' + k + '" class="' + (tab === k ? "on" : "") + '">' + t + "</button>").join("") + "</div>";

  h += '<div class="btn-row" style="margin-bottom:12px">' +
    (admin ? "<select class='inp' id='fUser' style='flex:1;min-width:118px;padding:8px 26px 8px 10px;font-size:13px'>" +
      "<option value='all'>전체 팀원</option>" +
      ACTIVE_USERS().filter(u => !u.hidden).map(u => "<option value='" + u.uid + "'" + (fineFilterUser === u.uid ? " selected" : "") + ">" + esc(u.name) + "</option>").join("") + "</select>" : "") +
    "<select class='inp' id='fMon' style='flex:1;min-width:118px;padding:8px 26px 8px 10px;font-size:13px'>" +
    "<option value='all'>전체 기간</option>" +
    months.map(m => "<option value='" + m + "'" + (fineMonth === m ? " selected" : "") + ">" + m.replace("-", "년 ") + "월</option>").join("") + "</select>" +
    (admin ? "<button class='btn sm' id='addFine'>+ 추가</button>" : "") + "</div>";

  const selectable = tab === "unpaid" || tab === "submitted";
  if (selectable && list.length) {
    h += '<div class="card" style="padding:11px 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700">' +
      '<input type="checkbox" id="selAll"> 전체선택</label>' +
      '<span class="bdg n" id="selInfo">0건</span><div style="flex:1"></div>' +
      (admin ? '<button class="btn xs" id="copyBill">📋 정산문구</button>' : "") +
      (tab === "unpaid" ? '<button class="btn xs pri" id="payBtn">💸 납부 캡쳐</button>' : "") +
      (admin && tab === "submitted" ? '<button class="btn xs ok" id="confirmBtn">✅ 납부확인</button>' : "") +
      (admin ? '<button class="btn xs" id="waiveBtn">🎫 포인트납입</button>' : "") +
      (admin ? '<button class="btn xs dan" id="delBtn">삭제</button>' : "") + "</div>";
  }

  const LCAP = 80;
  h += '<div class="card pad0">' +
    (list.length ? list.slice(0, LCAP).map(f =>
      '<div class="row">' +
      (selectable ? '<input type="checkbox" class="fsel" data-fid="' + f.id + '" style="width:17px;height:17px;flex:0 0 auto">' : "") +
      '<span style="font-size:17px">' + (KINDS[f.kind] || KINDS.etc).icon + "</span>" +
      '<div class="sp" data-open-fine="' + f.id + '" style="cursor:pointer">' +
      '<div class="nm">' + (admin ? esc(f.name) + " · " : "") + (KINDS[f.kind] || KINDS.etc).label +
      (f.auto ? "" : ' <span class="bdg n">수동</span>') + "</div>" +
      '<div class="ds">' + fmtD(f.date) + " · " + esc(f.reason) + "</div></div>" +
      '<div style="text-align:right"><div class="nm mono" style="' + (f.waived ? "text-decoration:line-through;color:var(--tx3)" : "") + '">' + won(f.amount) + "</div>" +
      '<div style="margin-top:3px">' + fineBadge(f) + "</div></div></div>").join("") +
      (list.length > LCAP ? '<div class="empty">…외 ' + (list.length - LCAP) + "건 · 필터로 좁혀보세요</div>" : "")
      : '<div class="empty">해당하는 벌금이 없습니다</div>') + "</div>";

  if (list.length)
    h += '<div class="stat" style="margin-top:12px"><div class="lb">목록 합계</div>' +
      '<div class="vl">' + won(list.filter(f => !f.waived).reduce((s, f) => s + f.amount, 0)) + "</div>" +
      '<div class="sub">' + list.length + "건</div></div>";
  return h;
}

function bindFines() {
  const admin = Auth.isAdmin();
  $("#cpA").onclick = () => { copyText(SET().account); toast("계좌 복사됨", "ok"); };
  $$("[data-ftab]").forEach(b => b.onclick = () => { App.finesTab = b.dataset.ftab; fineSel.clear(); render(); });
  const fu = $("#fUser"); if (fu) fu.onchange = e => { fineFilterUser = e.target.value; render(); };
  const fm = $("#fMon"); if (fm) fm.onchange = e => { fineMonth = e.target.value; render(); };
  const af = $("#addFine"); if (af) af.onclick = openAddFine;

  const boxes = $$(".fsel"), info = $("#selInfo");
  const all = collectFines(admin ? {} : { uid: Auth.profile.uid });
  const upd = () => {
    fineSel = new Set(boxes.filter(b => b.checked).map(b => b.dataset.fid));
    const sum = all.filter(f => fineSel.has(f.id)).reduce((s, f) => s + f.amount, 0);
    if (info) info.textContent = fineSel.size + "건 · " + won(sum);
  };
  boxes.forEach(b => { b.checked = fineSel.has(b.dataset.fid); b.onchange = upd; });
  const sa = $("#selAll"); if (sa) sa.onchange = () => { boxes.forEach(b => b.checked = sa.checked); upd(); };
  upd();
  const picked = () => all.filter(f => fineSel.has(f.id));

  const cb = $("#copyBill");
  if (cb) cb.onclick = () => { const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err"); showBill(ps); };
  const pb = $("#payBtn");
  if (pb) pb.onclick = () => { const ps = picked(); if (!ps.length) return toast("납부한 항목을 선택해주세요", "err"); openPayModal(ps); };
  const cf = $("#confirmBtn");
  if (cf) cf.onclick = async () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    for (const f of ps) await DB.set("fines", f.id, Object.assign(baseFine(f), {
      status: "paid", confirmedAt: Date.now(), confirmedBy: Auth.profile.name }));
    fineSel.clear(); toast(ps.length + "건 납부확인 완료", "ok");
  };
  const wb = $("#waiveBtn");
  if (wb) wb.onclick = async () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    const on = !ps[0].waived;
    if (on) {
      // 아직 포인트가 차감되지 않은 건만 실제 차감 대상 (같은 건을 두 번 차감하지 않도록)
      const toDeduct = ps.filter(f => !f.pointsDeducted);
      if (toDeduct.length) {
        const byUser = {};
        toDeduct.forEach(f => { byUser[f.uid] = (byUser[f.uid] || 0) + f.amount; });
        const summary = Object.keys(byUser).map(uid => {
          const u = DB.get("users", uid);
          return (u ? u.name : uid) + " " + won(byUser[uid]);
        }).join(", ");
        if (!confirm(summary + " 만큼 실제 포인트(P)가 차감됩니다. 계속할까요?")) return;
        try {
          for (const uid of Object.keys(byUser)) {
            const r = await attendanceDeductPointsForFine(uid, byUser[uid], "근태 벌금 포인트납입");
            if (!r.ok) throw new Error(r.message);
          }
        } catch (e) { toast(cleanErr(e), "err"); return; }
      }
    }
    for (const f of ps) {
      const patch = Object.assign(baseFine(f), { waived: on });
      if (on && !f.pointsDeducted) patch.pointsDeducted = true;
      await DB.set("fines", f.id, patch);
    }
    fineSel.clear(); toast(ps.length + "건 " + (on ? "포인트로 차감 처리" : "포인트납입 해제"), "ok");
    refreshMainProfile().then(scheduleRender);
  };
  const db = $("#delBtn");
  if (db) db.onclick = () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    confirmM("선택한 <b>" + ps.length + "건</b>을 삭제합니다.<br>삭제한 벌금은 목록·합계·순위에서 모두 사라집니다.", async () => {
      for (const f of ps) await deleteFine(f);
      fineSel.clear(); toast(ps.length + "건 삭제됨", "ok");
    });
  };
}

function baseFine(f) {
  return { id: f.id, uid: f.uid, date: f.date, kind: f.kind, amount: f.amount, memo: f.reason, manual: !f.auto };
}
/** SM 전용 — 벌금 삭제 */
async function deleteFine(f) {
  if (!Auth.isAdmin()) throw new Error("권한이 없습니다");
  if (f.auto) await DB.set("fines", f.id, Object.assign(baseFine(f), { deleted: true, deletedAt: Date.now(), deletedBy: Auth.profile.name }));
  else await DB.del("fines", f.id);
}

function billText(fines) {
  const byUser = {};
  fines.filter(f => !f.waived && !f.pending).forEach(f => { (byUser[f.name] = byUser[f.name] || []).push(f); });
  let txt = "📌 벌금 정산\n", total = 0;
  Object.keys(byUser).forEach(n => {
    const sum = byUser[n].reduce((s, f) => s + f.amount, 0); total += sum;
    txt += "\n▪ " + n + " — " + won(sum) + "\n";
    byUser[n].sort((a, b) => a.date.localeCompare(b.date)).forEach(f => {
      txt += "   · " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) + "\n";
    });
  });
  txt += "\n합계 " + won(total) + "\n▶ " + SET().account;
  return txt;
}
function showBill(finesOrText) {
  const txt = typeof finesOrText === "string" ? finesOrText : billText(finesOrText);
  copyText(txt);
  modal({ title: "정산 문구", noFooter: true,
    body: '<textarea class="inp" style="min-height:240px;font-size:12.5px" readonly>' + esc(txt) + "</textarea>" +
      '<div class="hint">클립보드에 복사되었습니다. 카톡방에 붙여넣으세요.</div>' });
}

/* ============================ 납부 캡쳐 업로드 (+ 포인트 대체 납입) ============================ */
function openPayModal(fines, urgent) {
  const total = fines.reduce((s, f) => s + f.amount, 0);
  const myUid = Auth.profile.uid;
  const myPoints = (Auth.mainProfile && Auth.mainProfile.points) || 0;
  const usedToday = pointsUsedToday(myUid);
  const capLeft = Math.max(0, DAILY_POINT_FINE_CAP - usedToday);
  const maxApply = Math.max(0, Math.min(capLeft, myPoints, total));
  let imgRaw = null;

  modal({
    title: urgent ? "⚠️ 미납 벌금이 있습니다" : "납부 캡쳐 올리기",
    body:
      '<div class="banner d"><b>' + fines.length + "건 · " + won(total) + "</b><br>" +
      fines.slice(0, 8).map(f => "· " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) +
        " <span style='opacity:.7'>(" + esc(f.reason) + ")</span>").join("<br>") +
      (fines.length > 8 ? "<br>… 외 " + (fines.length - 8) + "건" : "") + "</div>" +
      (maxApply > 0
        ? '<div class="fld"><label>포인트로 대신 내기 <span class="hint" style="margin:0">(보유 ' + won(myPoints) +
          " · 오늘 사용 가능 " + won(maxApply) + " / 일일 한도 " + won(DAILY_POINT_FINE_CAP) + ")</span></label>" +
          '<div class="btn-row"><input class="inp" type="number" id="pmPts" min="0" max="' + maxApply + '" step="1" value="0" style="flex:1">' +
          '<button class="btn sm" id="pmPtsFull">전액</button></div></div>' +
          '<div class="hint" id="pmRemain" style="margin:-4px 0 4px">현금으로 낼 금액: ' + won(total) + "</div>"
        : (myPoints > 0
          ? '<div class="hint" style="margin-bottom:4px">오늘 포인트 대체 납입 한도(' + won(DAILY_POINT_FINE_CAP) + ")를 이미 다 쓰셨습니다.</div>"
          : "")) +
      '<div class="fld"><label>입금 계좌</label><div class="acct"><span class="t">' + esc(SET().account) + "</span>" +
      '<button class="btn xs" id="pmCp">복사</button></div></div>' +
      '<div class="upl" id="pmUp"><div class="ic">🧾</div><div class="t">이체 완료 캡쳐 올리기</div>' +
      '<div class="s">관리자가 확인 후 납부완료 처리합니다</div></div>' +
      '<input type="file" accept="image/*" id="pmFile" class="hide">' +
      '<div id="pmPrev"></div>' +
      '<div class="fld" style="margin-top:13px"><label>메모 (선택)</label>' +
      '<input class="inp" id="pmMemo" placeholder="예: 급여일 일괄납부"></div>',
    okText: "납부 등록", cancelText: urgent ? "나중에" : "닫기",
    onOk: async () => {
      const ptsInput = $("#pmPts");
      let pts = ptsInput ? Math.max(0, Math.min(maxApply, Math.floor(Number(ptsInput.value) || 0))) : 0;
      const remain = total - pts;

      if (remain > 0 && !imgRaw) {
        toast(pts > 0 ? "남은 금액에 대한 납부 캡쳐를 첨부해주세요" : "납부 캡쳐를 첨부해주세요", "err");
        return false;
      }

      if (pts > 0) {
        toast("포인트 처리 중…");
        const r = await attendanceDeductPointsForFine(myUid, pts, "근태 벌금 포인트 대체납입");
        if (!r.ok) { toast(cleanErr(new Error(r.message)), "err"); return false; }
        // 포인트 사용분을 각 벌금에 순서대로 배분 - 전액 커버되면 그 건은 포인트납입(waived) 처리,
        // 일부만 커버되면 남은 현금 금액만큼 amount를 줄여서 이후 현금 납부 절차로 이어간다.
        let leftPts = pts;
        for (const f of fines) {
          if (leftPts <= 0) break;
          const use = Math.min(leftPts, f.amount);
          if (use <= 0) continue;
          const newAmt = f.amount - use;
          await DB.set("fines", f.id, Object.assign(baseFine(f), {
            amount: newAmt,
            pointsUsed: (f.pointsUsed || 0) + use,
            pointsUsedAt: Date.now(),
            waived: newAmt <= 0 ? true : !!f.waived
          }));
          leftPts -= use;
        }
        await refreshMainProfile();
      }

      if (remain <= 0) {
        fineSel.clear();
        toast(pts > 0 ? "포인트로 전액 납부 완료 👍" : "납부 완료", "ok");
        return;
      }

      toast("업로드 중…");
      const img = await DB.uploadImage(imgRaw, "pay");
      const batch = uid8(), memo = $("#pmMemo").value.trim();
      for (const f of fines) {
        const cur = DB.get("fines", f.id) || {};
        const amt = cur.amount != null ? cur.amount : f.amount;
        if (amt <= 0) continue; // 포인트로 이미 전액 커버된 건은 현금 납부 대상에서 제외
        await DB.set("fines", f.id, Object.assign(baseFine(f), {
          amount: amt,
          status: "submitted", proof: img, proofAt: Date.now(),
          proofBy: Auth.profile.name, batch, payMemo: memo,
          pointsUsed: cur.pointsUsed || 0, pointsUsedAt: cur.pointsUsedAt || null
        }));
      }
      fineSel.clear();
      toast("납부 등록 완료 · 관리자 확인을 기다려주세요", "ok");
    },
    after: () => {
      $("#pmCp").onclick = () => { copyText(SET().account); toast("복사됨", "ok"); };
      $("#pmUp").onclick = () => $("#pmFile").click();
      $("#pmFile").onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        imgRaw = await compressImage(f, 900, .72);
        $("#pmPrev").innerHTML = '<img src="' + imgRaw + '" class="thumb" style="margin-top:11px">';
      };
      const pts = $("#pmPts"), full = $("#pmPtsFull"), remainEl = $("#pmRemain");
      const updateRemain = () => {
        if (!pts || !remainEl) return;
        const v = Math.max(0, Math.min(maxApply, Math.floor(Number(pts.value) || 0)));
        remainEl.textContent = "현금으로 낼 금액: " + won(total - v) + (v > 0 ? " (포인트 " + won(v) + " 사용)" : "");
      };
      if (pts) pts.oninput = updateRemain;
      if (full) full.onclick = () => { pts.value = maxApply; updateRemain(); };
    }
  });
}

/* ============================ 벌금 상세 ============================ */

  modal({
    title: K.icon + " " + K.label + " · " + esc(f.name),
    body:
      '<div class="stat acc-r" style="margin-bottom:14px"><div class="lb">' + fmtDL(f.date) + "</div>" +
      '<div class="vl">' + won(f.amount) + "</div><div class='sub'>" + esc(f.reason) + "</div></div>" +

      (f.batch ? '<span class="bdg c">일괄납부</span>' : "") +

        '<div class="divider"></div>' +
        '<div class="fld"><label>금액 조정</label><input class="inp" type="number" id="feAmt" value="' + f.amount + '"></div>' +

        '<div class="fld"><label>납부 상태</label><select class="inp" id="feSt">' +
        [["unpaid", "미납"], ["submitted", "확인대기"], ["paid", "납부완료"]].map(([k, t]) =>
          "<option value='" + k + "'" + (f.status === k ? " selected" : "") + ">" + t + "</option>").join("") + "</select></div>" +
        '<button class="btn dan full sm" id="feDel">이 벌금 삭제</button>' 
        : (f.status === "unpaid" ? '<button class="btn pri full" id="fePay">💸 납부 캡쳐 올리기</button>' : "")),
    okText: admin ? "저장" : null,
    onOk: admin ? async () => {
      await DB.set("fines", f.id, Object.assign(baseFine(f), {
        amount: Number($("#feAmt").value) || 0,
        memo: $("#feMemo").value.trim(),
        waived: $("#feWaive").checked,
        status: $("#feSt").value,
        confirmedAt: $("#feSt").value === "paid" ? (f.confirmedAt || Date.now()) : null,
        confirmedBy: $("#feSt").value === "paid" ? (f.confirmedBy || Auth.profile.name) : null,
        proof: f.proof || null, proofAt: f.proofAt || null, batch: f.batch || null
      }));
      toast("저장됨", "ok");
    } : null,
    after: () => {
      $$("[data-img]", $("#ovl")).forEach(b => b.onclick = () => openImage(b.dataset.img, b.dataset.imgt));

      if (dl) dl.onclick = () => confirmM("이 벌금을 삭제합니다. 목록·합계·순위에서 사라집니다.", async () => {
        await deleteFine(f); closeModal(); toast("삭제됨", "ok");

      const py = $("#fePay"); if (py) py.onclick = () => { closeModal(); openPayModal([f]); };

/* ============================================================================
   캘린더 — 이름 / 벌금종류 / 금액 전부 표시
   ============================================================================ */
let calUser = "all";
function viewCal() {
  const admin = Auth.isAdmin(), H = HOLIDAYS(), tdy = today();
  const [Y, M] = App.month.split("-").map(Number);
  const first = new Date(Y, M - 1, 1), last = new Date(Y, M, 0);
  const from = App.month + "-01", to = App.month + "-" + pad(last.getDate());
  const opt = { from, to };
  if (calUser !== "all") opt.uid = calUser;
  const fines = collectFines(opt).filter(f => !f.pending);
  const byDate = {};
  fines.forEach(f => { (byDate[f.date] = byDate[f.date] || []).push(f); });

  /* 개직 사용 내역 */
  const calUsers = calUser !== "all" ? USERS().filter(u => u.uid === calUser) : ACTIVE_USERS();
  const gjBy = {};
  calUsers.forEach(u => {
    for (let dd = 1; dd <= last.getDate(); dd++) {
      const ds2 = App.month + "-" + pad(dd);
      const rec = DB.get("daily", dayId(u.uid, ds2));
      if (rec && rec.type === "개직") (gjBy[ds2] = gjBy[ds2] || []).push(u.name);
    }
  });
  const gjTotal = Object.values(gjBy).reduce((a, b) => a + b.length, 0);

  let h = '<div class="card"><div class="btn-row" style="align-items:center">' +
    '<button class="btn sm" id="mPrev">‹</button>' +
    '<div style="flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:-.5px">' + Y + "년 " + M + "월</div>" +
    '<button class="btn sm" id="mNext">›</button>' +
    '<button class="btn sm" id="mNow">이번달</button></div>' +
    "<select class='inp' id='calU' style='margin-top:11px;padding:8px 26px 8px 10px;font-size:13px'>" +
    "<option value='all'>전체 팀원</option>" +
    ACTIVE_USERS().map(u => "<option value='" + u.uid + "'" + (calUser === u.uid ? " selected" : "") + ">" + esc(u.name) + "</option>").join("") +
    "</select></div>";

  h += '<div class="grid g3" style="margin-bottom:12px">' +
    '<div class="stat acc-r"><div class="lb">' + M + '월 벌금</div><div class="vl" style="font-size:18px">' + won(sumFines(fines)) + "</div></div>" +
    '<div class="stat"><div class="lb">건수</div><div class="vl" style="font-size:18px">' + fines.filter(f => !f.waived).length + "</div></div>" +
    '<div class="stat acc-p"><div class="lb">개직 사용</div><div class="vl" style="font-size:18px">' + gjTotal + "건</div></div></div>";

  h += '<div class="card"><div class="cal">' +
    DOWK.map((d, i) => '<div class="dw ' + (i === 0 ? "s" : i === 6 ? "u" : "") + '">' + d + "</div>").join("");
  for (let i = 0; i < first.getDay(); i++) h += "<div></div>";
  for (let day = 1; day <= last.getDate(); day++) {
    const ds = App.month + "-" + pad(day);
    const w = dow(ds), wd = isWorkday(ds, H), hn = holidayName(ds, H);
    const fs = (byDate[ds] || []).slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
    h += '<div class="cel' + (wd ? "" : " off") + (ds === tdy ? " tod" : "") + (hn ? " hol" : "") + '" data-cal="' + ds + '">' +
      '<div class="dn ' + (w === 0 ? "s" : w === 6 ? "u" : "") + '">' + day + "</div>" +
      (gjBy[ds] || []).map(n => '<div class="ev g">' + esc(n) + "<br>🌴 개직</div>").join("") +
      fs.map(f => '<div class="ev ' + (f.waived ? "c" : f.status === "paid" ? "g" : (KINDS[f.kind] || KINDS.etc).color) + '" style="position:relative;padding-right:16px">' +
        esc(f.name) + "<br>" + (KINDS[f.kind] || KINDS.etc).label + "<br>" + (f.amount || 0).toLocaleString("ko-KR") +
        (Auth.isAdmin() ? '<button data-calx="' + f.id + '" title="삭제" style="position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:4px;background:rgba(0,0,0,.2);color:#fff;font-size:9px;line-height:1;display:flex;align-items:center;justify-content:center">✕</button>' : "") +
        "</div>").join("") +
      "</div>";
  }
  h += "</div></div>";

  h += '<div class="sec-t">' + M + "월 상세 (" + fines.length + "건)</div><div class='card pad0'>" +
    (fines.length ? fines.slice(0, 60).map(fineRow).join("") +
      (fines.length > 60 ? '<div class="empty">…외 ' + (fines.length - 60) + "건</div>" : "")
      : '<div class="empty">이번달 벌금이 없습니다 🎉</div>') + "</div>";
  return h;
}

function bindCal() {
  const shift = n => {
    let [Y, M] = App.month.split("-").map(Number);
    M += n; if (M < 1) { M = 12; Y--; } if (M > 12) { M = 1; Y++; }
    App.month = Y + "-" + pad(M); render();
  };
  $("#mPrev").onclick = () => shift(-1);
  $("#mNext").onclick = () => shift(1);
  $("#mNow").onclick = () => { App.month = monthOf(today()); render(); };
  const cu = $("#calU"); if (cu) cu.onchange = e => { calUser = e.target.value; render(); };
  $$("[data-cal]").forEach(c => c.onclick = () => openCalDay(c.dataset.cal));
  $$("[data-open-fine]").forEach(b => b.onclick = () => openFineModal(b.dataset.openFine));
  $$("[data-calx]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const f = collectFines({}).find(x => x.id === b.dataset.calx);
    if (!f) return;
    confirmM("<b>" + esc(f.name) + "</b> · " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label +
      " " + won(f.amount) + "<br>이 벌금을 삭제할까요?", async () => { await deleteFine(f); toast("삭제됨", "ok"); });
  });
}

function openCalDay(date) {
  const H = HOLIDAYS(), S = SET();
  const opt = { from: date, to: date };
  if (calUser !== "all") opt.uid = calUser;
  const fines = collectFines(opt).filter(f => !f.pending);
  const users = calUser === "all" ? ACTIVE_USERS() : ACTIVE_USERS().filter(u => u.uid === calUser);
  const hn = holidayName(date, H), wd = isWorkday(date, H);

  modal({
    title: fmtDL(date), cancelText: "닫기",
    body:
      '<div class="btn-row" style="margin-bottom:13px">' +
      '<span class="bdg ' + (wd ? "b" : "n") + '">' + (wd ? "근무일" : "휴무일") + "</span>" +
      (hn ? '<span class="bdg y">' + esc(hn) + "</span>" : "") +
      (fines.length ? '<span class="bdg r">벌금 ' + won(sumFines(fines)) + "</span>" : '<span class="bdg g">벌금 없음</span>') + "</div>" +
      '<div class="sec-t" style="margin-top:0">근무 현황</div><div class="card pad0" style="margin:0 0 14px">' +
      users.map(u => {
        const d = DB.get("daily", dayId(u.uid, date)) || {};
        return '<div class="row" data-open-day="' + date + '" data-uid="' + u.uid + '" style="cursor:pointer">' +
          (d.checkinPhoto ? '<img src="' + d.checkinPhoto + '" class="thumb sm">' : '<div class="avatar">' + esc(initial(u.name)) + "</div>") +
          '<div class="sp"><div class="nm">' + esc(u.name) + "</div>" +
          '<div class="ds">' + (tsHM(d.checkinAt) ? "출근 " + tsHM(d.checkinAt) : "출근 미등록") +
          " · 사진 " + ((d.photos || []).length) + "</div></div>" +
          (d.type ? '<span class="bdg ' + TYPES[d.type].color + '">' + d.type + "</span>" : '<span class="bdg r">미보고</span>') + "</div>";
      }).join("") + "</div>" +
      '<div class="sec-t" style="margin-top:0">벌금</div><div class="card pad0" style="margin:0 0 ' + (Auth.isAdmin() ? "10px" : "0") + '">' +
      (fines.length ? fines.map(fineRow).join("") : '<div class="empty">없음</div>') + "</div>" +
      (Auth.isAdmin() ? '<button class="btn sm full" id="calAddFine">+ 이 날짜에 벌금 직접 추가</button>' : ""),
    after: () => {
      $$("[data-open-fine]", $("#ovl")).forEach(b => b.onclick = () => openFineModal(b.dataset.openFine));
      $$("[data-open-day]", $("#ovl")).forEach(b => b.onclick = () => openDayModal(b.dataset.openDay, b.dataset.uid));
      const af = $("#calAddFine");
      if (af) af.onclick = () => openAddFine({ date, uid: calUser !== "all" ? calUser : undefined });
    }
  });
}

/* ============================================================================
   순위 — 벌금 순위 / 개직 순위 / 개직 로그

function viewRank() {
  const p = Auth.profile, S = SET();
  const tab = App.rankTab;
  const ym = App.month;
  const [Y, M] = ym.split("-").map(Number);
  const last = new Date(Y, M, 0);
  const fines = collectFines({ from: ym + "-01", to: ym + "-" + pad(last.getDate()) }).filter(f => !f.pending);

  let h = '<div class="card"><div class="btn-row" style="align-items:center">' +
    '<button class="btn sm" id="rPrev">‹</button>' +
    '<div style="flex:1;text-align:center;font-size:16px;font-weight:800">' + Y + "년 " + M + "월</div>" +
    '<button class="btn sm" id="rNext">›</button>' +
    '<button class="btn sm" id="rNow">이번달</button></div></div>';

  h += '<div class="seg sm" style="margin-bottom:12px">' +
    [["fine", "벌금 순위"], ["gaejik", "개직 순위"], ["log", "개직 로그"]]
      .map(([k, t]) => '<button data-rtab="' + k + '" class="' + (tab === k ? "on" : "") + '">' + t + "</button>").join("") + "</div>";

  if (tab === "fine") {
    const map = {};
    ACTIVE_USERS().forEach(u => map[u.uid] = { u, total: 0, unpaid: 0, cnt: 0 });
    fines.filter(f => !f.waived).forEach(f => {
      const m = map[f.uid]; if (!m) return;
      m.total += f.amount; m.cnt++;
      if (f.status !== "paid") m.unpaid += f.amount;
    });
    const arr = Object.values(map).sort((a, b) => b.total - a.total || a.u.name.localeCompare(b.u.name, "ko"));
    const max = Math.max(1, arr.length ? arr[0].total : 1);
    const sum = arr.reduce((s, x) => s + x.total, 0);

    h += '<div class="grid g2"><div class="stat acc-r"><div class="lb">' + M + '월 팀 전체</div>' +
      '<div class="vl" style="font-size:19px">' + won(sum) + "</div></div>" +
      '<div class="stat"><div class="lb">내 순위</div><div class="vl">' +
      ((arr.findIndex(x => x.u.uid === p.uid) + 1) || "-") + "<span style='font-size:13px;color:var(--tx3)'>/" + arr.length + "</span></div></div></div>";

    h += '<div class="sec-t">' + M + "월 벌금 순위</div><div class='card pad0'>" +
      (arr.length ? arr.map((x, i) =>
        '<div class="row">' +
        '<div class="rk ' + (x.total > 0 ? (i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "") : "") + '">' + (i + 1) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(x.u.name) +
        (x.u.uid === p.uid ? ' <span class="bdg b">나</span>' : "") +
        ' <span class="bdg ' + gradeInfo(x.u).color + '">' + esc(gradeOf(x.u)) + "</span></div>" +
        '<div style="height:5px;background:#eef1f6;border-radius:3px;margin-top:6px;overflow:hidden">' +
        '<div style="height:100%;width:' + Math.round(x.total / max * 100) + '%;background:linear-gradient(90deg,#ff8a7a,var(--dan));border-radius:3px"></div></div>' +
        '<div class="ds">' + x.cnt + "건" + (x.unpaid ? " · 미납 " + won(x.unpaid) : " · 전액 납부") + "</div></div>" +
        '<div style="text-align:right"><div style="font-size:17px;font-weight:800;color:' + (x.total ? "var(--dan)" : "var(--tx3)") + '">' +
        won(x.total) + "</div></div></div>").join("") : '<div class="empty">데이터가 없습니다</div>') + "</div>";
  }

  if (tab === "gaejik") {
    const users = ACTIVE_USERS().slice().sort((a, b) => Number(b.gaejik || 0) - Number(a.gaejik || 0) || a.name.localeCompare(b.name, "ko"));
    const max = Math.max(1, users.length ? Number(users[0].gaejik || 0) : 1);
    h += '<div class="grid g2">' +
      '<div class="stat acc-p"><div class="lb">내 개직 잔여</div><div class="vl">' + Number(p.gaejik || 0) + "</div>" +
      '<div class="sub">매달 +' + S.monthlyGaejik + " · 무벌금 +" + S.cleanBonus + " · 생일 +" + S.birthdayGaejik + "</div></div>" +
      '<div class="stat"><div class="lb">팀 전체 보유</div><div class="vl">' +
      users.reduce((s, u) => s + Number(u.gaejik || 0), 0) + "</div></div></div>";
    h += '<div class="sec-t">개직 보유 순위</div><div class="card pad0">' +
      (users.length ? users.map((u, i) =>
        '<div class="row"><div class="rk ' + (i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "") + '">' + (i + 1) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(u.name) + (u.uid === p.uid ? ' <span class="bdg b">나</span>' : "") +
        (u.birth && Number(u.birth.split("-")[1]) === new Date().getMonth() + 1 ? ' <span class="bdg p">🎂 이번달</span>' : "") + "</div>" +
        '<div style="height:5px;background:#eef1f6;border-radius:3px;margin-top:6px;overflow:hidden">' +
        '<div style="height:100%;width:' + Math.round(Number(u.gaejik || 0) / max * 100) + '%;background:linear-gradient(90deg,#b79cff,var(--pur));border-radius:3px"></div></div></div>' +
        '<div style="text-align:right"><div style="font-size:19px;font-weight:800;color:var(--pur)">' + Number(u.gaejik || 0) + "</div>" +
        (Auth.isAdmin() ? '<button class="btn xs" data-gj="' + u.uid + '" style="margin-top:4px">조정</button>' : "") + "</div></div>").join("")
        : '<div class="empty">팀원이 없습니다</div>') + "</div>";
  }

  if (tab === "log") {
    const logs = DB.all("glog").sort((a, b) => (b.at || 0) - (a.at || 0));
    h += '<div class="card pad0">' +
      (logs.length ? logs.slice(0, 100).map(l =>
        '<div class="row"><span class="bdg ' + (l.delta > 0 ? "g" : "r") + '" style="min-width:38px;justify-content:center">' +
        (l.delta > 0 ? "+" : "") + l.delta + "</span>" +
        '<div class="sp"><div class="nm">' + esc(l.name) + ' <span style="color:var(--tx3);font-weight:600">· ' + esc(l.reason) + "</span></div>" +
        '<div class="ds">' + tsFmtFull(l.at) + " · " + esc(l.by || "-") + " · 이후 " + l.after + "개</div></div>" +
        (l.auto ? '<span class="bdg p">자동</span>' : '<span class="bdg n">수동</span>') + "</div>").join("")
        : '<div class="empty">변동 내역이 없습니다</div>') + "</div>";
  }
  return h;
}

function bindRank() {
  $$("[data-rtab]").forEach(b => b.onclick = () => { App.rankTab = b.dataset.rtab; render(); });
  const shift = n => {
    let [Y, M] = App.month.split("-").map(Number);
    M += n; if (M < 1) { M = 12; Y--; } if (M > 12) { M = 1; Y++; }
    App.month = Y + "-" + pad(M); render();
  };
  $("#rPrev").onclick = () => shift(-1);
  $("#rNext").onclick = () => shift(1);
  $("#rNow").onclick = () => { App.month = monthOf(today()); render(); };
  $$("[data-gj]").forEach(b => b.onclick = () => openGaejikModal(b.dataset.gj));
}

function openGaejikModal(uid) {
  const u = DB.get("users", uid); if (!u) return;
  modal({
    title: esc(u.name) + " 개직 조정",
    body: '<div class="stat acc-p" style="margin-bottom:14px"><div class="lb">현재 잔여</div>' +
      '<div class="vl">' + Number(u.gaejik || 0) + "개</div></div>" +
      '<div class="fld"><label>증감</label>' +
      '<div class="cnt"><button id="gjM">−</button><div class="v" id="gjV">+1</div><button id="gjP">＋</button></div></div>' +
      '<div class="fld"><label>사유 <span style="color:var(--tx3);font-weight:600">(선택 · 비우면 "관리자 지급")</span></label>' +
      '<input class="inp" id="gjR" placeholder="예: 특별 포상"></div>' +
      '<div class="btn-row">' + ["연간 개직 부여", "특별 포상", "관리자 조정"].map(t =>
        '<button class="btn xs" data-gr="' + t + '">' + t + "</button>").join("") + "</div>",
    okText: "적용",
    onOk: async () => {
      const d = Number($("#gjV").textContent);
      const r = $("#gjR").value.trim() || (d > 0 ? "관리자 지급" : "관리자 차감");
      if (!d) { toast("증감 값을 지정해주세요", "err"); return false; }
      if (Number(u.gaejik || 0) + d < 0) { toast("잔여가 0 미만이 될 수 없습니다", "err"); return false; }
      await changeGaejik(uid, d, r);
      toast("개직 " + (d > 0 ? "+" : "") + d + "개 반영됨", "ok");
    },
    after: () => {
      const v = $("#gjV"); const set = n => v.textContent = (n > 0 ? "+" : "") + n;
      $("#gjP").onclick = () => set(Math.min(30, Number(v.textContent) + 1));
      $("#gjM").onclick = () => set(Math.max(-30, Number(v.textContent) - 1));
      $$("[data-gr]").forEach(b => b.onclick = () => $("#gjR").value = b.dataset.gr);
    }
  });
}

function adminPayLog() {
  const all = collectFines({});
  const submitted = all.filter(f => f.status === "submitted");
  const paid = all.filter(f => f.status === "paid").sort((a, b) => (b.confirmedAt || 0) - (a.confirmedAt || 0));
  const unpaidByUser = {};
  ACTIVE_USERS().forEach(u => unpaidByUser[u.uid] = { u, amt: 0, cnt: 0 });
  all.filter(f => !f.waived && !f.pending && f.status === "unpaid").forEach(f => {
    const m = unpaidByUser[f.uid]; if (m) { m.amt += f.amount; m.cnt++; }
  });

  const card = (f, showConfirm) =>
    '<div class="row">' +
    (f.proof ? '<img src="' + f.proof + '" class="thumb sm" style="cursor:pointer" data-img="' + f.proof + '" data-imgt="' + esc(f.name) + ' 납부 캡쳐">'
             : '<div class="thumb sm" style="display:flex;align-items:center;justify-content:center;color:var(--tx3)">—</div>') +
    '<div class="sp" data-open-fine="' + f.id + '" style="cursor:pointer">' +
    '<div class="nm">' + esc(f.name) + " · " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) + "</div>" +
    '<div class="ds">' + fmtD(f.date) + " · 제출 " + tsFmt(f.proofAt) +
    (f.confirmedAt ? " · 확인 " + tsFmt(f.confirmedAt) + " (" + esc(f.confirmedBy || "") + ")" : "") + "</div></div>" +
    (showConfirm ? '<button class="btn xs ok" data-pconf="' + f.id + '">확인</button>' : '<span class="bdg g">완료</span>') +
    "</div>";

  return '<div class="sec-t">납부 확인 대기 ' + submitted.length + "건</div><div class='card pad0'>" +
    (submitted.length ? submitted.map(f => card(f, true)).join("") : '<div class="empty">대기 중인 건이 없습니다</div>') + "</div>" +
    '<div class="sec-t">미납 현황</div><div class="card pad0">' +
    (Object.values(unpaidByUser).filter(x => x.cnt).length
      ? Object.values(unpaidByUser).filter(x => x.cnt).sort((a, b) => b.amt - a.amt).map(x =>
        '<div class="row"><div class="avatar">' + esc(initial(x.u.name)) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(x.u.name) + '</div><div class="ds">' + x.cnt + "건 미납</div></div>" +
        '<div style="font-weight:800;color:var(--dan)">' + won(x.amt) + "</div></div>").join("")
      : '<div class="empty">미납자가 없습니다 🎉</div>') + "</div>" +
    '<div class="sec-t">납부 완료 로그 (' + paid.length + "건)</div><div class='card pad0'>" +
    (paid.length ? paid.slice(0, 60).map(f => card(f, false)).join("") : '<div class="empty">기록 없음</div>') + "</div>";
}

const KR_HOLIDAYS = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
  "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
const KR_LUNAR = {
  2026: [["02-16", "설날 연휴"], ["02-17", "설날"], ["02-18", "설날 연휴"], ["05-24", "부처님오신날"], ["09-24", "추석 연휴"], ["09-25", "추석"], ["09-26", "추석 연휴"]],
  2027: [["02-06", "설날 연휴"], ["02-07", "설날"], ["02-08", "설날 연휴"], ["05-13", "부처님오신날"], ["09-14", "추석 연휴"], ["09-15", "추석"], ["09-16", "추석 연휴"]]
};
async function presetHolidays() {
  const Y = new Date().getFullYear(); let n = 0;
  for (const y of [Y, Y + 1]) {
    for (const md in KR_HOLIDAYS) {
      const d = y + "-" + md;
      if (!DB.get("holidays", d)) { await DB.set("holidays", d, { date: d, name: KR_HOLIDAYS[md], work: false }); n++; }
    }
    for (const [md, nm] of (KR_LUNAR[y] || [])) {
      const d = y + "-" + md;
      if (!DB.get("holidays", d)) { await DB.set("holidays", d, { date: d, name: nm, work: false }); n++; }
    }
  }
  toast(n + "개 공휴일이 등록되었습니다", "ok");
}

/* ============================================================================
   개직 자동지급 — 매월 1일 기본 + 전월 무벌금 보너스 + 생일
   ============================================================================ */
async function runMonthlyGrant(force) {
  if (!Auth.isAdmin()) return 0;
  const S = SET();
  const ym = monthOf(today());
  const pm = prevMonth(ym);
  const Y = new Date().getFullYear(), M = new Date().getMonth() + 1;
  let n = 0;

  for (const u of ACTIVE_USERS()) {
    if (!force && u.lastGrant === ym) continue;
    if (u.lastGrant === ym && !force) continue;

    let total = 0;
    const parts = [];

    if (u.lastGrant !== ym) {
      if (Number(S.monthlyGaejik) > 0) { total += Number(S.monthlyGaejik); parts.push("월 정기 +" + S.monthlyGaejik); }

      /* 전월 무벌금 보너스 (전월에 이미 소속돼 있던 사람만) */
      const joinedYM = u.joinedAt ? monthOf(dstr(new Date(u.joinedAt))) : ym;
      if (Number(S.cleanBonus) > 0 && joinedYM <= pm) {
        const lastDay = new Date(Number(pm.split("-")[0]), Number(pm.split("-")[1]), 0).getDate();
        const pf = collectFines({ uid: u.uid, from: pm + "-01", to: pm + "-" + pad(lastDay) });
        const amt = sumFines(pf);
        if (amt === 0) { total += Number(S.cleanBonus); parts.push("전월 무벌금 +" + S.cleanBonus); }
      }
    }

    /* 생일 달 */
    if (Number(S.birthdayGaejik) > 0 && u.birth && Number(String(u.birth).split("-")[1]) === M && Number(u.bdayYear || 0) < Y) {
      total += Number(S.birthdayGaejik);
      parts.push("🎂 생일 +" + S.birthdayGaejik);
    }

    if (total > 0) {
      const after = Number(u.gaejik || 0) + total;
      const patch = { gaejik: after, lastGrant: ym };
      if (parts.some(x => x.indexOf("생일") >= 0)) patch.bdayYear = Y;
      await DB.set("users", u.uid, patch);
      await DB.add("glog", {
        uid: u.uid, name: u.name, delta: total, after,
        reason: ym.replace("-", "년 ") + "월 자동지급 · " + parts.join(" / "),
        auto: true, by: "시스템", at: Date.now(), date: today()
      });
      n++;
    } else if (u.lastGrant !== ym) {
      await DB.set("users", u.uid, { lastGrant: ym });
    }
  }
  return n;
}

/* ============================================================================
   프로필 / 렌더 보조
   ============================================================================ */
let _rt = null, _pendingR = false;
function scheduleRender() {
  clearTimeout(_rt);
  _rt = setTimeout(() => {
    if ($("#ovl")) { _pendingR = true; return; }
    const a = document.activeElement;
    let key = null, ss = null;
    if (a && a.dataset && a.dataset.ct) key = '[data-ct="' + a.dataset.ct + '"]';
    else if (a && a.dataset && a.dataset.cktx) key = '[data-cktx="' + a.dataset.cktx + '"]';
    else if (a && a.id) key = "#" + a.id;
    try { ss = a && a.selectionStart; } catch (e) { }
    render();
    if (key) { const el = $(key); if (el) { try { el.focus(); if (ss != null && el.setSelectionRange) el.setSelectionRange(ss, ss); } catch (e) { } } }
  }, 160);
}
const _closeModal = closeModal;
closeModal = function () { _closeModal(); if (_pendingR) { _pendingR = false; scheduleRender(); } };

function syncProfile() {
  if (!Auth.user) { Auth.profile = null; return; }
  Auth.profile = DB.get("users", Auth.user.uid);
}

/* ============================================================================
   부팅 - With Partners 로그인 세션을 그대로 이어받는다. 이 페이지 자체의 회원가입/
   로그인/승인 대기 화면은 없으며, 로그인되어 있지 않으면 requireLogin()이
   자동으로 login.html로 보낸다.
   ============================================================================ */
let _rtStarted = false;
async function afterSignedIn(uid, birthFromSignup) {
  try {
    await ensureMyAttendanceProfile(uid, birthFromSignup);
    await Promise.all([DB.loadAll(), refreshMainProfile()]);
    if (!_rtStarted) { DB.subscribeRT(); _rtStarted = true; }
  } catch (e) { console.error(e); toast(cleanErr(e), "err"); }
}

/** 이 팀원의 attendance_profiles 행이 아직 없으면(=근태 페이지 첫 방문) 기본값으로 하나 만든다. */
async function ensureMyAttendanceProfile(uid, birthFromSignup) {
  const { data, error } = await DB.sb.from("attendance_profiles").select("uid").eq("uid", uid).maybeSingle();
  if (error) { console.warn(error.message); return; }
  if (!data) {
    const row = { uid };
    if (birthFromSignup) row.birth = birthFromSignup;
    const { error: insErr } = await DB.sb.from("attendance_profiles").insert(row);
    if (insErr) console.warn(insErr.message);
  }
}

DB.mode = "sb";
DB.sb = supabaseClient;

(async function boot() {
  DB.onChange(() => { syncProfile(); scheduleRender(); });

  const session = await requireLogin(); // assets/supabase-client.js - 미로그인이면 login.html로 이동
  if (!session) return;

  const mainProfile = await getMyProfile(); // assets/supabase-client.js
  if (!mainProfile || mainProfile.approval_status !== "approved") {
    App.booting = false;
    $("#root").innerHTML =
      '<div class="auth"><div class="auth-box" style="text-align:center">' +
      '<div class="auth-logo"><div class="ic">⏳</div><h1>승인 대기중</h1>' +
      '<p>관리자 승인 후 이용할 수 있습니다.<br>승인 관련 문의는 관리자에게 해주세요.</p></div>' +
      '<button class="btn full" id="pOut" style="margin-top:10px">로그아웃</button></div></div>';
    const pOut = $("#pOut"); if (pOut) pOut.onclick = () => Auth.logout();
    return;
  }

  const birthFromSignup = (session.user.user_metadata && session.user.user_metadata.birth) || null;
  Auth.user = { uid: session.user.id, email: session.user.email };
  Auth.mainProfile = mainProfile;

  supabaseClient.auth.onAuthStateChange((evt) => {
    if (evt === "SIGNED_OUT") window.location.href = "login.html";
  });

  await afterSignedIn(Auth.user.uid, birthFromSignup);
  App.booting = false;
  syncProfile();
  render();
  setTimeout(() => { try { runMonthlyGrant(false); } catch (e) { } }, 3000);

  setInterval(() => {
    if (Auth.user && !document.hidden) Promise.all([DB.loadAll(), refreshMainProfile()]).catch(() => { });
  }, 90000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Auth.user) Promise.all([DB.loadAll(), refreshMainProfile()]).catch(() => { });
  });
})();

const _render = render;
render = function () {
  if (!App.booting && Auth.user && DB.ready && !DB.get("users", Auth.user.uid)) {
    const now = Date.now();
    if (!window._missSince) window._missSince = now;
    $("#root").innerHTML = bootScreen();
    setTimeout(() => { DB.loadAll().catch(() => render()); }, 1300);
    return;
  }
  window._missSince = 0;
  _render();
};

</script>
