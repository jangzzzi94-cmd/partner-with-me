<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J마켓 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partners</span></a>
<nav><a href="admin.html" id="adminLink" style="display:none">관리자</a><a href="profile.html">프로필</a><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap">
<h1>J마켓</h1>
<p class="sub" id="pointsLine">보유 포인트를 불러오는 중...</p>

<div id="marketItemsWrap" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-bottom:36px;">불러오는 중...</div>

<div class="auth-card" style="max-width:100%;">
  <h2 style="font-size:16px;margin:0 0 6px;color:var(--navy-950);">내 구매 내역</h2>
  <div id="myOrdersWrap">불러오는 중...</div>
</div>
</div>

<script src="assets/supabase-client.js"></script>
<script>
async function refreshPointsLine(){
  const profile = await getMyProfile();
  const pointsLine = document.getElementById('pointsLine');
  pointsLine.textContent = '보유 포인트: ' + ((profile && profile.points) || 0).toLocaleString() + 'P';
  return profile;
}

async function loadMarketItemsForMember(){
  const wrap = document.getElementById('marketItemsWrap');
  const rows = await getMarketItems();
  const activeRows = (rows || []).filter(function(r){ return r.is_active !== false; });
  if(activeRows.length === 0){
    wrap.textContent = '등록된 상품이 없습니다.';
    return;
  }
  wrap.innerHTML = '';
  activeRows.forEach(function(item){
    const card = document.createElement('div');
    card.className = 'auth-card';
    card.style.maxWidth = '100%';
    card.style.padding = '20px';
    card.style.display = 'flex';
    card.style.flexDirection = 'column';

    const name = document.createElement('h3');
    name.style.fontSize = '15px';
    name.style.margin = '0 0 8px';
    name.style.color = 'var(--navy-950)';
    name.textContent = item.name;
    card.appendChild(name);

    if(item.description){
      const desc = document.createElement('p');
      desc.className = 'sub';
      desc.style.margin = '0 0 12px';
      desc.style.fontSize = '13px';
      desc.style.flex = '1';
      desc.textContent = item.description;
      card.appendChild(desc);
    }

    const cost = document.createElement('p');
    cost.style.fontWeight = '700';
    cost.style.fontSize = '16px';
    cost.style.color = 'var(--navy-700)';
    cost.style.margin = '0 0 14px';
    cost.textContent = (item.point_cost || 0).toLocaleString() + 'P';
    card.appendChild(cost);

    const buyBtn = document.createElement('button');
    buyBtn.type = 'button';
    buyBtn.className = 'btn-primary';
    buyBtn.style.marginTop = '0';
    buyBtn.textContent = '구매';
    buyBtn.addEventListener('click', async function(){
      if(!window.confirm((item.point_cost || 0).toLocaleString() + 'P를 사용해 "' + item.name + '"을(를) 구매하시겠습니까?')){
        return;
      }
      buyBtn.disabled = true;
      const result = await purchaseMarketItem(item.id);
      buyBtn.disabled = false;
      if(!result || !result.ok){
        alert('구매 실패: ' + ((result && result.message) || '알 수 없는 오류가 발생했습니다.'));
        return;
      }
      alert('구매가 완료되었습니다! 관리자가 확인 후 처리해드립니다.');
      await refreshPointsLine();
      await loadMyOrders();
    });
    card.appendChild(buyBtn);

    wrap.appendChild(card);
  });
}

var myOrderStatusLabels = { pending: '대기중', fulfilled: '완료' };
async function loadMyOrders(){
  const wrap = document.getElementById('myOrdersWrap');
  const rows = await getMyMarketOrders();
  if(!rows || rows.length === 0){
    wrap.textContent = '구매 내역이 없습니다.';
    return;
  }
  wrap.innerHTML = '';
  rows.forEach(function(row){
    const item = document.createElement('div');
    item.style.display = 'flex';
    item.style.justifyContent = 'space-between';
    item.style.alignItems = 'center';
    item.style.gap = '10px';
    item.style.padding = '9px 2px';
    item.style.borderBottom = '1px solid var(--line)';
    item.style.fontSize = '13.5px';

    const left = document.createElement('div');
    left.textContent = row.item_name + ' · ' + (row.created_at ? new Date(row.created_at).toLocaleString('ko-KR') : '-');

    const right = document.createElement('div');
    right.style.textAlign = 'right';
    right.style.flex = 'none';
    const costSpan = document.createElement('div');
    costSpan.style.fontWeight = '600';
    costSpan.textContent = (row.point_cost || 0).toLocaleString() + 'P';
    const statusSpan = document.createElement('div');
    statusSpan.style.fontSize = '12px';
    statusSpan.style.color = 'var(--muted)';
    statusSpan.textContent = myOrderStatusLabels[row.status] || row.status;
    right.appendChild(costSpan);
    right.appendChild(statusSpan);

    item.appendChild(left);
    item.appendChild(right);
    wrap.appendChild(item);
  });
}

(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  const profile = await getMyProfile();
  if(profile && profile.role === 'admin'){
    document.getElementById('adminLink').style.display = 'inline';
  }
  await refreshPointsLine();
  await loadMarketItemsForMember();
  await loadMyOrders();
})();

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
