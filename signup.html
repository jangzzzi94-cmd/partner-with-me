<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
  <a href="index.html" class="brand">With <span>Partners</span></a>
  <nav><a href="login.html">로그인</a></nav>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>회원가입</h1>
    <p class="sub">이메일로 간편하게 가입하세요</p>
    <form id="signupForm">
      <div class="field">
        <label>이름</label>
        <input type="text" id="name" required maxlength="20" placeholder="예: 홍길동">
      </div>
      <div class="field">
        <label>별명</label>
        <input type="text" id="nickname" required maxlength="20" placeholder="예: 김대박 설계사">
      </div>
      <div class="field">
        <label>생년월일 <span style="font-weight:400;opacity:.6;font-size:12px;">(선택, 출근보고/근태 이용 시 사용)</span></label>
        <input type="date" id="birth">
      </div>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="password" required minlength="6" placeholder="6자 이상">
      </div>
      <div class="field">
        <label>비밀번호 확인</label>
        <input type="password" id="password2" required minlength="6" placeholder="비밀번호 재입력">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">가입하기</button>
    </form>
    <div class="links-row">
      <a href="login.html">이미 계정이 있으신가요? 로그인</a>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  const name = document.getElementById('name').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const birth = document.getElementById('birth').value; // 선택 입력 - 출근보고/근태 페이지에서 생일 개직 지급 등에 사용
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if(!name || !nickname){
    msg.className='msg err show';
    msg.textContent = '이름과 별명을 모두 입력해주세요.';
    return;
  }
  if(password !== password2){
    msg.className='msg err show';
    msg.textContent = '비밀번호가 일치하지 않습니다.';
    return;
  }
  btn.disabled = true; btn.textContent='가입 처리 중...';
  // 가입 확인 이메일의 링크를 눌렀을 때 Supabase 기본값(Site URL)이 아니라 우리 사이트의
  // "이메일 인증 완료" 안내 페이지로 이동하도록 명시적으로 지정한다. (Supabase 대시보드의
  // Authentication > URL Configuration > Redirect URLs 허용 목록에 이 주소가 등록되어
  // 있어야 실제로 적용된다.)
  const emailRedirectTo = window.location.origin + window.location.pathname.replace('signup.html', 'email-confirmed.html');
  // 이름/별명은 auth 메타데이터(options.data)로 함께 보내서, 이메일 인증 전이라도(세션이
  // 아직 없어도) DB의 가입 트리거(handle_new_user)가 profiles 행을 만들 때 바로 채워 넣는다.
  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: { emailRedirectTo, data: { name, nickname, birth: birth || null } },
  });
  btn.disabled = false; btn.textContent='가입하기';
  if(error){
    msg.className='msg err show';
    msg.textContent = error.message;
    return;
  }
  msg.className='msg ok show';
  msg.textContent = '가입 신청이 완료되었습니다. 이메일로 발송된 인증 링크를 확인해주세요.';
  document.getElementById('signupForm').reset();
});
</script>
</body>
</html>
