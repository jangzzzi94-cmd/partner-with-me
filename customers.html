<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객리스트 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .cu-wrap{max-width:1100px;margin:0 auto;padding:20px 14px 90px;}
  .cu-head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px;}
  .cu-head h1{font-size:22px;margin:0;color:var(--navy-950);white-space:nowrap;}
  .cu-btn{background:#fff;border:1px solid var(--line);color:var(--navy-800);padding:8px 13px;border-radius:8px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .cu-btn:hover{border-color:var(--navy-600);}
  .cu-btn:disabled{opacity:.5;cursor:not-allowed;}
  .cu-btn.primary{background:var(--navy-900);border-color:var(--navy-900);color:#fff;font-weight:700;}
  .cu-btn.danger{color:var(--danger);border-color:#f0c6c1;}
  .cu-btn.sm{padding:5px 10px;font-size:12.5px;}
  .cu-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .cu-tools input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;}
  .cu-status{font-size:12px;color:var(--muted);}
  .cu-status.warn{color:#b45309;font-weight:600;}
  .cu-addprop{display:none;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .cu-addprop input,.cu-addprop select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;font-family:inherit;}
  .cu-tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);}
  table.cu-table{border-collapse:collapse;width:100%;font-size:14px;}
  .cu-table th{position:sticky;top:0;background:var(--navy-100);color:var(--navy-950);text-align:left;padding:10px 12px;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer;z-index:2;}
  .cu-table th .hm{margin-left:6px;color:var(--muted);font-weight:700;cursor:pointer;padding:0 4px;}
  .cu-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;min-width:0;}
  .cell-clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* 칸 사이 공백을 모두 같게: 표를 격자로 만들고 남는 폭을 모든 칸에 똑같이 나눈다 (화면이 좁아지면 공백이 줄어듦) */
  table.cu-table{display:grid;width:100%;}
  .cu-table thead,.cu-table tbody,.cu-table tr{display:contents;}
  .fam-scroll{width:205px;max-width:205px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;cursor:grab;overscroll-behavior-x:contain;}
  .fam-scroll::-webkit-scrollbar{display:none;}
  .fam-scroll.more{-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent);}
  .fam-scroll.drag{cursor:grabbing;user-select:none;}
  .cu-table tr.row{cursor:pointer;}
  .cu-table tr.row:hover td{background:#f7f9fd;}
  .cu-table td.name{font-weight:700;color:var(--navy-950);}
  .cu-empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px;}
  .chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;margin:1px 4px 1px 0;white-space:nowrap;}
  .cu-safe{margin-top:14px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;}
  .cu-safe-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .cu-delrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .cu-delrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cu-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .cu-bar .sp{flex:1;}
  .cu-titlerow{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;}
  .cu-title{flex:0 0 36%;max-width:220px;min-width:0;font-size:22px;font-weight:800;color:var(--navy-950);border:none;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;font-family:inherit;}
  .ref-box{flex:1;min-width:0;}
  .rel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;align-items:start;}
  .rel-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 10px 10px;min-width:0;}
  .rel-lab{font-size:12.5px;font-weight:800;color:var(--navy-900);margin-bottom:6px;}
  .rel-in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;}
  .fam-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .fam-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;max-width:100%;}
  .fam-chip .fam-go{border:0;background:none;padding:3px 4px 3px 11px;font-size:12.5px;color:var(--navy-800);cursor:pointer;font-family:inherit;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fam-chip .fam-go:hover{text-decoration:underline;}
  .fam-chip .fam-x{border:0;background:none;padding:3px 8px 3px 2px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .fam-chip .fam-x:hover{color:var(--danger);}
  .fam-none{font-size:12.5px;color:var(--muted);}
  .ref-main{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:38px;}
  .ref-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .ref-quick button{border:1px solid var(--line);background:#fff;color:var(--navy-800);border-radius:14px;padding:3px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .ref-quick button.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff;font-weight:700;}
  .cu-addbtns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
  .cu-table th .ph,.prop-name::placeholder,.th-input::placeholder{color:#a9b3c4;font-weight:600;}
  .th-input{width:110px;padding:3px 6px;border:1px solid var(--navy-600);border-radius:6px;font-size:13px;font-family:inherit;}
  .prop-label{display:flex;align-items:flex-start;gap:2px;}
  .prop-name{flex:1;min-width:0;border:none;background:transparent;font:inherit;font-weight:700;color:var(--muted);padding:7px 0;}
  .prop-name:focus{outline:none;border-bottom:1px solid var(--navy-600);}
  .chip-x{position:relative;display:inline-block;}
  .chip-x .x{position:absolute;top:-6px;right:-4px;width:16px;height:16px;line-height:14px;text-align:center;font-size:12px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;display:none;}
  .chip-x:hover .x{display:block;}
  @media (hover:none){.chip-x .x{display:block;}}
  .cu-title:focus{outline:none;border-bottom-color:var(--navy-600);}
  .cu-sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
  .cu-sec h2{font-size:14.5px;margin:0 0 10px;color:var(--navy-950);}
  .prop-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);}
  .prop-row:last-child{border-bottom:none;}
  .prop-label{flex:none;width:120px;font-size:13px;color:var(--muted);font-weight:700;padding-top:7px;word-break:keep-all;}
  .prop-label .hm{cursor:pointer;padding:0 4px;color:var(--muted);}
  .prop-val{flex:1;min-width:0;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;}
  .prop-val input[type=text],.prop-val input[type=date],.prop-val textarea{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff;}
  .prop-val textarea{resize:none;overflow:hidden;line-height:1.5;}
  .prop-val .ro{padding:7px 0;font-size:14px;color:var(--ink);}
  .ms-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:34px;flex:1;}
  .cu-pop{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(15,37,69,.18);padding:8px;min-width:200px;max-width:280px;}
  .cu-pop .opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px;}
  .cu-pop .opt:hover{background:var(--navy-100);}
  .cu-pop .opt .x{margin-left:auto;color:var(--muted);padding:0 4px;}
  .cu-pop input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-top:6px;font-family:inherit;}
  .cu-pop .mi{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
  .cu-pop .mi:hover{background:var(--navy-100);}
  .cu-sec.dragover{outline:3px dashed var(--navy-600);outline-offset:-3px;background:#eef3fc;}
  .pendfiles .pf img{height:34px;width:34px;object-fit:cover;border-radius:6px;display:block;}
  .att video{max-width:280px;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;background:#000;}
  .md-back{position:fixed;inset:0;background:rgba(10,26,48,.55);z-index:150;display:none;align-items:flex-start;justify-content:center;padding:max(12px,4vh) 12px 12px;}
  .md-card{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.3);}
  .md-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy-950);font-size:15px;}
  .md-head button{border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);padding:0 6px;}
  .md-body{padding:12px 14px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain;}
  .md-back{overscroll-behavior:contain;}
  .ct-box{display:inline-block;width:21px;height:21px;border:1.8px solid #b9c3d3;border-radius:6px;background:transparent;position:relative;vertical-align:middle;}
  .ct-box.on{background:#16a34a;border-color:#16a34a;}
  .ct-box.on::after{content:'';position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .dz{border:2px dashed #b9c3d3;border-radius:12px;padding:26px 14px;text-align:center;color:var(--muted);font-size:14px;background:#f8fafc;transition:background .12s,border-color .12s;}
  .dz.over{background:#e8f6ee;border-color:#16a34a;color:#166534;}
  .dz .cu-btn{margin-top:10px;}
  .ct-sum{margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--navy-950);}
  .ct-sum b{font-weight:800;}
  .ct-sum .warn{color:#b45309;}
  .ct-sum details{margin-top:6px;font-size:12.5px;color:var(--muted);}
  .ct-sum details div{max-height:140px;overflow-y:auto;word-break:keep-all;margin-top:4px;}
  .ctl-wrap{overflow-x:auto;margin-top:4px;}
  .ctl{min-width:730px;}
  .ctl-row{display:grid;grid-template-columns:88px 78px 118px minmax(140px,1fr) 78px 74px 62px;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .ctl-row.hd{font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 4px 6px;}
  .ctl-row:last-child{border-bottom:none;}
  .ctl-row .ins{font-weight:700;color:var(--navy-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctl-row .no{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155;}
  .ctl-row .pd{white-space:nowrap;overflow-x:auto;scrollbar-width:none;cursor:grab;}
  .ctl-row .pd::-webkit-scrollbar{display:none;}
  .ctl-row .pd.more{-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent);}
  .ctl-row .pd.drag{cursor:grabbing;user-select:none;}
  .ctl-row .pm{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:30px;}
  .ctl-row .dt{white-space:nowrap;color:#334155;font-variant-numeric:tabular-nums;}
  .ctl-row .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;}
  .st.ok{background:#dcfce7;color:#166534;}
  .st.bad{background:#fee2e2;color:#b91c1c;}
  .st.warn{background:#ffedd5;color:#c2410c;}
  .st.lapse{background:#fef3c7;color:#92400e;}
  .st.info{background:#dbeafe;color:#1d4ed8;}
  .st.gray{background:#e5e7eb;color:#4b5563;}
  .ctl-none{color:var(--muted);font-size:13px;padding:6px 2px;}
  .box.folded .ctl-wrap,.box.folded .ctl-none{display:none !important;}
  .ti-prev{margin-top:10px;display:grid;grid-template-columns:104px 1fr;gap:5px 10px;font-size:13.5px;}
  .ti-prev .k{color:var(--muted);font-weight:700;}
  .ti-prev .v{color:var(--navy-950);word-break:break-all;}
  .ti-prev .v.none{color:#c4cad6;}
  .ti-extra{grid-column:1 / -1;color:#b45309;font-size:12.5px;}
  .tm-grp{font-size:12.5px;font-weight:800;color:var(--muted);margin:12px 2px 6px;}
  .tm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;flex-wrap:wrap;}
  .tm-row .nm{font-weight:800;color:var(--navy-950);font-size:14.5px;}
  .tm-row .sub{font-size:12px;color:var(--muted);margin-left:6px;font-weight:600;}
  .tm-row .bt{display:flex;gap:6px;}
  .tm-row .bt .cu-btn{padding:6px 10px;font-size:12.5px;}
  .ln-card{max-width:none;width:calc(100vw - 20px);height:calc(100vh - 24px);height:calc(100dvh - 24px);max-height:none;}
  .ln-card .md-head{gap:8px;flex-wrap:wrap;}
  .ln-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .ln-tools .cu-btn.sm{padding:5px 10px;font-size:12.5px;}
  .ln-tools button[data-close]{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:0 4px;}
  .ln-view{flex:1;min-height:0;position:relative;overflow:hidden;background:#f6f8fc;touch-action:none;cursor:grab;}
  .ln-view.drag{cursor:grabbing;}
  .ln-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .ln-stage svg{display:block;}
  .ln-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:15px;padding:20px;line-height:1.6;}
  .ln-foot{padding:7px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);}

  /* 직업 찾기: 검색창은 고정하고 목록만 스크롤한다 (한글 입력 확정 때 브라우저가 검색창으로 스크롤을 되돌리는 문제 방지) */
  #jobModal .md-body{display:flex;flex-direction:column;overflow:hidden;}
  #jobModal #jobQuery,#jobModal .md-hint{flex:none;}
  #jobModal #jobResults{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
  #jobModal #jobResults[style*="display: none"]{display:none !important;}
  .md-body input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;}
  .md-list{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .md-list .jo{padding:11px 12px;font-size:14.5px;line-height:1.45;cursor:pointer;border-bottom:1px solid var(--line);word-break:keep-all;}
  .md-list .jo:last-child{border-bottom:none;}
  .md-list .jo:hover{background:var(--navy-100);}
  .md-list .jo mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px;}
  .md-list .jo{display:grid;grid-template-columns:38% 1fr;column-gap:10px;align-items:start;}
  .md-list .jn{font-weight:700;color:var(--navy-950);font-size:15px;line-height:1.4;}
  .md-list .jd{font-size:10px;color:var(--muted);line-height:1.5;font-weight:400;padding-top:3px;word-break:keep-all;}
  .md-list .jo.nodesc{grid-template-columns:1fr;}
  .md-hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
  #addrEmbed{width:100%;height:min(460px,64vh);}
  .ref-pop{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--navy-600);border-radius:10px;box-shadow:0 10px 28px rgba(15,37,69,.2);z-index:60;max-height:260px;overflow-y:auto;}
  .ref-opt{padding:10px 12px;font-size:14.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ref-opt:last-child{border-bottom:none;}
  .ref-opt:hover,.ref-opt.on{background:var(--navy-100);}
  .ref-opt.free{color:var(--muted);font-size:13px;}
  .box-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .box-head .btns{margin:0;}
  .box-head label{margin:0;}
  .box-head .btns{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:640px){.box-head{gap:6px;}.box-head .cu-btn.sm{padding:4px 7px;font-size:12px;}}
  .box-head.fold-head{flex-wrap:nowrap;}
  .box-head.fold-head .fold{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .box-head.fold-head .btns{margin-left:auto;flex-shrink:0;}
  @media (max-width:640px){
    .box-head.fold-head .fold{font-size:12px;}
    .box-head.fold-head .btns{gap:4px;}
    .box-head.fold-head .cu-btn.sm{padding:3px 6px;font-size:10.5px;white-space:nowrap;}
  }
  .box.folded .box-head{margin-bottom:0;}
  .fold{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy-900);cursor:pointer;user-select:none;padding:4px 0;}
  .fold .arr{font-size:12px;width:14px;}
  .fold .dot{width:7px;height:7px;border-radius:50%;background:#1d4ed8;display:none;}
  .box.folded textarea{display:none;}
  .box.folded .cv-grid,.box.folded .cv-none,.box.folded .cv-pdf,.box.folded .hf-list{display:none !important;}
  .hf-list .cv-pdf{margin-top:10px;}
  .hf-list .cv-pdf:first-child{margin-top:0;}
  .chat:empty{display:none;}
  .chat{max-height:58vh;overflow-y:auto;background:#f5f7fb;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;}
  .msg2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;max-width:100%;}
  .msg2 .body{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.55;}
  .msg2 .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted);}
  .msg2 .meta .sp{flex:1;}
  .msg2 .meta button{border:none;background:transparent;color:var(--navy-600);font-size:12px;cursor:pointer;padding:2px 4px;font-family:inherit;}
  .msg2 .meta button.del{color:var(--danger);}
  .att{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;}
  .att img{max-width:220px;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;}
  .att a.file{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--navy-800);background:#f7f9fd;max-width:100%;word-break:break-all;}
  .composer{display:flex;flex-direction:column;gap:8px;}
  .composer textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;}
  .composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pendfiles{display:flex;flex-wrap:wrap;gap:6px;}
  .pendfiles .pf{background:var(--navy-100);border-radius:14px;padding:3px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center;}
  .pendfiles .pf b{cursor:pointer;color:var(--muted);}
  .rel-card .ref-pop{left:0;right:auto;min-width:200px;}
  .box{margin-bottom:12px;}
  .box label{display:block;font-size:13px;font-weight:700;color:var(--navy-900);margin-bottom:5px;}

  /* ---------------- 작은 도구들 ---------------- */
  function h(tag, attrs, kids){
    var el = document.createElement(tag);
    if(attrs){
      for(var k in attrs){
        var v = attrs[k];
        if(k === 'class') el.className = v;
        else if(k === 'text') el.textContent = v;
        else if(k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else if(v !== false && v != null) el.setAttribute(k, v);
      }
    }
    (kids || []).forEach(function(c){ if(c == null) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
  function showToast(msg){
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';

  }

  function fmtDateTime(iso){
    if(!iso) return '';
    var d = new Date(iso);

  }

  function fmtSize(n){ if(n < 1024) return n + 'B'; if(n < 1048576) return (n / 1024).toFixed(0) + 'KB'; return (n / 1048576).toFixed(1) + 'MB'; }
  function errText(e){ return (e && e.message) ? String(e.message).slice(0, 90) : String(e); }

  /* ---- 복사 (클립보드 → 안 되면 선택 후 execCommand) ---- */
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.readOnly = true;
    ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ ta.setSelectionRange(0, text.length); }catch(e){}
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta); return ok;
  }
  function copyText(text, label){
    if(!text){ showToast('복사할 내용이 없어요'); return; }
    function done(){ showToast((label ? label + ' ' : '') + '복사되었습니다'); }
    function fb(){ if(fallbackCopy(text)) done(); else showToast('복사가 안 됐어요. 직접 선택해서 복사해 주세요'); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fb); } else { fb(); }
  }

  function pendGet(){ try{ return JSON.parse(localStorage.getItem(PEND_KEY) || '{}') || {}; }catch(e){ return {}; } }

    TEXT_FIELDS.forEach(function(f){ s[f] = c[f]; });

  function must(res){ if(res && res.error) throw res.error; return res; }
  // Supabase는 한 번에 1000줄까지만 주므로, 나눠서 끝까지 모두 가져온다
  async function fetchAll(build){
    var all = [], from = 0, step = 1000;
    for(;;){
      var res = must(await build().range(from, from + step - 1));
      var rows = res.data || [];
      all = all.concat(rows);
      if(rows.length < step) break;
      from += step;
    }
    return all;
  }
  async function loadProps(){
    props = await fetchAll(function(){ return sb.from('customer_props').select('*').is('deleted_at', null).order('position', { ascending: true }).order('created_at', { ascending: true }); });

    var rows = await fetchAll(function(){ return sb.from('customers').select('*').is('deleted_at', null).order('created_at', { ascending: false }); });

  }
  function dispName(c){ return ((c.name || '').trim()) || parsePersonalName(c.personal_text) || ''; }
  // 생년월일: 「생년월일 :」 줄이 있으면 그것, 없으면 주민등록번호 앞 6자리 (뒷자리는 화면에 쓰지 않는다)
  function birthOf(c){
    var t = c.personal_text || '', m, d;
    m = /^[ \t]*생년월일[ \t]*[:：][ \t]*(.*)$/m.exec(t);
    if(m){ d = m[1].replace(/\D/g, ''); if(d.length === 8) d = d.slice(2); if(d.length === 6) return d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4, 6); }
    m = /^[ \t]*주민등록번호[ \t]*[:：][ \t]*(.*)$/m.exec(t);
    if(m){ d = m[1].replace(/\D/g, ''); if(d.length >= 6) return d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4, 6); }
    return '';
  }
  var ncache = null;
  function nameCount(n){
    if(!ncache){ ncache = {}; customers.forEach(function(c){ var k = dispName(c).toLowerCase(); if(k) ncache[k] = (ncache[k] || 0) + 1; }); }
    return ncache[(n || '').toLowerCase()] || 0;
  }
  // 동명이인이 있으면 생년월일(없으면 등록일)을 같이 보여 준다
  function nameWithTag(c){
    var n = dispName(c) || '(이름 없음)';
    if(dispName(c) && nameCount(dispName(c)) > 1){
      var b = birthOf(c);
      return n + ' (' + (b ? b + '생' : '등록 ' + fmtDateTime(c.created_at).slice(0, 10)) + ')';
    }
    return n;
  }
  function refInfo(c){
    if(c.referrer_id){ var t = getCust(c.referrer_id); if(t) return { text: nameWithTag(t), id: t.id, plain: dispName(t) }; }
    var tx = (c.referrer_text || '').trim();
    return { text: tx, id: null, plain: tx };
  }
  function getCust(id){ for(var i = 0; i < customers.length; i++){ if(customers[i].id === id) return customers[i]; } return null; }
  // 가족: 내 고객 여러 명 (id 목록). 삭제된 고객은 건너뛴다
  function famList(c){ var out = []; (c.family_ids || []).forEach(function(id){ var t = getCust(id); if(t && t.id !== c.id) out.push(t); }); return out; }
  function famText(c){ return famList(c).map(nameWithTag).join(', '); }
  function getProp(id){ for(var i = 0; i < props.length; i++){ if(props[i].id === id) return props[i]; } return null; }

  /* ---------------- 저장 ---------------- */
  function setStatus(kind, msg){
    var els = [$('saveStatus'), $('listStatus')];
    els.forEach(function(el){
      el.className = 'cu-status' + (kind === 'warn' ? ' warn' : '');
      el.textContent = msg || '';
    });
  }
  function anyDirty(){ for(var k in dirty){ if(dirty[k]) return true; } return false; }
  function markDirty(c){
    ncache = null;
    dirty[c.id] = true;
    var p = pendGet(); p[c.id] = snapshot(c); pendSet(p);
    setStatus('', '저장 대기 중…');
    clearTimeout(saveTimers[c.id]);
    saveTimers[c.id] = setTimeout(function(){ saveCustomer(c.id); }, 900);
  }
  async function saveCustomer(id){
    var c = getCust(id);
    if(!c || saving[id]) return !saving[id];
    saving[id] = true;
    setStatus('', '저장 중…');
    try{
      // 제목(고객 이름)을 비워 두었으면 인적사항의 이름을 제목으로 저장한다 (입력 중이 아닐 때)
      var nameEl = $('custName');
      if(!(c.name || '').trim() && !(curId === id && document.activeElement === nameEl)){
        var dn = parsePersonalName(c.personal_text);
        if(dn){ c.name = dn; if(curId === id && nameEl) nameEl.value = dn; }
      }
      var body = { name: c.name, props: c.props, referrer_id: c.referrer_id || null, referrer_text: c.referrer_text || '', family_ids: c.family_ids || [], updated_at: new Date().toISOString() };
      TEXT_FIELDS.forEach(function(f){ body[f] = c[f] || ''; });
      must(await sb.from('customers').update(body).eq('id', id));
      dirty[id] = false;
      var p = pendGet(); delete p[id]; pendSet(p);
      setStatus('', '✓ 저장됨 · ' + fmtDateTime(new Date().toISOString()).slice(11));
      return true;
    }catch(e){
      console.error(e);
      setStatus('warn', '⚠ 저장 실패(' + errText(e) + ') · 이 기기에 임시 보관 중 · 「저장」 버튼으로 다시 시도하세요');
      return false;
    }finally{
      saving[id] = false;
    }
  }
  async function flushAll(){
    var ok = true;
    for(var k in dirty){ if(dirty[k]){ clearTimeout(saveTimers[k]); var r = await saveCustomer(k); if(!r) ok = false; } }
    return ok;
  }

  /* ---------------- 화면 전환 ---------------- */
  function route(){
    var m = /^#\/c\/([0-9a-fA-F-]{36})$/.exec(location.hash || '');
    if(m){ openDetail(m[1]); } else { showList(); }
  }
  async function showList(){
    curId = null;
    $('viewDetail').style.display = 'none';
    $('viewList').style.display = 'block';
    closePops();
    renderList();
    if(anyDirty()) flushAll().then(renderList);
  }

  /* ---------------- 목록 ---------------- */
  function sortValue(c, key){
    if(key === '__created') return c.created_at || '';
    if(key === '__name') return dispName(c).toLowerCase();
    if(key === '__contract') return isContracted(c) ? 1 : 0;
    if(key === '__ref') return refInfo(c).plain.toLowerCase();
    if(key === '__fam') return famList(c).map(dispName).join(' ').toLowerCase();
    var p = getProp(key); if(!p) return '';
    if(p.type === 'created_time') return c.created_at || '';
    var v = c.props[p.id];
    if(p.type === 'multi_select'){
      var first = (v && v.length) ? v[0] : null; var o = null;
      (p.options || []).forEach(function(x){ if(x.id === first) o = x; });
      return o ? o.name : '';
    }
    return (v || '').toString().toLowerCase();
  }
  function haystack(c){
    var ri = refInfo(c);
    var parts = [c.name, dispName(c), ri.plain, famList(c).map(dispName).join(' '), birthOf(c), c.personal_text, c.simple_text, c.standard_text, c.dental_text, c.major_text, c.bank_text];
    props.forEach(function(p){
      var v = c.props[p.id];
      if(p.type === 'text' && v) parts.push(v);
      if(p.type === 'multi_select' && v){ (p.options || []).forEach(function(o){ if(v.indexOf(o.id) >= 0) parts.push(o.name); }); }
      if(p.type === 'date' && v) parts.push(v);
    });
    return parts.join(' ').toLowerCase();
  }
  function chipEl(opt, idx){
    var col = COLORS[(opt.c != null ? opt.c : idx) % COLORS.length];
    return h('span', { class: 'chip', text: opt.name, style: 'background:' + col[0] + ';color:' + col[1] + ';' });
  }
  function optIndex(p, id){ var arr = p.options || []; for(var i = 0; i < arr.length; i++){ if(arr[i].id === id) return i; } return -1; }
  // 가족 칸: 3명쯤 들어갈 폭으로 고정. 더 많으면 잘라서 보여주고, 좌우로 드래그(폰은 밀어서)해 나머지를 본다
  function dragScroll(box){
    var moved = false, down = null;
    function more(){ box.classList.toggle('more', box.scrollWidth > box.clientWidth + 1 && box.scrollLeft + box.clientWidth < box.scrollWidth - 2); }
    box.addEventListener('scroll', more);
    box.addEventListener('pointerdown', function(e){
      if(e.pointerType !== 'mouse' || box.scrollWidth <= box.clientWidth) return;
      down = { x: e.clientX, l: box.scrollLeft }; moved = false;
      try{ box.setPointerCapture(e.pointerId); }catch(x){}
    });
    box.addEventListener('pointermove', function(e){
      if(!down) return;
      var dx = e.clientX - down.x;
      if(Math.abs(dx) > 4){ moved = true; box.classList.add('drag'); }
      if(moved) box.scrollLeft = down.l - dx;
    });
    function up(){ down = null; box.classList.remove('drag'); }
    box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
    box.addEventListener('click', function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    setTimeout(more, 0);
    return more;
  }
  function famCell(c){
    var td = h('td', { class: 'famtd' });
    var box = h('div', { class: 'fam-scroll', text: famText(c) });
    dragScroll(box);
    td.appendChild(box);
    return td;
  }
  var CT_NOT_COUNTED = ['청약철회', '반송'];
  function ctList(c){ var a = c && c.props && c.props.__contracts; return Array.isArray(a) ? a : []; }
  function isContracted(c){ return ctList(c).some(function(x){ return CT_NOT_COUNTED.indexOf(x.st) < 0; }); }
  function contractCell(c){
    var td = h('td', { class: 'ctd', title: isContracted(c) ? '기고객 (계약리스트 엑셀과 일치)' : '' });
    td.appendChild(h('span', { class: 'ct-box' + (isContracted(c) ? ' on' : '') }));
    return td;
  }
  function renderList(){
    var table = $('custTable');
    table.innerHTML = '';
    var thead = h('thead'), tr = h('tr');
    function th(label, key, extra, pid){
      var arrow = (sortKey === key) ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
      var el = h('th', { onclick: function(){ if(sortKey === key){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; } else { sortKey = key; sortDir = 'asc'; } renderList(); } });
      if(label) el.appendChild(document.createTextNode(label + arrow));
      else { el.appendChild(h('span', { class: 'ph', text: '제목없음' })); if(arrow) el.appendChild(document.createTextNode(arrow)); }
      if(pid) el.setAttribute('data-pid', pid);
      if(extra) el.appendChild(extra);
      tr.appendChild(el);
    }
    th('이름', '__name');
    th('기고객', '__contract');
    th('소개자', '__ref');
    var narrow = !!(window.matchMedia && window.matchMedia('(max-width:640px)').matches); // 폰: 가족·등록일 숨김
    if(!narrow){ th('가족', '__fam'); th('등록일', '__created'); }
    table.style.gridTemplateColumns = 'repeat(' + (3 + (narrow ? 0 : 2) + props.length) + ', auto)';
    props.forEach(function(p){
      var menu = h('span', { class: 'hm', text: '⋯', title: '항목 설정', onclick: function(e){ e.stopPropagation(); openPropMenu(p.id, e.currentTarget); } });
      th(p.name, p.id, menu, p.id);
    });
    thead.appendChild(tr); table.appendChild(thead);

    var q = search.trim().toLowerCase();
    var list = customers.filter(function(c){ return !q || haystack(c).indexOf(q) >= 0; });
    list.sort(function(a, b){
      var x = sortValue(a, sortKey), y = sortValue(b, sortKey);
      var r = x < y ? -1 : (x > y ? 1 : 0);
      if(!r && sortKey !== '__created'){ x = a.created_at || ''; y = b.created_at || ''; return x < y ? 1 : (x > y ? -1 : 0); }
      return sortDir === 'asc' ? r : -r;
    });
    var tbody = h('tbody');
    list.forEach(function(c){
      var row = h('tr', { class: 'row', onclick: function(){ location.hash = '#/c/' + c.id; } });
      row.appendChild(h('td', { class: 'name', text: nameWithTag(c) }));
      row.appendChild(contractCell(c));
      row.appendChild(h('td', { text: refInfo(c).text }));
      if(!narrow){
        row.appendChild(famCell(c));
        row.appendChild(h('td', { text: fmtDateOnly(c.created_at) }));
      }
      props.forEach(function(p){
        var td = h('td');
        var v = c.props[p.id];
        if(p.type === 'text'){ td.textContent = v || ''; }
        else if(p.type === 'date'){ td.textContent = v || ''; }
        else if(p.type === 'created_time'){ td.textContent = fmtDateTime(c.created_at); }
        else if(p.type === 'multi_select'){
          (v || []).forEach(function(id){ var i = optIndex(p, id); if(i >= 0) td.appendChild(chipEl(p.options[i], i)); });
        }
        row.appendChild(td);
      });
      Array.prototype.slice.call(row.children).forEach(function(td){
        if(td.classList.contains('ctd') || td.classList.contains('famtd')) return;
        var wrap = h('div', { class: 'cell-clip' });
        while(td.firstChild) wrap.appendChild(td.firstChild);
        td.appendChild(wrap);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    if(!list.length){
      var msg = customers.length ? '검색 결과가 없어요.' : '아직 고객이 없어요. 「+ 새로 만들기」를 눌러 첫 고객을 추가해 보세요.';
      var wrap = $('custTable').parentNode;
      var old = wrap.querySelector('.cu-empty'); if(old) old.remove();
      wrap.appendChild(h('div', { class: 'cu-empty', text: msg }));
    } else {
      var old2 = $('custTable').parentNode.querySelector('.cu-empty'); if(old2) old2.remove();
    }
  }

  /* ---------------- 항목(속성) 관리 ---------------- */
  async function createProp(name, type){
    var pos = props.length ? Math.max.apply(null, props.map(function(p){ return p.position || 0; })) + 1 : 0;
    try{
      var res = must(await sb.from('customer_props').insert({ user_id: uid, name: name || '', type: type, options: [], position: pos }).select().single());
      props.push(res.data);
      return res.data;
    }catch(e){ showToast('항목을 만들지 못했어요: ' + errText(e)); return null; }
  }
  async function savePropName(p, v){
    v = (v || '').trim();
    if(v === (p.name || '')) return;
    try{ must(await sb.from('customer_props').update({ name: v }).eq('id', p.id)); p.name = v; }
    catch(e){ showToast('이름을 바꾸지 못했어요: ' + errText(e)); }
  }
  // 목록 머리글에서 항목 제목을 바로 쓴다
  function editHeader(id){
    var th = document.querySelector('#custTable th[data-pid="' + id + '"]'), p = getProp(id);
    if(!th || !p) return;
    th.innerHTML = '';
    var inp = h('input', { type: 'text', class: 'th-input', placeholder: '제목없음', maxlength: '30' });
    inp.value = p.name || '';
    inp.addEventListener('click', function(e){ e.stopPropagation(); });
    var done = false;
    inp.addEventListener('blur', async function(){ if(done) return; done = true; await savePropName(p, inp.value); renderList(); });
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } else if(e.key === 'Escape'){ inp.value = p.name || ''; inp.blur(); } });
    th.appendChild(inp); inp.focus();
  }
  function renameProp(id){
    if(curId){ var el = document.querySelector('[data-propname="' + id + '"]'); if(el) el.focus(); }
    else editHeader(id);
  }
  async function deleteProp(id){
    var p = getProp(id); if(!p) return;
    if(!confirm('「' + (p.name || '제목없음') + '」 항목을 삭제할까요?')) return;
    try{ must(await sb.from('customer_props').update({ deleted_at: new Date().toISOString() }).eq('id', id)); props = props.filter(function(x){ return x.id !== id; }); refreshViews(); }
    catch(e){ showToast('삭제하지 못했어요: ' + errText(e)); }
  }
  function refreshViews(){ if(curId) renderProps(); renderList(); }

  /* ---- 팝업(⋯ 메뉴, 다중선택) ---- */
  function closePops(){ var a = document.querySelectorAll('.cu-pop'); for(var i = 0; i < a.length; i++) a[i].remove(); }
  function placePop(pop, anchor){
    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    var left = r.left + window.pageXOffset, top = r.bottom + window.pageYOffset + 4;
    var maxLeft = window.pageXOffset + document.documentElement.clientWidth - pop.offsetWidth - 8;
    pop.style.left = Math.max(8, Math.min(left, maxLeft)) + 'px';
    pop.style.top = top + 'px';
  }
  document.addEventListener('click', function(e){
    if(e.target.closest && (e.target.closest('.cu-pop') || e.target.closest('[data-popanchor]'))) return;
    closePops();
  });
  function openPropMenu(id, anchor){
    closePops();
    var p = getProp(id); if(!p) return;
    var pop = h('div', { class: 'cu-pop' }, [
      h('div', { class: 'mi', text: '이름 변경', onclick: function(){ closePops(); renameProp(id); } }),
      h('div', { class: 'mi', text: '항목 삭제', style: 'color:#c0392b;', onclick: function(){ closePops(); deleteProp(id); } })
    ]);
    anchor.setAttribute('data-popanchor', '1');

  }
  async function saveOptions(p){
    try{ must(await sb.from('customer_props').update({ options: p.options }).eq('id', p.id)); return true; }
    catch(e){ showToast('옵션을 저장하지 못했어요: ' + errText(e)); return false; }
  }
  function openMultiPicker(p, c, anchor, rerender){
    closePops();
    var pop = h('div', { class: 'cu-pop' });
    anchor.setAttribute('data-popanchor', '1');
    function draw(){
      pop.innerHTML = '';
      (p.options || []).forEach(function(o, i){
        var on = (c.props[p.id] || []).indexOf(o.id) >= 0;
        var row = h('div', { class: 'opt' }, [
          h('span', { text: on ? '☑' : '☐' }),
          chipEl(o, i),
          h('span', { class: 'x', text: '✕', title: '옵션 삭제', onclick: async function(e){
            e.stopPropagation();
            if(!confirm('옵션 「' + o.name + '」을(를) 삭제할까요?')) return;
            p.options = p.options.filter(function(x){ return x.id !== o.id; });
            customers.forEach(function(cc){ var a = cc.props[p.id]; if(a && a.indexOf(o.id) >= 0){ cc.props[p.id] = a.filter(function(x){ return x !== o.id; }); markDirty(cc); } });
            await saveOptions(p); draw(); rerender();
          } })
        ]);
        row.addEventListener('click', function(){
          var arr = (c.props[p.id] || []).slice();
          var ix = arr.indexOf(o.id);
          if(ix >= 0) arr.splice(ix, 1); else arr.push(o.id);
          c.props[p.id] = arr; markDirty(c); draw(); rerender();
        });
        pop.appendChild(row);
      });
      var inp = h('input', { type: 'text', placeholder: '새 옵션 입력 후 Enter', maxlength: '30' });
      inp.addEventListener('keydown', async function(e){
        if(e.key !== 'Enter') return;
        e.preventDefault();
        var name = inp.value.trim(); if(!name) return;
        var found = null; (p.options || []).forEach(function(o){ if(o.name === name) found = o; });
        if(!found){
          found = { id: uuid().slice(0, 8), name: name, c: (p.options || []).length % COLORS.length };
          p.options = (p.options || []).concat([found]);
          await saveOptions(p);
        }
        var arr = (c.props[p.id] || []).slice();
        if(arr.indexOf(found.id) < 0) arr.push(found.id);
        c.props[p.id] = arr; markDirty(c); draw(); rerender();
        var again = pop.querySelector('input'); if(again) again.focus();
      });
      pop.appendChild(inp);
    }
    draw();
    placePop(pop, anchor);
    var f = pop.querySelector('input'); if(f) f.focus();
  }

  /* ---------------- 상세 ---------------- */
  function renderProps(){

      } else if(p.type === 'created_time'){
        val.appendChild(h('div', { class: 'ro', text: fmtDateTime(c.created_at) }));
      } else if(p.type === 'multi_select'){
        var wrap = h('div', { class: 'ms-wrap' });

          wrap.innerHTML = '';
          (c.props[p.id] || []).forEach(function(id){
            var i = optIndex(p, id); if(i < 0) return;
            wrap.appendChild(h('span', { class: 'chip-x' }, [chipEl(p.options[i], i), h('b', { class: 'x', text: '×', title: '삭제', onclick: function(e){ e.stopPropagation(); c.props[p.id] = (c.props[p.id] || []).filter(function(x){ return x !== id; }); markDirty(c); draw(); } })]));
          });
          var btn = h('button', { type: 'button', class: 'cu-btn sm', text: '＋' });

  /* 소개자: 제목 오른쪽. 이름을 치면 내 고객 중에서 찾아 고르고, 개척·돌방·DB·병원근무는 눌러서 체크 */
  var QUICK = ['개척', '돌방', 'DB', '병원근무', '가족'];
  var refDone = false; // 소개자를 정한 직후엔 포커스를 두어, 탭 키가 바로 가족 칸으로 가게 한다
  function focusFam(){ var f = document.querySelector('#famBox input'); if(f) f.focus(); }
  function refKey(v){ return String(v || '').toLowerCase().replace(/\s+/g, ''); }
  function refTokens(q){
    return String(q || '').split(/[,，、\/·;]+/).map(function(x){ return refKey(x.replace(/^[\s★☆]+/, '').replace(/\s*(님|씨)\s*$/, '')); }).filter(Boolean);
  }
  function renderReferrer(){
    var c = getCust(curId), box = $('refBox'); if(!box) return;
    box.innerHTML = ''; if(!c) return;
    box.appendChild(h('div', { class: 'rel-lab', text: '소개자' }));
    var ri = refInfo(c);
    var main = h('div', { class: 'ref-main' });
    if(ri.text){
      main.appendChild(h('span', { class: 'chip', style: 'background:#e8f0fe;color:#1d4ed8;font-size:14px;padding:5px 12px;', text: ri.text }));
      if(ri.id) main.appendChild(h('button', { type: 'button', class: 'cu-btn sm', text: '열기', onclick: function(){ location.hash = '#/c/' + ri.id; } }));
      main.appendChild(h('button', { type: 'button', class: 'cu-btn sm', text: '✕', title: '지우기', onclick: function(){ c.referrer_id = null; c.referrer_text = ''; markDirty(c); renderReferrer(); } }));
    } else {
      var wrap = h('div', { style: 'position:relative;flex:1;min-width:0;' });
      var inp = h('input', { type: 'text', id: 'refInput', placeholder: '이름 검색', maxlength: '40', autocomplete: 'off', class: 'rel-in' });
      var pop = h('div', { class: 'ref-pop', style: 'display:none;' });
      var items = [], hi = -1, blurT = null;
      var choose = function(t){ c.referrer_id = t.id; c.referrer_text = dispName(t); markDirty(c); refDone = true; renderReferrer(); };
      var freeText = function(q){ c.referrer_id = null; c.referrer_text = q; markDirty(c); refDone = true; renderReferrer(); };
      var draw = function(){
        var q = inp.value.trim(), ql = q.toLowerCase();
        pop.innerHTML = ''; items = []; hi = -1;
        if(!q){ pop.style.display = 'none'; return; }
        // 「김순희님」「김 순희」「김순희님,박준신」처럼 써도 찾는다: 님·공백 무시, 쉼표 등으로 나누어 각각 검색
        var toks = refTokens(q), ms = [], seen = {};
        toks.forEach(function(tk){
          var part = customers.filter(function(t){ return t.id !== c.id && !seen[t.id] && refKey(dispName(t)).indexOf(tk) >= 0; });
          part.sort(function(a, b){ var x = refKey(dispName(a)).indexOf(tk) === 0 ? 0 : 1, y = refKey(dispName(b)).indexOf(tk) === 0 ? 0 : 1; return x - y; });
          part.slice(0, toks.length > 1 ? 4 : 8).forEach(function(t){ seen[t.id] = 1; ms.push(t); });
        });
        ms.slice(0, 10).forEach(function(t){
          items.push({ t: t });
          var row = h('div', { class: 'ref-opt', text: nameWithTag(t) });
          row.addEventListener('mousedown', function(e){ e.preventDefault(); });
          row.addEventListener('click', function(){ choose(t); });
          pop.appendChild(row);
        });
        items.push({ free: q });
        var fr = h('div', { class: 'ref-opt free', text: '「' + q + '」 그대로 적기' });
        fr.addEventListener('mousedown', function(e){ e.preventDefault(); });
        fr.addEventListener('click', function(){ freeText(q); });
        pop.appendChild(fr);
        pop.style.display = 'block';
      };
      inp.addEventListener('input', draw);
      inp.addEventListener('focus', function(){ clearTimeout(blurT); draw(); });
      inp.addEventListener('blur', function(){ blurT = setTimeout(function(){ pop.style.display = 'none'; }, 250); });
      var completeRef = function(){
        if(hi >= 0){ var it = items[hi]; if(it.t) choose(it.t); else freeText(it.free); return true; }
        var tk1 = refTokens(inp.value.trim()), q = tk1.length === 1 ? tk1[0] : inp.value.trim().toLowerCase();
        var exact = items.filter(function(x){ return x.t && refKey(dispName(x.t)) === q; });
        if(exact.length === 1){ choose(exact[0].t); return true; }
        if(!exact.length){ freeText(inp.value.trim()); return true; }
        return false;
      };
      inp.addEventListener('keydown', function(e){
        // 탭: 쓴 이름을 확정하고 곧바로 가족 칸으로
        if(e.key === 'Tab' && !e.shiftKey && inp.value.trim()){
          e.preventDefault();
          if(completeRef()) setTimeout(focusFam, 0); else focusFam();
          return;
        }
        if(pop.style.display === 'none') return;
        var rows = pop.querySelectorAll('.ref-opt');
        if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
          e.preventDefault();
          hi = e.key === 'ArrowDown' ? Math.min(items.length - 1, hi + 1) : Math.max(0, hi - 1);
          for(var i = 0; i < rows.length; i++) rows[i].classList.toggle('on', i === hi);
        } else if(e.key === 'Enter'){
          e.preventDefault(); completeRef();
        } else if(e.key === 'Escape'){ pop.style.display = 'none'; }
      });
      wrap.appendChild(inp); wrap.appendChild(pop); main.appendChild(wrap);
    }
    box.appendChild(main);
    var quick = h('div', { class: 'ref-quick' });
    QUICK.forEach(function(q){
      var on = !c.referrer_id && (c.referrer_text || '') === q;
      quick.appendChild(h('button', { type: 'button', class: on ? 'on' : '', text: (on ? '✓ ' : '') + q, onclick: function(){
        if(on){ c.referrer_id = null; c.referrer_text = ''; } else { c.referrer_id = null; c.referrer_text = q; }
        markDirty(c); refDone = true; renderReferrer();
      } }));
    });
    box.appendChild(quick);
    // 탭 키는 소개자 칸의 버튼들을 건너뛰고 가족 칸으로 간다
    var bs = box.querySelectorAll('button'); for(var bi = 0; bi < bs.length; bi++) bs[bi].setAttribute('tabindex', '-1');
    if(refDone){ refDone = false; main.setAttribute('tabindex', '-1'); main.style.outline = 'none'; try{ main.focus({ preventScroll: true }); }catch(e){} }

  /* 가족: 이름을 치면 내 고객 중에서 찾아 눌러서 추가 (여러 명). 추가한 사람은 아래에 버튼으로 보이고, 누르면 그 사람 페이지로 */
  function renderFamily(){
    var c = getCust(curId), box = $('famBox'); if(!box) return;

    box.appendChild(h('div', { class: 'rel-lab', text: '가족' }));

    var list = h('div', { class: 'fam-list' });
    var items = [], hi = -1, blurT = null;
    function drawChips(){
      list.innerHTML = '';
      famList(c).forEach(function(t){
        var chip = h('span', { class: 'fam-chip' });
        chip.appendChild(h('button', { type: 'button', class: 'fam-go', text: nameWithTag(t), title: '인적사항 열기', onclick: function(){ location.hash = '#/c/' + t.id; } }));

        } }));
        list.appendChild(chip);

    function add(t){
      var ids = (c.family_ids || []).slice();
      if(ids.indexOf(t.id) < 0) ids.push(t.id);
      c.family_ids = ids; markDirty(c);
      inp.value = ''; drawChips(); pop.style.display = 'none'; inp.focus();
    }
    function draw(){
      var q = inp.value.trim(), ql = q.toLowerCase();
      pop.innerHTML = ''; items = []; hi = -1;
      if(!q){ pop.style.display = 'none'; return; }
      var have = c.family_ids || [];
      var toks = refTokens(q), ms = [], seen = {};
      toks.forEach(function(tk){
        var part = customers.filter(function(t){ return t.id !== c.id && !seen[t.id] && have.indexOf(t.id) < 0 && refKey(dispName(t)).indexOf(tk) >= 0; });
        part.sort(function(a, b){ var x = refKey(dispName(a)).indexOf(tk) === 0 ? 0 : 1, y = refKey(dispName(b)).indexOf(tk) === 0 ? 0 : 1; return x - y; });
        part.slice(0, toks.length > 1 ? 4 : 8).forEach(function(t){ seen[t.id] = 1; ms.push(t); });
      });
      ms.slice(0, 10).forEach(function(t){
        items.push(t);
        var row = h('div', { class: 'ref-opt', text: nameWithTag(t) });
        row.addEventListener('mousedown', function(e){ e.preventDefault(); });

        pop.appendChild(row);
      });
      if(!ms.length) pop.appendChild(h('div', { class: 'ref-opt free', text: '일치하는 고객이 없어요' }));
      pop.style.display = 'block';

    inp.addEventListener('input', draw);
    inp.addEventListener('focus', function(){ clearTimeout(blurT); draw(); });
    inp.addEventListener('blur', function(){ blurT = setTimeout(function(){ pop.style.display = 'none'; }, 250); });
    inp.addEventListener('keydown', function(e){
      if(pop.style.display === 'none') return;
      var rows = pop.querySelectorAll('.ref-opt');
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        hi = e.key === 'ArrowDown' ? Math.min(items.length - 1, hi + 1) : Math.max(0, hi - 1);
        for(var i = 0; i < rows.length; i++) rows[i].classList.toggle('on', i === hi);
      } else if(e.key === 'Enter'){
        e.preventDefault();
        if(hi >= 0 && items[hi]) add(items[hi]);
        else if(items.length === 1) add(items[0]);
      } else if(e.key === 'Escape'){ pop.style.display = 'none'; }
    });
    wrap.appendChild(inp); wrap.appendChild(pop);
    box.appendChild(wrap); box.appendChild(list);
    drawChips();
  }
  /* 병력사항 4개 박스 접기/펴기 (▶ 접힘 · ▼ 펼침) — 고객을 열 때는 항상 접힌 상태 */
  var FOLD_IDS = ['simpleText', 'standardText', 'dentalText', 'majorText'];

  /* ---- 🔎보장분석표🔎 : 보장분석표 페이지에서 저장한 이미지 4장 ---- */

  // PDF 한 건을 "열기/저장" 버튼이 달린 한 줄로 그려서 컨테이너에 붙인다.
  // boldText가 있으면 굵은 글씨로(예: "서효찬님 기본"), 없으면 파일 이름을 굵게 쓴다.
  function renderPdfRow(container, pf, boldText){
    var pname = pf.name || '파일.pdf';
    var kb = pf.size ? (pf.size >= 1048576 ? (pf.size / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(pf.size / 1024)) + 'KB') : '';
    var bold = boldText || pname;

    var pdfUrl = async function(dl){
      var res = await sb.storage.from(BUCKET).createSignedUrl(pf.path, 300, dl ? { download: pname.replace(/[\\/:*?"<>|]/g, '_') } : undefined);
      if(res.error || !res.data || !res.data.signedUrl) throw (res.error || new Error('주소를 만들지 못했어요'));

    };

  // 큰 사진은 줄여서 올린다(저장 공간 절약). 사진이 아니거나 작은 파일은 그대로.
  function compressImage(file){
    return new Promise(function(resolve){
      if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1200 * 1024){ resolve(file); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var max = 2000, w = img.naturalWidth, hgt = img.naturalHeight, s = Math.min(1, max / Math.max(w, hgt));
          var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(hgt * s);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(function(b){ URL.revokeObjectURL(url); if(b && b.size < file.size){ b.name = file.name.replace(/\.\w+$/, '') + '.jpg'; resolve(b); } else resolve(file); }, 'image/jpeg', 0.85);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /* ---------------- 직업 자동완성 ----------------
     「직업 : 」 줄에서 글자를 치면 직업 목록(assets/jobs-data.js)에서 비슷한 것을 보여 준다.

  var JOBS = (window.WP_JOBS || []).map(function(r){ return { name: r[0], desc: r[1] || '', key: (r[0] + ' ' + (r[1] || '')).toLowerCase().replace(/\s+/g, ''), nkey: r[0].toLowerCase().replace(/\s+/g, '') }; });
  function jobSearch(q){
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    if(!toks.length) return [];
    var first = toks[0].replace(/\s+/g, '');
    var res = [];
    for(var i = 0; i < JOBS.length; i++){
      var j = JOBS[i], ok = true;
      for(var t = 0; t < toks.length; t++){ if(j.key.indexOf(toks[t]) < 0){ ok = false; break; } }
      if(!ok) continue;
      var score = j.nkey.indexOf(first) === 0 ? 0 : (j.nkey.indexOf(first) > 0 ? 1 : 2);
      res.push({ j: j, score: score, i: i });
    }
    res.sort(function(a, b){ return a.score - b.score || a.i - b.i; });
    return res.slice(0, 40).map(function(x){ return x.j; });
  }
  function markText(text, toks){
    var frag = document.createDocumentFragment();
    var low = text.toLowerCase(), marks = new Array(text.length + 1).fill(false);
    toks.forEach(function(t){ if(!t) return; var from = 0, k; while((k = low.indexOf(t, from)) >= 0){ for(var x = k; x < k + t.length; x++) marks[x] = true; from = k + t.length; } });
    var i = 0;
    while(i < text.length){
      var j = i; while(j < text.length && marks[j] === marks[i]) j++;
      var piece = text.slice(i, j);
      frag.appendChild(marks[i] ? h('mark', { text: piece }) : document.createTextNode(piece));
      i = j;
    }
    return frag;
  }

    var pre = '', post = rest;
    if(mR){ pre = rest.slice(0, mR.index).trim(); post = rest.slice(mR.index + mR[0].length).trim(); }
    else { var mP0 = rest.match(/0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}/); if(mP0){ pre = rest.slice(0, mP0.index).trim(); post = rest.slice(mP0.index).trim(); } else return [line]; }
    var pt = pre.split(/\s+/).filter(Boolean);
    if(pt.length) out.push(pt[0]);
    if(pt.length > 1) out.push(pt.slice(1).join(' '));
    if(mR) out.push(mR[0]);
    var mP = post.match(/^(0\d{1,2})[-\s]?(\d{3,4})[-\s]?(\d{4})/);
    if(mP){ out.push(mP[0]); post = post.slice(mP[0].length).trim(); }
    var mC = post.match(/^(SKT|SK텔레콤|KT|LGU\+?|LG유플러스|LG|엘지|알뜰폰?|[가-힣A-Za-z]*모바일)(?=\s|$)/i);
    if(mC){ out.push(mC[0]); post = post.slice(mC[0].length).trim(); }
    var mD = post.match(/\s+([OoXx○×ㅇ])\s*$/);
    var drive = '';
    if(mD){ drive = mD[1]; post = post.slice(0, mD.index).trim(); }
    if(post) out.push(post);
    if(drive) out.push(drive);
    return out;
  }
  // 「이름 : …」처럼 항목 이름이 있으면 그대로, 없으면(줄마다 이름·직업·주민번호·전화·통신사·주소·운전) 내용을 보고 분류
  function tiParse(text){
    var t = String(text || '').trim();
    if(!t) return null;
    var ps = parseCustomerText(t);
    if(ps.length && ps[0].fields && (ps[0].fields.name || ps[0].fields.rrn || ps[0].fields.phone)) return { f: ps[0].fields, extras: ps[0].extras || [] };
    var lines = t.replace(/\r\n?/g, '\n').split('\n').map(function(x){ return x.replace(/[​﻿]/g, '').trim(); }).filter(Boolean);
    if(!lines.length) return null;
    if(lines.length === 1) lines = tiSplitOne(lines[0]);
    var person = impRowPerson(lines);
    var f = person.f;
    return { f: { name: f.name || '', job: f.job || '', rrn: impFmtRrn(f.rrn || ''), phone: impFmtPhone(f.phone || ''), carrier: impCarrier(f.carrier), addr: f.addr || '', drive: f.drive || '' }, extras: person.extras.slice() };
  }
  function tiRender(){
    var box = $('tiPrev'); box.innerHTML = '';
    var r = tiParse($('tiText').value); tiFields = r;
    $('tiApply').disabled = true; $('tiMsg').textContent = '';
    if(!r) return;
    var n = 0;
    TI_KEYS.forEach(function(k){
      var v = r.f[k[0]] || '';
      box.appendChild(h('div', { class: 'k', text: k[1] }));
      box.appendChild(h('div', { class: 'v' + (v ? '' : ' none'), text: v || '(없음)' }));
      if(v) n++;
    });
    if(r.extras && r.extras.length) box.appendChild(h('div', { class: 'ti-extra', text: '인식하지 못한 줄: ' + r.extras.join(' / ') }));
    $('tiApply').disabled = !n;
  }
  function tiApply(){
    if(!tiFields) return;
    var c = getCust(curId); if(!c) return;
    var ta = $('personalText'), keep = ta.value;
    var set = 0;
    TI_KEYS.forEach(function(k){
      var v = tiFields.f[k[0]];
      if(v){ setPersonalLineQuiet(k[1], v); set++; }
    });
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    closeModal('tiModal'); $('tiText').value = ''; tiFields = null;
    showToast('인적사항 ' + set + '개 항목을 넣었어요');
  }
  // setPersonalLine과 같지만 토스트·이벤트 없이 글만 바꾼다 (여러 항목을 한 번에 넣을 때)
  function setPersonalLineQuiet(label, value){
    var ta = $('personalText');
    var lines = ta.value.split('\n'), done = false, re = new RegExp('^\\s*' + label + '\\s*[:：]');
    for(var i = 0; i < lines.length; i++){ if(re.test(lines[i])){ lines[i] = label + ' : ' + value; done = true; break; } }
    if(!done){ while(lines.length && lines[lines.length - 1].trim() === '') lines.pop(); lines.push(label + ' : ' + value); }
    ta.value = lines.join('\n');
  }
  function wireTextIn(){
    $('txtInBtn').addEventListener('click', function(){ $('tiText').value = ''; tiRender(); openModal('tiModal'); setTimeout(function(){ $('tiText').focus(); }, 50); });
    var t = null;
    $('tiText').addEventListener('input', function(){ clearTimeout(t); t = setTimeout(tiRender, 150); });
    $('tiText').addEventListener('paste', function(){ clearTimeout(t); t = setTimeout(tiRender, 30); });
    $('tiApply').addEventListener('click', tiApply);
  }
  function wireFinders(){
    $('jobFindBtn').addEventListener('click', function(){
      $('jobQuery').value = ''; renderJobResults(true);
      openModal('jobModal'); setTimeout(function(){ $('jobQuery').focus(); }, 50);
    });
    $('jobQuery').addEventListener('input', function(){ renderJobResults(); });
    wireJobPick();
    $('addrFindBtn').addEventListener('click', function(){ openModal('addrModal'); startAddrSearch(); });
    $('addrBack').addEventListener('click', startAddrSearch);
    function putAddr(){
      var d = $('addrDetailInput').value.trim();
      setPersonalLine('집주소', addrPicked + (d ? ' ' + d : ''));
      closeModal('addrModal');
    }
    $('addrOk').addEventListener('click', putAddr);
    $('addrDetailInput').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); putAddr(); } });
    var closers = document.querySelectorAll('[data-close]');
    for(var i = 0; i < closers.length; i++){ (function(b){ b.addEventListener('click', function(){ closeModal(b.getAttribute('data-close')); }); })(closers[i]); }
    ['jobModal', 'addrModal', 'impModal'].forEach(function(id){ $(id).addEventListener('click', function(e){ if(e.target === $(id)) closeModal(id); }); });
    ['jobModal', 'addrModal', 'impModal'].forEach(function(id){ $(id).addEventListener('wheel', function(e){ if(!e.target.closest || !e.target.closest('.md-body')) e.preventDefault(); }, { passive: false }); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeModal('jobModal'); closeModal('addrModal'); closeModal('impModal'); if($('lnModal').style.display === 'flex') closeModal('lnModal'); else { closeModal('tmModal'); closeModal('ctModal'); closeModal('tiModal'); } } });
  }

  /* ---------------- 이벤트 연결 ---------------- */
  function wire(){
    $('newBtn').addEventListener('click', createCustomer);
    wireFinders();
    wireImport();
    wireLineage();
    wireContracts();
    wireTextIn();
    try{
      var mq = window.matchMedia('(max-width:640px)');
      var onMq = function(){ if($('viewList').style.display !== 'none') renderList(); };
      if(mq.addEventListener) mq.addEventListener('change', onMq); else if(mq.addListener) mq.addListener(onMq);
    }catch(e){}
    wireFolds();
    $('backupBtn').addEventListener('click', function(){ doBackup('json'); });
    $('csvBtn').addEventListener('click', function(){ doBackup('csv'); });
    $('trashBtn').addEventListener('click', toggleTrash);
    window.addEventListener('beforeunload', function(e){ if(anyDirty()){ e.preventDefault(); e.returnValue = ''; return ''; } });
    showBackupInfo();
    $('searchInput').addEventListener('input', function(){ search = this.value; renderList(); });
    var addBtns = document.querySelectorAll('[data-addtype]');
    for(var ab = 0; ab < addBtns.length; ab++){
      (function(btn){
        btn.addEventListener('click', async function(){
          var np = await createProp('', btn.getAttribute('data-addtype'));
          if(!np) return;
          refreshViews();
          if(curId){ var el = document.querySelector('[data-propname="' + np.id + '"]'); if(el){ el.scrollIntoView({ block: 'center' }); el.focus(); } }
          else editHeader(np.id);
        });
      })(addBtns[ab]);
    }
    $('backBtn').addEventListener('click', function(){ location.hash = '#/'; });
    $('saveNowBtn').addEventListener('click', async function(){
      var btn = this; btn.disabled = true;
      var ok = await flushAll();
      btn.disabled = false;
      showToast(ok ? '저장되었습니다' : '저장에 실패했어요. 인터넷을 확인해 주세요');
    });
    $('delCustBtn').addEventListener('click', deleteCustomer);
    $('custName').addEventListener('input', function(){ var c = getCust(curId); if(!c) return; c.name = this.value; markDirty(c); });
    var boxTAs = document.querySelectorAll('textarea[data-field]');
    for(var i = 0; i < boxTAs.length; i++){
      (function(ta){
        ta.addEventListener('input', function(){
          var c = getCust(curId); if(!c) return;
          var f = ta.getAttribute('data-field');
          if(f === 'personal_text'){
            // 제목을 비워 뒀거나 인적사항 이름을 그대로 따라 쓰던 중이면, 인적사항의 이름 변화를 제목에 반영
            var prev = parsePersonalName(c.personal_text), next = parsePersonalName(ta.value);
            if(!(c.name || '').trim() || c.name === prev){ c.name = next; $('custName').value = next; }
            $('custName').placeholder = next || '이름';
          }
          c[f] = ta.value; autosize(ta); markDirty(c);
        });
      })(boxTAs[i]);
    }
    var copyBtns = document.querySelectorAll('[data-copy]');
    for(var j = 0; j < copyBtns.length; j++){
      (function(btn){
        btn.addEventListener('click', function(){
          var c = getCust(curId); if(!c) return;
          var k = btn.getAttribute('data-copy');
          var map = { personal: c.personal_text, bank: c.bank_text, simple: c.simple_text, standard: c.standard_text, dental: c.dental_text, major: c.major_text };
          var text;
          var keys = k.split('+');
          if(keys.length === 1) text = map[k];
          else text = keys.map(function(x, i){ var t = map[x] || ''; return i < keys.length - 1 ? t.replace(/\s+$/, '') : t; }).join('\n\n');
          copyText(text, btn.textContent.replace(/\s*복사$/, ''));
        });
      })(copyBtns[j]);
    }
    $('attachBtn').addEventListener('click', function(){ $('fileInput').click(); });
    $('cameraBtn').addEventListener('click', function(){ $('cameraInput').click(); });
    $('fileInput').addEventListener('change', function(){ addFiles(this.files); this.value = ''; });
    $('cameraInput').addEventListener('change', function(){ addFiles(this.files); this.value = ''; });
    $('sendBtn').addEventListener('click', sendNote);
    // Ctrl+V 로 복사한 이미지(스크린샷·캡처·웹 이미지)·파일 붙여넣기
    $('noteText').addEventListener('paste', function(e){
      var cd = e.clipboardData; if(!cd) return;
      var files = [];
      if(cd.files && cd.files.length){ for(var i = 0; i < cd.files.length; i++) files.push(cd.files[i]); }
      else if(cd.items){ for(var j = 0; j < cd.items.length; j++){ if(cd.items[j].kind === 'file'){ var f = cd.items[j].getAsFile(); if(f) files.push(f); } } }
      if(!files.length) return; // 글자만 붙여넣을 때는 평소처럼
      e.preventDefault();
      var d = new Date(), stamp2 = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
      var named = files.map(function(f, idx){
        if(f.name && !/^image\.(png|jpe?g|gif|webp)$/i.test(f.name)) return f;
        var ext = (/\/(png|jpe?g|gif|webp)/i.exec(f.type) || [])[1] || 'png';
        try{ return new File([f], '붙여넣기_' + stamp2 + (files.length > 1 ? '_' + (idx + 1) : '') + '.' + ext.replace('jpeg', 'jpg'), { type: f.type }); }catch(err){ return f; }
      });
      addFiles(named);
      showToast('이미지를 붙여넣었어요 · 「보내기」를 누르면 올라가요');
    });
    // 파일 끌어다 놓기 (비고 영역)
    var zone = $('noteSec'), dragDepth = 0;
    function hasFiles(ev){ var t = ev.dataTransfer && ev.dataTransfer.types; if(!t) return false; for(var i = 0; i < t.length; i++){ if(t[i] === 'Files') return true; } return false; }
    zone.addEventListener('dragenter', function(ev){ if(!hasFiles(ev)) return; ev.preventDefault(); dragDepth++; zone.classList.add('dragover'); });
    zone.addEventListener('dragover', function(ev){ if(!hasFiles(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
    zone.addEventListener('dragleave', function(ev){ if(!hasFiles(ev)) return; dragDepth = Math.max(0, dragDepth - 1); if(!dragDepth) zone.classList.remove('dragover'); });
    zone.addEventListener('drop', function(ev){
      if(!hasFiles(ev)) return;
      ev.preventDefault(); dragDepth = 0; zone.classList.remove('dragover');
      addFiles(ev.dataTransfer.files);
      if(pendingFiles.length) showToast('파일을 담았어요 · 「보내기」를 누르면 올라가요');
    });
    // 다른 곳에 잘못 놓아도 파일이 브라우저에서 열려 페이지가 바뀌지 않게 막는다
    window.addEventListener('dragover', function(ev){ if(hasFiles(ev)) ev.preventDefault(); });
    window.addEventListener('drop', function(ev){ if(hasFiles(ev)) ev.preventDefault(); });
    $('noteText').addEventListener('keydown', function(e){ if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); sendNote(); } });
    window.addEventListener('hashchange', route);
    window.addEventListener('online', function(){ if(anyDirty()) flushAll(); });
    document.addEventListener('visibilitychange', async function(){
      if(document.hidden || anyDirty() || curId) return;
      try{ await loadProps(); await loadCustomers(); renderList(); }catch(e){}
    });
    $('logoutLink').addEventListener('click', function(e){ e.preventDefault(); if(typeof logout === 'function') logout(); });
  }

  /* ---------------- 시작 ---------------- */
  async function start(){
    var session = await requireLogin(); // 로그인이 없으면 로그인 화면으로 이동한다
    if(!session) return;
    sb = supabaseClient; uid = session.user.id;
    wire();
    try{
      await loadProps(); await loadCustomers();
    }catch(e){
      console.error(e);
      var missing = /does not exist|schema cache|42P01|PGRST205/i.test((e && (e.code + ' ' + e.message)) || '');
      $('custTable').parentNode.appendChild(h('div', { class: 'cu-empty', text: missing ? '고객리스트 저장 공간이 아직 준비되지 않았어요. 관리자에게 문의해 주세요.' : '목록을 불러오지 못했어요: ' + errText(e) }));
    }
    // 저장하지 못하고 닫았던 수정 내용이 이 기기에 남아 있으면 이어서 저장한다
    var p = pendGet(), changed = false;
    Object.keys(p).forEach(function(id){
      var c = getCust(id);
      if(!c){ delete p[id]; changed = true; return; }
      var s = p[id]; c.name = s.name; c.props = s.props || {}; c.referrer_id = s.referrer_id || null; c.referrer_text = s.referrer_text || ''; c.family_ids = s.family_ids || c.family_ids || [];
      TEXT_FIELDS.forEach(function(f){ if(typeof s[f] === 'string') c[f] = s[f]; });
      dirty[id] = true;
    });
    if(changed) pendSet(p);
    route();
    if(anyDirty()) flushAll();
  }
  start();
})();
</script>
