<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partners</span></a>
<nav><a href="admin.html" id="adminLink" style="display:none">관리자</a><a href="admin-limits.html" id="adminLimitsLink" style="display:none">당타사한도</a><a href="profile.html">프로필</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap">
<h1>안녕하세요<span id="userEmail"></span> 👋</h1>
<p class="sub">이용하실 기능을 선택해주세요</p>
<p class="sub" id="pointsLine" style="display:none"></p>
<div class="card-grid">
<a href="history.html" class="feature-card" id="historyCard">
<div class="icon">📋</div>
<h3>병력정리</h3>
<p>기본진료정보와 세부진료정보를 업로드해 자동으로 병력을 정리하고 고지사항 텍스트를 생성합니다.</p>
<span class="badge-soon" id="historyBadge" style="display:none">승인 대기중</span>
</a>
<a href="coverage.html" class="feature-card">
<div class="icon">📊</div>
<h3>보장분석표</h3>
<p>가입된 보장 내역을 업로드해 보장분석표(전)/(후)를 자동으로 만들고, 종합비교·보장차이까지 한 번에 확인합니다.</p>
<span class="badge-soon" id="coverageBadge" style="display:none">1회 3,000P</span>
</a>
</div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
(async ()=>{
  const session = await requireLogin();
  if(session){
    document.getElementById('userEmail').textContent = ', ' + session.user.email;
    const profile = await getMyProfile();
    if(profile){
      document.getElementById('userEmail').textContent = ', ' + (profile.nickname || session.user.email);
      if(profile.role === 'admin'){
        document.getElementById('adminLink').style.display = 'inline';
        document.getElementById('adminLimitsLink').style.display = 'inline';
      }
      if(profile.role === 'admin' || profile.role === 'gold'){
        // 관리자/골드 회원: 무제한 무료 이용
      } else {
        // 기능별 차감 포인트는 관리자가 admin.html에서 수정할 수 있으므로,
        // 화면에 고정된 숫자를 쓰지 않고 매번 최신 설정값을 읽어와 표시한다.
        const costs = await getPointCosts();

        const pointsLine = document.getElementById('pointsLine');
        pointsLine.textContent = '보유 포인트: ' + (profile.points || 0) + 'P';
        pointsLine.style.display = 'block';

        const coverageBadge = document.getElementById('coverageBadge');
        coverageBadge.textContent = '1회 ' + costs.coverage.toLocaleString() + 'P';
        coverageBadge.style.display = 'inline-block';

        const card = document.getElementById('historyCard');
        const badge = document.getElementById('historyBadge');
        card.removeAttribute('href');

        if(profile.approval_status !== 'approved'){
          badge.textContent = '승인 대기중';
          badge.style.display = 'inline-block';
          card.style.opacity = '0.5';
          card.addEventListener('click', function(e){
            e.preventDefault();
            alert('관리자 승인 후 이용할 수 있습니다.');
          });
        } else {
                  badge.textContent = '1회 ' + costs.history.toLocaleString() + 'P';
                  badge.style.display = 'inline-block';
                  card.addEventListener('click', function(e){
                              e.preventDefault();
                              if((profile.points || 0) < costs.history){
                                            alert('포인트가 부족합니다. (병력정리 이용에 ' + costs.history.toLocaleString() + 'P가 필요합니다. 보유 포인트: ' + (profile.points || 0) + 'P)\n관리자에게 포인트 충전을 요청해주세요.');
                                            return;
                              }
                              // 포인트 차감은 병력정리 페이지에서 매칭을 실제로 실행해 성공했을 때 이루어집니다.
                              window.location.href = 'history.html';
                  });
        }
    }
  }
  }
})();

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
