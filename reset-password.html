<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
  <a href="index.html" class="brand">With <span>Partners</span></a>
  <nav><a href="login.html">로그인</a></nav>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>비밀번호 찾기</h1>
    <p class="sub">가입하신 이메일로 재설정 링크를 보내드립니다</p>
    <form id="resetForm">
      <div class="field">
        <label>이메일</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">재설정 링크 받기</button>
    </form>
    <div class="links-row">
      <a href="login.html">로그인으로 돌아가기</a>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  const email = document.getElementById('email').value.trim();
  btn.disabled = true; btn.textContent='전송 중...';
  const redirectTo = window.location.origin + window.location.pathname.replace('reset-password.html','update-password.html');
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
  btn.disabled = false; btn.textContent='재설정 링크 받기';
  if(error){
    msg.className='msg err show';
    msg.textContent = error.message;
    return;
  }
  msg.className='msg ok show';
  msg.textContent = '이메일로 재설정 링크를 보냈습니다. 메일함을 확인해주세요.';
});
</script>
</body>
</html>
