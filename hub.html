<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서비스 선택 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.hub-card{cursor:pointer;text-align:center;}
.hub-card .icon{font-size:40px;margin-bottom:16px;}
.hub-card h3{font-size:19px;}
.hub-card p{font-size:14px;}
</style>
</head>
<body>
<div class="navbar">
<a href="hub.html" class="brand">With <span>Partners</span></a>
<nav><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap">
<h1>안녕하세요<span id="userEmail"></span> 👋</h1>
<p class="sub">이용하실 서비스를 선택해주세요</p>
<div class="card-grid">
<a href="dashboard.html" class="feature-card hub-card">
<div class="icon">📋</div>
<h3>병력정리 / 보장분석</h3>
<p>병력정리, 보장분석표 등 기존 With Partners 서비스를 이용합니다.</p>
</a>
<a href="attendance.html" class="feature-card hub-card">
<div class="icon">🗓️</div>
<h3>출근보고 / 근태</h3>
<p>출근 체크, 출근보고, 벌금 관리 등 근태 서비스를 이용합니다.</p>
</a>
</div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
(async function(){
  const session = await requireLogin();
  if(!session) return;
  document.getElementById('userEmail').textContent = ', ' + session.user.email;
})();
document.getElementById('logoutLink').addEventListener('click', function(e){
  e.preventDefault();
  logout();
});
</script>
</body>
</html>
