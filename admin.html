<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partners</span></a>
<nav><a href="admin-limits.html">당타사한도</a><a href="profile.html">프로필</a><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap">
<h1>회원 관리</h1>
<p class="sub">회원을 승인/거절하고 등급과 포인트를 변경할 수 있습니다.</p>
<table class="admin-table" id="memberTable">
<thead>
<tr>
<th>별명</th>
<th>이메일</th>
<th>등급</th>
<th>포인트</th>
<th>승인 상태</th>
<th>가입일</th>
<th>작업</th>
</tr>
</thead>
<tbody id="memberRows">
<tr><td colspan="7">불러오는 중...</td></tr>
</tbody>
</table>
</div>

<div id="profileModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="profileModalTitle">회원 정보</h2>
      <button type="button" class="modal-close" id="profileModalClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="profileModalBody"></div>
  </div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
(async ()=>{
  const profile = await requireAdmin();
  if(!profile) return;
  await loadMembers();
})();

async function loadMembers(){
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, email, role, approval_status, points, created_at, nickname")
    .order("created_at", { ascending: false });
  const tbody = document.getElementById("memberRows");
  if(error){
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 7;
    td.textContent = "불러오기 실패: " + error.message;
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  if(!data || data.length === 0){
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 7;
    td.textContent = "회원이 없습니다.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  tbody.innerHTML = "";
  data.forEach(function(m){
    const tr = document.createElement("tr");

    const tdNickname = document.createElement("td");
    const nicknameLink = document.createElement("a");
    nicknameLink.href = "#";
    nicknameLink.className = "member-name-link";
    nicknameLink.textContent = m.nickname || "(별명 없음)";
    nicknameLink.addEventListener("click", function(e){
      e.preventDefault();
      openProfileModal(m);
    });
    tdNickname.appendChild(nicknameLink);
    tr.appendChild(tdNickname);

    const tdEmail = document.createElement("td");
    tdEmail.textContent = m.email || "-";
    tr.appendChild(tdEmail);

    const tdRole = document.createElement("td");
    const roleSelect = document.createElement("select");
    var roleLabels = { admin: "관리자", silver: "실버", gold: "골드" };
    ["admin","silver","gold"].forEach(function(r){
      const opt = document.createElement("option");
      opt.value = r;
      opt.textContent = roleLabels[r];
      if(r === m.role) opt.selected = true;
      roleSelect.appendChild(opt);
    });
    roleSelect.addEventListener("change", async function(){
      await updateMember(m.id, { role: roleSelect.value });
    });
    tdRole.appendChild(roleSelect);
    tr.appendChild(tdRole);

    const tdPoints = document.createElement("td");
    const pointsInput = document.createElement("input");
    pointsInput.type = "number";
    pointsInput.min = "0";
    pointsInput.step = "100";
    pointsInput.value = m.points || 0;
    pointsInput.style.width = "80px";
    const pointsBtn = document.createElement("button");
    pointsBtn.className = "btn-ghost";
    pointsBtn.style.marginLeft = "6px";
    pointsBtn.textContent = "저장";
    pointsBtn.addEventListener("click", async function(){
      const val = parseInt(pointsInput.value, 10);
      if(isNaN(val) || val < 0){
        alert("올바른 포인트 값을 입력해주세요.");
        return;
      }
      await updateMember(m.id, { points: val });
    });
    tdPoints.appendChild(pointsInput);
    tdPoints.appendChild(pointsBtn);
    tr.appendChild(tdPoints);

    const tdStatus = document.createElement("td");
    const statusBadge = document.createElement("span");
    var statusLabels = { approved: "승인됨", pending: "대기중", rejected: "거절됨" };
    statusBadge.className = "status-badge status-" + m.approval_status;
    statusBadge.textContent = statusLabels[m.approval_status] || m.approval_status;
    tdStatus.appendChild(statusBadge);
    tr.appendChild(tdStatus);

    const tdDate = document.createElement("td");
    tdDate.textContent = m.created_at ? new Date(m.created_at).toLocaleDateString("ko-KR") : "-";
    tr.appendChild(tdDate);

    const tdAction = document.createElement("td");
    const approveBtn = document.createElement("button");
    approveBtn.className = "btn-ghost";
    approveBtn.textContent = "승인";
    approveBtn.addEventListener("click", async function(){
      await updateMember(m.id, { approval_status: "approved" });
    });
    const rejectBtn = document.createElement("button");
    rejectBtn.className = "btn-ghost";
    rejectBtn.textContent = "거절";
    rejectBtn.style.marginLeft = "6px";
    rejectBtn.addEventListener("click", async function(){
      await updateMember(m.id, { approval_status: "rejected" });
    });
    tdAction.appendChild(approveBtn);
    tdAction.appendChild(rejectBtn);
    tr.appendChild(tdAction);

    tbody.appendChild(tr);
  });
}

async function updateMember(id, changes){
  const { error } = await supabaseClient
    .from("profiles")
    .update(changes)
    .eq("id", id);
  if(error){
    alert("업데이트 실패: " + error.message);
    return;
  }
  await loadMembers();
}

// 회원의 별명(이름)을 클릭하면 상세 정보를 모달로 보여준다.
// 지금은 기본 항목만 표시하지만, 나중에 프로필에 항목이 늘어나면
// 이 함수 안의 rows 배열에 [라벨, 값] 쌍만 추가하면 된다.
var statusLabelsForModal = { approved: "승인됨", pending: "대기중", rejected: "거절됨" };
var roleLabelsForModal = { admin: "관리자", silver: "실버", gold: "골드" };
function openProfileModal(m){
  document.getElementById("profileModalTitle").textContent = m.nickname || "(별명 없음)";
  const rows = [
    ["별명", m.nickname || "(별명 없음)"],
    ["이메일", m.email || "-"],
    ["등급", roleLabelsForModal[m.role] || m.role || "-"],
    ["포인트", (m.points || 0).toLocaleString() + "P"],
    ["승인 상태", statusLabelsForModal[m.approval_status] || m.approval_status || "-"],
    ["가입일", m.created_at ? new Date(m.created_at).toLocaleDateString("ko-KR") : "-"],
  ];
  const body = document.getElementById("profileModalBody");
  body.innerHTML = "";
  rows.forEach(function(pair){
    const row = document.createElement("div");
    row.className = "modal-info-row";
    const label = document.createElement("div");
    label.className = "modal-info-label";
    label.textContent = pair[0];
    const value = document.createElement("div");
    value.className = "modal-info-value";
    value.textContent = pair[1];
    row.appendChild(label);
    row.appendChild(value);
    body.appendChild(row);
  });
  document.getElementById("profileModalOverlay").style.display = "flex";
}
function closeProfileModal(){
  document.getElementById("profileModalOverlay").style.display = "none";
}
document.getElementById("profileModalClose").addEventListener("click", closeProfileModal);
document.getElementById("profileModalOverlay").addEventListener("click", function(e){
  if(e.target === this) closeProfileModal();
});

document.getElementById("logoutLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
