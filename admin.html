<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 | 파트너와 함께</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
  <a href="dashboard.html" class="brand">파트너와 <span>함께</span></a>
  <nav><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="dash-wrap">
  <h1>회원 관리</h1>
  <p class="sub">회원을 승인/거절하고 등급을 변경할 수 있습니다.</p>
  <table class="admin-table" id="memberTable">
    <thead>
      <tr>
        <th>이메일</th>
        <th>등급</th>
        <th>승인 상태</th>
        <th>가입일</th>
        <th>작업</th>
      </tr>
    </thead>
    <tbody id="memberRows">
      <tr><td colspan="5">불러오는 중...</td></tr>
    </tbody>
  </table>
</div>
<script src="assets/supabase-client.js"></script>
<script>
(async ()=>{
  const profile = await requireAdmin();
  if(!profile) return;
  await loadMembers();
})();

async function loadMembers(){
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, email, role, approval_status, created_at")
    .order("created_at", { ascending: false });
  const tbody = document.getElementById("memberRows");
  if(error){
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.textContent = "불러오기 실패: " + error.message;
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  if(!data || data.length === 0){
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.textContent = "회원이 없습니다.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  tbody.innerHTML = "";
  data.forEach(function(m){
    const tr = document.createElement("tr");

    const tdEmail = document.createElement("td");
    tdEmail.textContent = m.email || "-";
    tr.appendChild(tdEmail);

    const tdRole = document.createElement("td");
    const roleSelect = document.createElement("select");
    var roleLabels = { admin: "관리자", silver: "실버", gold: "골드" };
    ["admin","silver","gold"].forEach(function(r){
      const opt = document.createElement("option");
      opt.value = r;
      opt.textContent = roleLabels[r];
      if(r === m.role) opt.selected = true;
      roleSelect.appendChild(opt);
    });
    roleSelect.addEventListener("change", async function(){
      await updateMember(m.id, { role: roleSelect.value });
    });
    tdRole.appendChild(roleSelect);
    tr.appendChild(tdRole);

    const tdStatus = document.createElement("td");
    const statusBadge = document.createElement("span");
    var statusLabels = { approved: "승인됨", pending: "대기중", rejected: "거절됨" };
    statusBadge.className = "status-badge status-" + m.approval_status;
    statusBadge.textContent = statusLabels[m.approval_status] || m.approval_status;
    tdStatus.appendChild(statusBadge);
    tr.appendChild(tdStatus);

    const tdDate = document.createElement("td");
    tdDate.textContent = m.created_at ? new Date(m.created_at).toLocaleDateString("ko-KR") : "-";
    tr.appendChild(tdDate);

    const tdAction = document.createElement("td");
    const approveBtn = document.createElement("button");
    approveBtn.className = "btn-ghost";
    approveBtn.textContent = "승인";
    approveBtn.addEventListener("click", async function(){
      await updateMember(m.id, { approval_status: "approved" });
    });
    const rejectBtn = document.createElement("button");
    rejectBtn.className = "btn-ghost";
    rejectBtn.textContent = "거절";
    rejectBtn.style.marginLeft = "6px";
    rejectBtn.addEventListener("click", async function(){
      await updateMember(m.id, { approval_status: "rejected" });
    });
    tdAction.appendChild(approveBtn);
    tdAction.appendChild(rejectBtn);
    tr.appendChild(tdAction);

    tbody.appendChild(tr);
  });
}

async function updateMember(id, changes){
  const { error } = await supabaseClient
    .from("profiles")
    .update(changes)
    .eq("id", id);
  if(error){
    alert("업데이트 실패: " + error.message);
    return;
  }
  await loadMembers();
}

document.getElementById("logoutLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
