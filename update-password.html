<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 | 파트너와 함께</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
  <a href="index.html" class="brand">파트너와 <span>함께</span></a>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>새 비밀번호 설정</h1>
    <p class="sub">새로 사용할 비밀번호를 입력해주세요</p>
    <form id="updateForm">
      <div class="field">
        <label>새 비밀번호</label>
        <input type="password" id="password" required minlength="6" placeholder="6자 이상">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">비밀번호 변경</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
document.getElementById('updateForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  const password = document.getElementById('password').value;
  btn.disabled = true; btn.textContent='변경 중...';
  const { error } = await supabaseClient.auth.updateUser({ password });
  btn.disabled = false; btn.textContent='비밀번호 변경';
  if(error){
    msg.className='msg err show';
    msg.textContent = error.message;
    return;
  }
  msg.className='msg ok show';
  msg.textContent = '비밀번호가 변경되었습니다. 잠시 후 로그인 페이지로 이동합니다.';
  setTimeout(()=>{ window.location.href='login.html'; }, 1800);
});
</script>
</body>
</html>
