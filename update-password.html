<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
  <a href="index.html" class="brand">With <span>Partners</span></a>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>비밀번호 초기화</h1>
    <p class="sub">이메일 인증이 확인되면 비밀번호가 초기비밀번호(0506)로 자동 재설정됩니다.</p>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="assets/supabase-client.js"></script>
<script>
const msg = document.getElementById('msg');
msg.className='msg show'; msg.textContent='초기화 중...';

async function applyDefaultPassword(){
  const { error } = await supabaseClient.auth.updateUser({ password: '0506' });
  if(error){
    msg.className='msg err show';
    msg.textContent = error.message;
    return;
  }
  msg.className='msg ok show';
  msg.textContent = '비밀번호가 초기비밀번호(0506)로 재설정되었습니다. 잠시 후 로그인 페이지로 이동합니다.';
  setTimeout(()=>{ window.location.href='login.html'; }, 2200);
}

let handled = false;
supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY' && !handled){
    handled = true;
    applyDefaultPassword();
  }
});

// onAuthStateChange의 PASSWORD_RECOVERY 이벤트가 늦게 오거나 발생하지 않는 환경을 대비한 보조 처리
setTimeout(async ()=>{
  if(handled) return;
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){
    handled = true;
    applyDefaultPassword();
  } else {
    msg.className='msg err show';
    msg.textContent = '인증 정보가 확인되지 않습니다. 비밀번호 찾기를 다시 시도해주세요.';
  }
}, 1500);
</script>
</body>
</html>
