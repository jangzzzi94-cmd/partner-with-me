<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 | With Partners</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  .sch-wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px;}
  .sch-wrap h1{font-size:24px;color:var(--navy-950);margin:0;}
  .sch-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 14px;}
  .sch-nav{display:flex;align-items:center;gap:10px;}
  .sch-nav button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px;color:var(--navy-900);}
  .sch-nav button:hover{border-color:var(--navy-600);}
  #monthLabel{font-weight:700;font-size:16px;color:var(--navy-950);min-width:108px;text-align:center;}

  /* 맨 위 일정 켜기/끄기 - 파란색이면 켜진 것 */
  .sch-cals{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  #calChips{display:contents;}
  .sch-tab{padding:8px 15px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--muted);font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .sch-tab:hover{border-color:#2b6fd6;}
  .sch-tab.on{background:#2b6fd6;color:#fff;border-color:#2b6fd6;}
  .sch-tab .cal-edit{font-size:12px;opacity:.7;padding:0 2px;}
  .sch-tab .cal-edit:hover{opacity:1;}
  .sch-tab.add{border-style:dashed;font-weight:600;}
  .sch-mem-wrap{position:relative;}
  .sch-mem-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,37,69,.18);width:240px;max-width:calc(100vw - 20px);max-height:340px;overflow-y:auto;padding:8px;}
  .sch-mem-pop.open{display:block;}
  .sch-mem-acts{display:flex;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;}
  .sch-mem-acts button{background:none;border:none;color:var(--navy-600);cursor:pointer;font-size:12px;padding:0;font-family:inherit;}
  .sch-mem-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13.5px;}
  .sch-mem-row:hover{background:var(--navy-100);}
  .sch-mem-row input{margin:0;width:16px;height:16px;}
  .sch-mem-row .gr{margin-left:2px;font-size:11px;font-weight:700;color:var(--navy-700);background:var(--navy-100);border-radius:6px;padding:1px 6px;}

  .sch-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;font-size:12px;color:var(--muted);align-items:center;}
  .sch-legend .sw{display:inline-flex;align-items:center;gap:5px;}
  .sch-legend .sw i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.08);}
  .sch-grid-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
  .cap-title{display:none;font-size:18px;font-weight:800;color:var(--navy-950);margin:0 0 10px;}
  .sch-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12.5px;font-weight:700;color:var(--navy-800);padding-bottom:8px;}
  .sch-weekdays .sat{color:#2b6fd6;}
  .sch-weekdays .sun{color:var(--danger);}
  .sch-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .sch-day{min-height:112px;border:1px solid var(--line);border-radius:10px;padding:6px;position:relative;background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s;}
  .sch-day:hover{border-color:var(--navy-600);}
  .sch-day.other-month{opacity:.38;}
  .sch-day.is-today{border-color:var(--navy-600);box-shadow:0 0 0 1px var(--navy-600) inset;}
  .sch-day .d-num{font-size:12.5px;font-weight:700;color:var(--navy-900);padding-right:18px;}
  .sch-day .d-num.sat{color:#2b6fd6;}
  .sch-day .d-num.sun,.sch-day .d-num.holiday{color:var(--danger);}
  .sch-day .d-hol{font-size:9px;color:var(--danger);margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 일정이 많거나 제목이 길어도 자르지 않고 아래로 계속 나열 - 칸이 커지면 같은 주(가로줄)의
     칸들도 grid가 자동으로 같은 높이로 맞춘다 */
  .sch-day .d-items{flex:1;display:flex;flex-direction:column;gap:3px;margin-top:4px;}
  .sch-chip{font-size:10.5px;padding:2px 5px;border-radius:5px;white-space:normal;overflow-wrap:anywhere;word-break:keep-all;cursor:pointer;line-height:1.45;color:var(--ink);}
  .sch-incheon-toggle{position:absolute;top:5px;right:5px;width:15px;height:15px;cursor:pointer;margin:0;}
  /* PC: 일정에 마우스를 올리면 진해지고 오른쪽 위에 작은 × (바로 삭제) */
  .sch-chip{position:relative;transition:filter .12s, box-shadow .12s;}
  .sch-chip .chip-x{display:none;position:absolute;top:-6px;right:-6px;width:17px;height:17px;border:none;border-radius:50%;background:rgba(10,26,48,.78);color:#fff;font-size:11px;line-height:17px;padding:0;cursor:pointer;z-index:3;font-family:inherit;}
  .sch-chip .chip-x:hover{background:var(--danger);}
  @media (hover:hover){
    .sch-chip:hover{filter:brightness(.86) saturate(1.35);box-shadow:0 0 0 1.5px rgba(15,37,69,.45);}
    .sch-chip.can-edit:hover .chip-x{display:block;}
  }
  @media (hover:none){ .sch-incheon-toggle{display:none;} }  /* 휴대폰/앱: 인천출근 체크박스는 PC에서만 */
  .sch-chip.dragging{opacity:.4;}
  .sch-day.drop-target{outline:2px dashed #2b6fd6;outline-offset:-3px;background:#eef4ff;}
  .ev-date-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:600;color:var(--navy-900);}
  .ev-date-row input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);}
  .ev-date-row small{font-weight:400;color:var(--muted);font-size:11.5px;}

  /* 일정 화면 - 저장은 오른쪽 위, 아래는 대화창 */
  .mh-acts{display:flex;align-items:center;gap:10px;}
  .btn-save-top{background:var(--navy-900);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-save-top:hover{background:var(--navy-800);}
  .btn-save-top:disabled{background:#a9b6c6;cursor:default;}
  .ev-title{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-weight:600;font-family:inherit;}
  .ev-title:focus{outline:none;border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(43,81,144,.12);}
  .ev-sec{margin-top:14px;}
  .ev-sec-t{font-size:13px;font-weight:600;color:var(--navy-900);margin-bottom:7px;}
  .kind-row{display:flex;align-items:flex-start;gap:8px;}
  .kind-btns{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .kind-btn{border:2px solid transparent;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;font-family:inherit;line-height:1.3;}
  .kind-btn.sel{border-color:var(--navy-900);}
  .kind-btn.sel::before{content:'✓ ';}
  .kind-btn .x{margin-left:6px;opacity:.45;font-weight:400;}
  .kind-btn .x:hover{opacity:1;}
  .kind-btn:disabled{cursor:default;}
  .kind-add{flex:none;border:1px dashed #b7c2d1;background:#fff;color:var(--muted);border-radius:8px;padding:5px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .kind-add:hover{border-color:var(--navy-600);color:var(--navy-800);}
  .kind-form{display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);gap:6px;align-items:center;flex-wrap:wrap;}
  .kind-form.open{display:flex;}
  .kind-form input[type=text]{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;}
  .kind-form input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;}
  .tgt-btn{background:#eef2f8;}
  .ev-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:12px;}
  .link-del{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;padding:0;font-family:inherit;}

  .chat-box{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  /* 대화가 짧으면 있는 만큼 다 보이고, 길어지면 화면 높이까지만 늘어나고 그 안에서 스크롤 */
  .chat-list{min-height:150px;max-height:max(260px, calc(94vh - 360px));overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:#f3f6fb;}
  .chat-empty{margin:auto;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.7;}
  .cmsg{max-width:80%;align-self:flex-start;display:flex;flex-direction:column;flex:none;}
  .cmsg.me{align-self:flex-end;align-items:flex-end;}
  .cmsg .who{font-size:11px;color:var(--muted);margin:0 2px 2px;}
  .cmsg .bwrap{position:relative;max-width:100%;}
  .cmsg .bub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:var(--ink);}
  .cmsg.me .bub{background:#2b6fd6;color:#fff;border-color:#2b6fd6;}
  .cmsg .bub.media{padding:3px;background:#fff;border-color:var(--line);}
  .cmsg .bub img{display:block;max-width:280px;max-height:280px;border-radius:9px;cursor:zoom-in;}
  .cmsg .cdel{display:none;position:absolute;top:-7px;right:-7px;width:19px;height:19px;border:none;border-radius:50%;background:rgba(10,26,48,.72);color:#fff;font-size:12px;line-height:19px;padding:0;cursor:pointer;z-index:2;}
  .cmsg .cdel:hover{background:var(--danger);}
  .cmsg:hover .cdel{display:block;}
  @media (hover:none){ .cmsg .cdel{display:block;opacity:.75;} }
  .cmsg .bub a.file{display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--navy-800);text-decoration:none;font-weight:600;}
  .cmsg .bub a.file small{color:var(--muted);font-weight:400;}
  .cmsg .t{font-size:10.5px;color:var(--muted);margin:2px 2px 0;}
  .cmsg.pending{opacity:.6;}
  .chat-pend{display:none;gap:6px;flex-wrap:wrap;padding:8px 10px 0;border-top:1px solid var(--line);background:#fff;}
  .chat-pend.has{display:flex;}
  .pend-item{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);font-size:11px;}
  .pend-item img{display:block;width:56px;height:56px;object-fit:cover;}
  .pend-item .fn{display:flex;align-items:center;justify-content:center;width:56px;height:56px;padding:4px;text-align:center;word-break:break-all;line-height:1.2;}
  .pend-item .rm{position:absolute;top:1px;right:1px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(10,26,48,.7);color:#fff;font-size:11px;cursor:pointer;line-height:18px;padding:0;}
  .chat-input{display:flex;align-items:flex-end;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--line);}
  .chat-input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;font-family:inherit;line-height:1.45;max-height:110px;min-height:38px;}
  .chat-input textarea:focus{outline:none;border-color:var(--navy-600);}
  .chat-ic{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:16px;}
  .chat-ic:hover{border-color:var(--navy-600);}
  .chat-send{flex:none;height:38px;padding:0 14px;border:none;border-radius:9px;background:#2b6fd6;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .chat-send:disabled{background:#a9b6c6;cursor:default;}
  .chat-box.drag{outline:2px dashed #2b6fd6;outline-offset:-2px;}

  .cal-mem-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:6px;}
  .sch-btn-sm{padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;cursor:pointer;flex:none;font-family:inherit;}
  .sch-btn-sm:hover{border-color:var(--navy-600);}
  .sch-btn-sm.danger{color:var(--danger);}
  /* 일정 창이 열려 있으면 뒤 화면은 스크롤되지 않게(창 안에서만 스크롤) */
  html.modal-open, html.modal-open body{overflow:hidden;}
  html, body{overflow-x:clip;}
  .modal-overlay, .modal-card, .chat-list{overscroll-behavior:contain;}

  /* ---- 모바일: 바깥 큰 테두리는 없애고 날짜마다 작은 네모 칸은 유지, 일정은 한 줄.
         글씨가 잘리지 않게 칸을 넓히고 달력만 좌우로 밀어서 본다 ---- */
  @media (max-width:760px){
    /* 맨 위 메뉴(대시보드/프로필/로그아웃) 한 줄로 */
    .navbar{padding:12px 14px;gap:10px;}
    .navbar .brand{font-size:16px;white-space:nowrap;flex:none;}
    .navbar nav{display:flex;white-space:nowrap;}
    .navbar nav a{margin-left:14px;font-size:13px;}
    .sch-wrap{padding:16px 0 60px;}
    .sch-wrap > h1,.sch-toolbar,.sch-cals,.sch-legend{padding-left:14px;padding-right:14px;}
    .sch-wrap > h1{font-size:21px;}
    /* "2026년 11월" 줄은 아래로 내려도 위에 고정 */
    .sch-toolbar{position:sticky;top:0;z-index:30;background:var(--paper);margin:8px 0 10px;padding-top:8px;padding-bottom:8px;flex-wrap:nowrap;box-shadow:0 6px 8px -8px rgba(15,37,69,.25);}
    .sch-nav{gap:6px;}
    .sch-nav button{padding:5px 10px;}
    #monthLabel{min-width:96px;font-size:15.5px;}
    #exportImgBtn{padding:7px 10px;white-space:nowrap;}
    #exportImgBtn .tx-long{display:none;}
    .sch-grid-wrap{border:none;border-radius:0;background:transparent;padding:0;}
    .sch-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:0 10px 4px;}
    .sch-inner{min-width:819px;}
    .sch-weekdays{font-size:12px;padding:4px 0 6px;}
    .sch-grid{gap:5px;}
    .sch-day{min-height:96px;padding:5px 4px 6px;border-radius:9px;}
    .sch-day.is-today{border-color:var(--navy-600);box-shadow:none;}
    .sch-day .d-num{padding-right:0;font-size:13px;}
    .sch-day .d-num span{display:inline-block;min-width:22px;height:22px;line-height:22px;border-radius:11px;text-align:center;}
    .sch-day.is-today .d-num span{background:var(--navy-900);color:#fff;}
    .sch-day .d-items{gap:2px;margin-top:3px;}
    .sch-chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:600;padding:2px 5px;border-radius:4px;}
    .sch-incheon-toggle{display:none;}  /* 모바일에서는 인천출근 체크박스 숨김(PC에서만 사용) */
    .modal-overlay{padding:8px;}
    .chat-list{max-height:max(220px, calc(94vh - 380px));}
    .cmsg .bub img{max-width:220px;max-height:220px;}
  }
</style>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partners</span></a>
<nav><a href="dashboard.html">대시보드</a><a href="profile.html">프로필</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>
<div class="sch-wrap">
  <h1>📅 일정</h1>

  <div id="approvalNotice" style="display:none;margin-top:20px;" class="auth-card">승인 후 이용할 수 있습니다.</div>

  <div id="schBody" style="display:none;">
    <div class="sch-toolbar">
      <div class="sch-nav">
        <button type="button" id="prevMonthBtn">‹</button>
        <span id="monthLabel">-</span>
        <button type="button" id="nextMonthBtn">›</button>
        <button type="button" id="todayBtn" class="btn-ghost" style="margin-left:4px;">오늘</button>
      </div>
      <button type="button" id="exportImgBtn" class="btn-ghost">🖼️ <span class="tx-long">이미지로 </span>저장</button>
    </div>

    <div class="sch-cals" id="calToggles">
      <button type="button" class="sch-tab" data-cal="common">📢 공통일정</button>
      <button type="button" class="sch-tab" data-cal="mine">🙋 내 일정</button>
      <span id="calChips"></span>
      <div class="sch-mem-wrap" id="memWrap" style="display:none;">
        <button type="button" class="sch-tab" id="memBtn">👥 팀원 일정 ▾</button>
        <div class="sch-mem-pop" id="memPop"></div>
      </div>
      <button type="button" class="sch-tab add" id="calAddBtn" style="display:none;">＋ 일정 추가</button>
    </div>

    <div class="sch-grid-wrap" id="calendarCapture">
      <div class="cap-title" id="capTitle"></div>
      <div class="sch-legend" id="legendRow"></div>
      <div class="sch-scroll" id="calScroll"><div class="sch-inner">
        <div class="sch-weekdays">
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span><span class="sun">일</span>
        </div>
        <div class="sch-grid" id="calGrid"></div>
      </div></div>
    </div>
  </div>
</div>

<!-- 일정 추가/수정 + 대화창 -->
<div id="eventModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-card" style="max-width:560px;max-height:94vh;">
    <div class="modal-header">
      <h2 id="eventModalTitle">일정</h2>
      <div class="mh-acts">
        <button type="button" class="btn-save-top" id="evSaveTop">저장</button>
        <button type="button" class="modal-close" id="eventModalClose" aria-label="닫기">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="eventModalBody"></div>
  </div>
</div>

<!-- SM 전용: 공유 일정 만들기/수정 -->
<div id="calModalOverlay" class="modal-overlay" style="display:none">
  <div class="modal-card" style="max-width:420px;">
    <div class="modal-header">
      <h2 id="calModalTitle">일정 추가</h2>
      <div class="mh-acts">
        <button type="button" class="btn-save-top" id="calSaveBtn">저장</button>
        <button type="button" class="modal-close" id="calModalClose" aria-label="닫기">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <input type="text" class="ev-title" id="calName" placeholder="일정 이름 (예: 교육팀, 인천지점)" maxlength="20">
      <div class="ev-sec">
        <div class="ev-sec-t" style="display:flex;justify-content:space-between;align-items:center;">
          <span>같이 볼 사람 <span id="calMemCount" style="color:var(--muted);font-weight:400;"></span></span>
          <span class="sch-mem-acts" style="border:none;padding:0;margin:0;gap:12px;"><button type="button" id="calMemAll">전체 선택</button><button type="button" id="calMemNone">전체 해제</button></span>
        </div>
        <div class="cal-mem-list" id="calMemList"></div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;">선택한 사람은 이 일정을 보고 수정할 수 있어요.</div>
      </div>
      <div id="calDelWrap" style="margin-top:14px;text-align:right;display:none;"><button type="button" class="link-del" id="calDeleteBtn">🗑 이 일정 삭제</button></div>
    </div>
  </div>
</div>

<!-- 다른 날짜로 옮길 때: 이동할지 복사할지 -->
<div id="mcOverlay" class="modal-overlay" style="display:none;z-index:130;">
  <div class="modal-card" style="max-width:360px;">
    <div class="modal-body" style="padding:22px;">
      <div id="mcTitle" style="font-size:15px;font-weight:800;color:var(--navy-950);margin-bottom:4px;word-break:break-all;"></div>

<script src="assets/supabase-client.js"></script>
<script>
/* ============================================================================
   일정표 (타임트리 느낌의 팀 공유 캘린더)
   - 맨 위 "공통일정 / 내 일정 / (SM이 만든 공유 일정들) / 팀원 일정"을 켜고 끄면
     (파란색 = 켜짐) 켜진 것들이 한 달력에 겹쳐서 보인다.
   - SM은 "＋ 일정 추가"로 공유 일정을 만들고 같이 볼 사람을 고른다. 고른 사람은
     그 일정을 보고 고칠 수 있다.
   - 개인 일정 권한: 본인 + 담당 TL/SM + (역방향으로) 그 TL/SM을 관리자로 둔 팀원까지
     서로 보고 고칠 수 있다(팀벌금의 grade/tl_members 구조 재사용).
   - 공통일정: SM만 쓰고 지우지만, 보기는 전체 공개.
   - 팀벌금에서 숨김/비활성화한 사람은 팀원 목록·공유 대상·생일에서 빠진다.
   - 순서: 제목 맨 앞의 숫자("09 장진수")를 그대로 읽어 숫자 순으로 나열한다.
   - 일정 화면 아래는 대화창: 글/이미지/PDF/파일, Ctrl+V로 복사한 이미지 붙여넣기.
   ============================================================================ */

const PRESET_TYPES = [
  { key: '일반만남', color: '#d7f0c7' },
  { key: '첫상담',   color: '#cfe8fb' },
  { key: '클로징',   color: '#f6c6c6' },
  { key: '회사일정', color: '#fbe9a8' }
];
const BIRTHDAY_COLOR = '#f9c9e0';
const INCHEON_PALETTE = ['#e3ddf7', '#d7f2ea', '#f7e3cf', '#dde3f5', '#ececec'];
const NEW_KIND_SUGGEST = ['#e3ddf7', '#d7f2ea', '#f7e3cf', '#c9eef2', '#e8d9c7', '#dcdcf5'];
const ACTIVE_KEY = 'wp_schedule_cals_v1';
const FILE_BUCKET = 'schedule-files';
const MAX_FILE_MB = 20;
/** 휴대폰처럼 마우스가 없는 기기 - Ctrl+V 안내를 빼는 데 쓴다 */
const IS_TOUCH = (function(){ try{ return window.matchMedia('(hover: none)').matches; }catch(e){ return false; } })();

let Me = null;
let Roster = [];
let RosterByUid = {};
let Holidays = {};
let ViewYear = 0, ViewMonth = 0;
let Active = { common: true, mine: true, members: [], calOff: [] };
let Events = [];
let DayFlags = {};
let MyCategories = [];
let CategoriesReady = true;
let Calendars = [];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function pad2(n){ n = Math.max(0, Math.floor(Number(n) || 0)); return (n < 10 ? '0' : '') + n; }
function ymd(y, m, d){ return y + '-' + pad2(m) + '-' + pad2(d); }
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
function mmdd(s){ return (s || '').slice(5, 10); }
/** 화면 표기는 별명이 아니라 이름(실명). 저장할 때도 이름으로 남긴다. */
function myName(){ return (Me && (Me.name || Me.nickname || Me.email)) || ''; }
/** 이미 별명으로 저장된 예전 기록도 이름으로 보이게, 사람(uid)으로 이름을 다시 찾는다 */
function nameOf(uid, fallback){ const u = uid && RosterByUid[uid]; return (u && u.name) || fallback || '-'; }
function isSM(p){ return !!(p && p.role === 'admin'); }
function leadNum(label){ const m = /^\s*(\d{1,4})/.exec(label || ''); return m ? parseInt(m[1], 10) : Infinity; }
function fmtSize(b){ b = Number(b) || 0; return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; }
function isImageType(t){ return /^image\//i.test(t || ''); }

function fmtDateKr(dateStr){
  const p = dateStr.split('-').map(Number);
  const dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(p[0], p[1] - 1, p[2]).getDay()];
  return p[0] + '.' + pad2(p[1]) + '.' + pad2(p[2]) + ' (' + dow + ')';
}
function fmtTime(iso){
  try{ const d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  catch(e){ return ''; }
}

/* ---------------------------- 권한/명단 ---------------------------- */
function myRosterEntry(){ return RosterByUid[Me.id] || null; }
function canAccess(ownerUid){
  if(!ownerUid) return false;
  if(ownerUid === Me.id) return true;
  if(isSM(Me)) return true;
  const owner = RosterByUid[ownerUid];
  if(owner && isSM(owner)) return true;
  const mine = myRosterEntry();
  if(mine && (mine.tlMembers || []).indexOf(ownerUid) >= 0) return true;
  if(owner && (owner.tlMembers || []).indexOf(Me.id) >= 0) return true;
  return false;
}
function activePeople(){ return Roster.filter(function(u){ return !u.hidden && !u.disabled; }); }
function teammates(){
  return activePeople().filter(function(u){ return u.uid !== Me.id && canAccess(u.uid); })
    .sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'ko'); });
}
function calById(id){ return Calendars.find(function(c){ return c.id === id; }) || null; }

/* ---------------------------- 켜기/끄기 상태 ---------------------------- */
function loadActive(){
  try{
    const v = JSON.parse(localStorage.getItem(ACTIVE_KEY) || 'null');
    if(v && typeof v === 'object'){
      Active.common = v.common !== false;
      Active.mine = v.mine !== false;
      Active.members = Array.isArray(v.members) ? v.members : [];
      Active.calOff = Array.isArray(v.calOff) ? v.calOff : [];
    }
  }catch(e){}
  const allowed = {};
  teammates().forEach(function(u){ allowed[u.uid] = true; });
  Active.members = Active.members.filter(function(uid){ return allowed[uid]; });
}
function saveActive(){ try{ localStorage.setItem(ACTIVE_KEY, JSON.stringify(Active)); }catch(e){} }
function calOn(id){ return !!calById(id) && Active.calOff.indexOf(id) < 0; }
function setCalOn(id, on){
  Active.calOff = Active.calOff.filter(function(x){ return x !== id; });
  if(!on) Active.calOff.push(id);
}
function isVisible(e){
  if(e.calendar_id) return calOn(e.calendar_id);
  if(e.is_common) return Active.common;
  if(e.owner_uid === Me.id) return Active.mine;
  return Active.members.indexOf(e.owner_uid) >= 0;
}

/* ---------------------------- 데이터 불러오기 ---------------------------- */
async function loadRoster(){
  const [namesRes, attRes] = await Promise.all([
    supabaseClient.rpc('get_team_names'),
    supabaseClient.from('attendance_profiles').select('uid, grade, tl_members, birth, hidden, disabled')
  ]);
  const attByUid = {};
  (attRes.data || []).forEach(function(r){ attByUid[r.uid] = r; });
  Roster = (namesRes.data || []).map(function(n){
    const a = attByUid[n.id] || {};
    return {
      uid: n.id, name: n.name || '', role: n.role,
      grade: n.role === 'admin' ? 'SM' : (a.grade || '후보자'),
      tlMembers: Array.isArray(a.tl_members) ? a.tl_members : [],
      birth: a.birth || '', hidden: !!a.hidden, disabled: !!a.disabled
    };
  });
  RosterByUid = {};
  Roster.forEach(function(u){ RosterByUid[u.uid] = u; });
}
async function loadHolidays(){
  const { data, error } = await supabaseClient.from('attendance_holidays').select('id, data');
  Holidays = {};
  if(error) return;
  (data || []).forEach(function(r){ if(r.data && r.data.name) Holidays[r.id] = r.data.name; });
}
async function loadCategories(){
  const { data, error } = await supabaseClient.from('schedule_categories').select('*').eq('owner_uid', Me.id).order('created_at', { ascending: true });
  if(error){ CategoriesReady = false; MyCategories = []; return; }
  CategoriesReady = true;
  MyCategories = data || [];
}
async function loadCalendars(){
  const { data, error } = await supabaseClient.from('schedule_calendars').select('*').order('created_at', { ascending: true });
  Calendars = error ? [] : (data || []);
}

function gridDates(){
  const first = new Date(ViewYear, ViewMonth - 1, 1);
  const lead = (first.getDay() + 6) % 7; // 월요일 시작
  const total = Math.ceil((lead + daysInMonth(ViewYear, ViewMonth)) / 7) * 7;
  const list = [];
  for(let i = 0; i < total; i++) list.push(new Date(ViewYear, ViewMonth - 1, 1 - lead + i));
  return list;
}
function visibleRange(){
  const list = gridDates();
  const s = function(d){ return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  return { start: s(list[0]), end: s(list[list.length - 1]) };
}
async function loadEvents(){
  const r = visibleRange();
  const { data, error } = await supabaseClient.from('schedule_events').select('*')
    .gte('event_date', r.start).lte('event_date', r.end).order('event_date', { ascending: true });
  Events = error ? [] : (data || []);
}
async function loadDayFlags(){
  const r = visibleRange();
  const { data, error } = await supabaseClient.from('schedule_day_flags').select('*')
    .gte('event_date', r.start).lte('event_date', r.end);
  DayFlags = {};
  if(error) return;
  (data || []).forEach(function(x){ DayFlags[x.event_date] = x; });
}

function birthdaysFor(dateStr){
  if(!Active.common) return [];
  const target = mmdd(dateStr);
  return activePeople().filter(function(u){ return u.birth && mmdd(u.birth) === target; })
    .map(function(u){ return { id: null, virtual: true, is_common: true, event_date: dateStr, kind: '생일', label: u.name + '님 생일', color: BIRTHDAY_COLOR }; });
}
function dayEventsFor(dateStr){
  const real = Events.filter(function(e){ return e.event_date === dateStr && isVisible(e); });
  real.sort(function(a, b){
    const na = leadNum(a.label), nb = leadNum(b.label);
    if(na !== nb) return na < nb ? -1 : 1;
    return String(a.created_at || '').localeCompare(String(b.created_at || ''));
  });
  return birthdaysFor(dateStr).concat(real);
}

/* ---------------------------- 렌더링 ---------------------------- */
function renderMonthLabel(){
  document.getElementById('monthLabel').textContent = ViewYear + '년 ' + ViewMonth + '월';
  document.getElementById('capTitle').textContent = ViewYear + '년 ' + ViewMonth + '월 일정';
}

function renderToggles(){
  document.querySelectorAll('#calToggles [data-cal]').forEach(function(b){
    b.classList.toggle('on', !!Active[b.dataset.cal]);
  });
  const sm = isSM(Me);
  document.getElementById('calChips').innerHTML = Calendars.map(function(c){
    return '<button type="button" class="sch-tab' + (calOn(c.id) ? ' on' : '') + '" data-calid="' + c.id + '">🗂 ' + esc(c.name) +
      (sm ? '<span class="cal-edit" data-caledit="' + c.id + '" title="이름·같이 볼 사람 수정">⚙</span>' : '') + '</button>';
  }).join('');
  document.getElementById('calAddBtn').style.display = sm ? '' : 'none';

  const list = teammates();
  document.getElementById('memWrap').style.display = list.length ? '' : 'none';
  const n = Active.members.length;
  const memBtn = document.getElementById('memBtn');
  memBtn.textContent = '👥 팀원 일정' + (n ? ' (' + n + ')' : '') + ' ▾';
  memBtn.classList.toggle('on', n > 0);
  const sel = {};
  Active.members.forEach(function(uid){ sel[uid] = true; });
  document.getElementById('memPop').innerHTML =
    '<div class="sch-mem-acts"><button type="button" data-memall="1">전체 선택</button><button type="button" data-memall="0">전체 해제</button></div>' +
    list.map(function(u){
      return '<label class="sch-mem-row"><input type="checkbox" data-mem="' + u.uid + '"' + (sel[u.uid] ? ' checked' : '') + '>' +
        '<span>' + esc(u.name) + '</span><span class="gr">' + esc(u.grade) + '</span></label>';
    }).join('');
}

function renderLegend(){
  let html = PRESET_TYPES.map(function(t){ return '<span class="sw"><i style="background:' + t.color + '"></i>' + t.key + '</span>'; }).join('');
  const seen = {};
  PRESET_TYPES.forEach(function(t){ seen[t.key] = true; });
  Events.forEach(function(e){
    if(!isVisible(e) || !e.kind || seen[e.kind]) return;
    seen[e.kind] = true;
    html += '<span class="sw"><i style="background:' + esc(e.color) + '"></i>' + esc(e.kind) + '</span>';
  });
  if(Active.common){
    html += '<span class="sw"><i style="background:' + BIRTHDAY_COLOR + '"></i>생일 🎁</span>';
    let inc = null;
    Object.keys(DayFlags).forEach(function(k){ if(DayFlags[k].incheon && !inc) inc = DayFlags[k]; });
    if(inc) html += '<span class="sw"><i style="background:' + esc(inc.incheon_color || INCHEON_PALETTE[0]) + '"></i>' + '인천출근</span>';
  }
  document.getElementById('legendRow').innerHTML = html;
}

function renderChip(e){
  if(e.virtual) return '<div class="sch-chip" style="background:' + BIRTHDAY_COLOR + ';font-weight:600;" data-bday="1">🎁 ' + esc(e.label) + '</div>';
  const editable = canEditEvent(e);
  return '<div class="sch-chip' + (editable ? ' can-edit' : '') + '" style="background:' + esc(e.color) + '" data-id="' + e.id + '"' +
    (editable && !IS_TOUCH ? ' draggable="true"' : '') + ' title="' + esc(e.label) + '">' + esc(e.label) +
    (editable ? '<button type="button" class="chip-x" data-delev="' + e.id + '" title="삭제">×</button>' : '') + '</div>';
}

function renderGrid(){
  const list = gridDates();
  const now = new Date();
  const todayStr = ymd(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const showIncheon = Active.common;
  const canToggleIncheon = isSM(Me) && Active.common;
  let html = '';
  list.forEach(function(d){
    const dateStr = ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const inMonth = (d.getMonth() + 1) === ViewMonth;
    const dow0 = d.getDay();
    const holName = Holidays[dateStr];
    const numClass = holName ? 'holiday' : (dow0 === 0 ? 'sun' : (dow0 === 6 ? 'sat' : ''));
    const flag = DayFlags[dateStr];
    const bg = (showIncheon && flag && flag.incheon) ? (' style="background:' + esc(flag.incheon_color || INCHEON_PALETTE[0]) + '"') : '';
    html += '<div class="sch-day' + (inMonth ? '' : ' other-month') + (dateStr === todayStr ? ' is-today' : '') + '"' + bg + ' data-date="' + dateStr + '">' +
      (canToggleIncheon ? ('<input type="checkbox" class="sch-incheon-toggle" title="인천출근 표시" data-incheon="' + dateStr + '"' + (flag && flag.incheon ? ' checked' : '') + '>') : '') +
      '<div class="d-num ' + numClass + '"><span>' + d.getDate() + '</span></div>' +
      (holName ? ('<div class="d-hol">' + esc(holName) + '</div>') : '') +
      '<div class="d-items">' + dayEventsFor(dateStr).map(renderChip).join('') + '</div>' +
      '</div>';
  });
  document.getElementById('calGrid').innerHTML = html;
}

function renderAll(){ renderToggles(); renderLegend(); renderGrid(); }

/** 모바일(달력이 화면보다 넓어 좌우로 밀어 보는 경우)에서 오늘 칸이 가운데 오게 맞춘다 */
function scrollToToday(){
  const sc = document.getElementById('calScroll');
  if(!sc || sc.scrollWidth <= sc.clientWidth + 2) return;
  const now = new Date();
  const cell = document.querySelector('.sch-day[data-date="' + ymd(now.getFullYear(), now.getMonth() + 1, now.getDate()) + '"]');
  if(!cell){ sc.scrollLeft = 0; return; }
  const r = cell.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  sc.scrollLeft += (r.left - sr.left) - (sc.clientWidth - r.width) / 2;
}

async function refreshMonth(){
  await Promise.all([loadEvents(), loadDayFlags()]);
  renderMonthLabel();
  renderAll();
}

/* ---------------------------- SM: 공유 일정 만들기/수정 ---------------------------- */
let CalEdit = null; // { id|null, members:{uid:true} }

function openCalModal(calId){
  const c = calId ? calById(calId) : null;
  const members = {};
  (c ? (c.member_uids || []) : []).forEach(function(uid){ members[uid] = true; });
  CalEdit = { id: c ? c.id : null, members: members };
  document.getElementById('calModalTitle').textContent = c ? '일정 수정' : '일정 추가';
  document.getElementById('calName').value = c ? c.name : '';
  document.getElementById('calDelWrap').style.display = c ? '' : 'none';
  renderCalMembers();
  document.getElementById('calModalOverlay').style.display = 'flex';
  syncScrollLock();
  setTimeout(function(){ document.getElementById('calName').focus(); }, 30);
}
function calCandidates(){
  return activePeople().filter(function(u){ return u.uid !== Me.id; })
    .sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'ko'); });
}
function renderCalMembers(){
  const list = calCandidates();
  document.getElementById('calMemList').innerHTML = list.length ? list.map(function(u){
    return '<label class="sch-mem-row"><input type="checkbox" data-calmem="' + u.uid + '"' + (CalEdit.members[u.uid] ? ' checked' : '') + '>' +
      '<span>' + esc(u.name) + '</span><span class="gr">' + esc(u.grade) + '</span></label>';
  }).join('') : '<div style="padding:10px;color:var(--muted);font-size:13px;">선택할 팀원이 없어요</div>';
  const n = list.filter(function(u){ return CalEdit.members[u.uid]; }).length;
  document.getElementById('calMemCount').textContent = '(' + n + '명)';
}
function closeCalModal(){ document.getElementById('calModalOverlay').style.display = 'none'; CalEdit = null; syncScrollLock(); }

async function saveCalendar(){
  if(!CalEdit) return;
  const name = document.getElementById('calName').value.trim();
  if(!name){ alert('일정 이름을 입력해주세요'); document.getElementById('calName').focus(); return; }
  const valid = {};
  calCandidates().forEach(function(u){ valid[u.uid] = true; });
  const memberUids = Object.keys(CalEdit.members).filter(function(uid){ return CalEdit.members[uid] && valid[uid]; });
  memberUids.push(Me.id); // 만든 사람도 항상 포함
  const btn = document.getElementById('calSaveBtn');
  btn.disabled = true;
  let res;
  if(CalEdit.id){
    res = await supabaseClient.from('schedule_calendars').update({ name: name, member_uids: memberUids }).eq('id', CalEdit.id);
  } else {
    res = await supabaseClient.from('schedule_calendars').insert({ name: name, member_uids: memberUids, created_by: Me.id }).select().single();
  }
  btn.disabled = false;
  if(res.error){
    alert('저장 실패: ' + res.error.message + (/schedule_calendars/.test(res.error.message) ? '\n(schedule_migration_3.sql을 먼저 실행해야 해요)' : ''));
    return;
  }
  if(!CalEdit.id && res.data) setCalOn(res.data.id, true);
  saveActive();
  closeCalModal();
  await loadCalendars();
  await refreshMonth();
}
async function deleteCalendar(){
  if(!CalEdit || !CalEdit.id) return;
  const c = calById(CalEdit.id);
  if(!confirm('"' + (c ? c.name : '') + '" 일정을 삭제할까요?\n이 안에 적힌 일정과 대화도 모두 지워지고 되돌릴 수 없어요.')) return;
  const { error } = await supabaseClient.from('schedule_calendars').delete().eq('id', CalEdit.id);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  setCalOn(CalEdit.id, true);
  saveActive();
  closeCalModal();
  await loadCalendars();
  await refreshMonth();
}

/* ---------------------------- 일정 추가/수정 화면 ---------------------------- */
let Modal = null; // { ev, dateStr, kind, color, target, targets, readOnly, extraKind, staged:[], pending:[], seenCount }

function writableTargets(){
  const t = [];
  if(Active.mine) t.push({ id: Me.id, label: '내 일정' });
  if(Active.common && isSM(Me)) t.push({ id: 'common', label: '📢 공통일정' });
  Calendars.forEach(function(c){ if(calOn(c.id)) t.push({ id: 'cal:' + c.id, label: '🗂 ' + c.name }); });
  Active.members.forEach(function(uid){
    const u = RosterByUid[uid];
    if(u && canAccess(uid)) t.push({ id: uid, label: u.name + ' 님' });
  });
  if(!t.length) t.push({ id: Me.id, label: '내 일정' });
  return t;
}
function kindList(){
  const list = PRESET_TYPES.map(function(t){ return { name: t.key, color: t.color }; });
  MyCategories.forEach(function(c){ list.push({ name: c.name, color: c.color, catId: c.id }); });
  if(Modal && Modal.extraKind && !list.some(function(k){ return k.name === Modal.extraKind.name; })) list.push(Modal.extraKind);
  return list;
}
function whereLabel(ev){
  if(ev.calendar_id){ const c = calById(ev.calendar_id); return '🗂 ' + (c ? c.name : '공유 일정'); }
  if(ev.is_common) return '📢 공통일정';
  if(ev.owner_uid === Me.id) return '내 일정';
  return ((RosterByUid[ev.owner_uid] || {}).name || '?') + ' 님 일정';
}

/** 팀원 일정 목록 창이 화면 오른쪽 밖으로 나가면 왼쪽으로 당겨서 화면 안에 맞춘다 */
function fitMemPop(){
  const pop = document.getElementById('memPop');
  pop.style.left = '0px';
  if(!pop.classList.contains('open')) return;
  const r = pop.getBoundingClientRect();
  const over = r.right - (document.documentElement.clientWidth - 10);
  if(over > 0) pop.style.left = (-Math.min(over, r.left - 10)) + 'px';
}

/** 일정 창이 하나라도 열려 있으면 뒤쪽 페이지가 같이 스크롤되지 않게 막는다 */
function syncScrollLock(){
  const open = ['eventModalOverlay', 'calModalOverlay', 'mcOverlay'].some(function(id){ const el = document.getElementById(id); return el && el.style.display === 'flex'; });
  document.documentElement.classList.toggle('modal-open', open);
}

/** "이동 / 복사 / 취소"를 물어보고 'move' | 'copy' | null 을 돌려준다 */
function askMoveCopy(label, fromDate, toDate){
  return new Promise(function(resolve){
    const ov = document.getElementById('mcOverlay');
    document.getElementById('mcTitle').textContent = '"' + label + '"';
    document.getElementById('mcDates').textContent = fmtDateKr(fromDate) + '  →  ' + fmtDateKr(toDate);
    ov.style.display = 'flex';
    syncScrollLock();
    ov.onclick = function(e){
      const b = e.target.closest('[data-mc]');
      if(!b && e.target !== ov) return;
      ov.style.display = 'none';
      ov.onclick = null;
      syncScrollLock();
      resolve(b && b.dataset.mc !== 'cancel' ? b.dataset.mc : null);
    };
  });
}

/** 일정을 다른 날로 끌어다 놓았을 때(PC) */
async function dropEventOn(eventId, toDate){
  const ev = Events.find(function(x){ return x.id === eventId; });
  if(!ev || !canEditEvent(ev) || ev.event_date === toDate) return;
  const choice = await askMoveCopy(ev.label, ev.event_date, toDate);
  if(choice === 'move'){
    const { error } = await supabaseClient.from('schedule_events').update({ event_date: toDate, updated_at: new Date().toISOString() }).eq('id', ev.id);
    if(error){ alert('이동 실패: ' + error.message); return; }
    await refreshMonth();
  } else if(choice === 'copy'){
    openEventModal(null, toDate, { copyOf: ev });
  }
}

/** 일정 오른쪽 위 ×로 바로 지우기(PC) */
async function quickDeleteEvent(eventId){
  const ev = Events.find(function(x){ return x.id === eventId; });
  if(!ev || !canEditEvent(ev)) return;
  if(!confirm('"' + ev.label + '" 일정을 삭제할까요?\n(대화 내용도 같이 지워져요)')) return;
  const { error } = await supabaseClient.from('schedule_events').delete().eq('id', ev.id);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  await refreshMonth();
}

/** 원래 일정이 들어 있던 곳(복사본을 같은 곳에 만들 때 씀) */
function targetOf(ev){
  if(ev.calendar_id){ const c = calById(ev.calendar_id); return { id: 'cal:' + ev.calendar_id, label: '🗂 ' + (c ? c.name : '공유 일정') }; }
  if(ev.is_common) return isSM(Me) ? { id: 'common', label: '📢 공통일정' } : { id: Me.id, label: '내 일정' };
  if(ev.owner_uid === Me.id) return { id: Me.id, label: '내 일정' };
  return { id: ev.owner_uid, label: nameOf(ev.owner_uid, '?') + ' 님' };
}
/** 수정할 수 있는 일정인가(공통일정은 SM만) - × 삭제 표시와 끌어서 옮기기에 쓴다 */
function canEditEvent(e){ return !!e && !e.virtual && (!!e.calendar_id || !e.is_common || isSM(Me)); }

/** opts.copyOf: 이 일정을 복사해서 새로 만드는 창 / opts.draft: 복사 전에 고쳐둔 내용 */
function openEventModal(eventId, newDateStr, opts){
  const copyOf = (opts && opts.copyOf) || null;
  const draft = (opts && opts.draft) || null;
  const ev = eventId ? Events.find(function(x){ return x.id === eventId; }) : null;
  const dateStr = ev ? ev.event_date : newDateStr;
  const targets = ev ? [] : (copyOf ? [targetOf(copyOf)] : writableTargets());
  const base = draft || copyOf || ev;
  Modal = {
    ev: ev, dateStr: dateStr, copyOf: copyOf,
    kind: base ? base.kind : PRESET_TYPES[0].key,
    color: base ? base.color : PRESET_TYPES[0].color,
    target: targets.length ? targets[0].id : null,
    targets: targets,
    readOnly: ev ? (!ev.calendar_id && ev.is_common && !isSM(Me)) : false,
    extraKind: null,
    staged: [],   // 대화창 입력칸 위에 올려둔(아직 안 보낸) 첨부
    pending: [],  // 새 일정: 저장 전에 미리 써둔 대화(저장할 때 같이 올라감)
    seenCount: -1,
    poll: null
  };
  if(base && !PRESET_TYPES.some(function(t){ return t.key === base.kind; }) && !MyCategories.some(function(c){ return c.name === base.kind; })){
    Modal.extraKind = { name: base.kind || '기타', color: base.color };
  }

  document.getElementById('eventModalTitle').textContent = fmtDateKr(dateStr) + (ev ? ' 일정' : (copyOf ? ' 일정 복사' : ' 일정 추가'));
  document.getElementById('evSaveTop').style.display = Modal.readOnly ? 'none' : '';
  document.getElementById('evSaveTop').disabled = false;
  const ro = Modal.readOnly ? ' disabled' : '';
  let whereHtml = '';
  if(ev){
    whereHtml = '<div class="ev-meta"><span>📌 ' + esc(whereLabel(ev)) + ' · ✍️ ' + esc(nameOf(ev.author_uid, ev.author_name)) + '</span>' +
      (Modal.readOnly ? '' : '<button type="button" class="link-del" id="evDeleteBtn">🗑 삭제</button>') + '</div>' +
      (Modal.readOnly ? '<div class="ev-meta">공통일정은 SM만 수정할 수 있어요. 대화는 남길 수 있어요.</div>' : '');
  } else if(targets.length > 1){
    whereHtml = '<div class="ev-sec"><div class="ev-sec-t">저장할 곳</div><div class="kind-btns" id="tgtBtns"></div></div>';
  } else {
    whereHtml = '<div class="ev-meta"><span>📌 ' + esc(targets[0].label) + '에 저장돼요</span></div>';
  }

  document.getElementById('eventModalBody').innerHTML =
    '<input type="text" class="ev-title" id="evLabel" placeholder="제목 (예: 09 장진수)" value="' + esc(base ? base.label : '') + '"' + ro + '>' +
    '<div class="ev-date-row"><span>📅 날짜</span><input type="date" id="evDate" value="' + esc(dateStr) + '"' + ro + '>' +
      (ev && !Modal.readOnly ? '<small>다른 날짜로 바꾸면 이동/복사를 골라요</small>' : '') + '</div>' +
    '<div class="ev-sec"><div class="ev-sec-t">종류</div>' +
      '<div class="kind-row"><div class="kind-btns" id="kindBtns"></div>' +
      (Modal.readOnly ? '' : '<button type="button" class="kind-add" id="kindAddBtn">+ 새 항목</button>') + '</div>' +
      '<div class="kind-form" id="kindForm"><input type="text" id="kindName" placeholder="항목 이름 (예: 교육)" maxlength="12">' +
      '<input type="color" id="kindColor" value="' + suggestNewColor() + '">' +
      '<button type="button" class="sch-btn-sm" id="kindSaveBtn">추가</button><button type="button" class="sch-btn-sm" id="kindCancelBtn">취소</button></div>' +
    '</div>' +
    whereHtml +
    '<div class="chat-box" id="chatBox">' +
      '<div class="chat-list" id="chatList"></div>' +
      '<div class="chat-pend" id="chatPend"></div>' +
      '<div class="chat-input">' +
        '<button type="button" class="chat-ic" id="chatAttachBtn" title="사진·PDF·파일 첨부">📎</button>' +
        '<textarea id="chatInput" rows="1" placeholder="' + (IS_TOUCH ? '메시지 입력' : '메시지 입력 (이미지는 Ctrl+V로 붙여넣기)') + '"></textarea>' +
        '<button type="button" class="chat-send" id="chatSendBtn">보내기</button>' +
      '</div>' +
    '</div>';

  renderKindButtons();
  renderTargetButtons();

  // 날짜를 바꾸면 위 제목의 날짜도 같이 바뀌게
  document.getElementById('evDate').addEventListener('change', function(){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(this.value)) return;
    document.getElementById('eventModalTitle').textContent = fmtDateKr(this.value) + (ev ? ' 일정' : (copyOf ? ' 일정 복사' : ' 일정 추가'));
  });

  if(!Modal.readOnly){
    document.getElementById('kindAddBtn').addEventListener('click', function(){
      const f = document.getElementById('kindForm');
      f.classList.toggle('open');
      if(f.classList.contains('open')) document.getElementById('kindName').focus();
    });
    document.getElementById('kindCancelBtn').addEventListener('click', function(){ document.getElementById('kindForm').classList.remove('open'); });
    document.getElementById('kindSaveBtn').addEventListener('click', addCategory);
    document.getElementById('kindName').addEventListener('keydown', function(e){ if(e.key === 'Enter') addCategory(); });
    document.getElementById('evLabel').addEventListener('keydown', function(e){ if(e.key === 'Enter') handleSaveEvent(); });
    const del = document.getElementById('evDeleteBtn');
    if(del) del.addEventListener('click', handleDeleteEvent);
  }
  wireChat();

  document.getElementById('eventModalOverlay').style.display = 'flex';
  syncScrollLock();
  if(ev){
    refreshChat(true);
    Modal.poll = setInterval(function(){ refreshChat(false); }, 10000);
  } else {
    renderChatList([]);
    setTimeout(function(){ const t = document.getElementById('evLabel'); if(t) t.focus(); }, 30);
  }
}
function closeEventModal(){
  if(Modal){
    if(Modal.poll) clearInterval(Modal.poll);
    Modal.staged.forEach(function(s){ if(s.preview) URL.revokeObjectURL(s.preview); });
    Modal.pending.forEach(function(p){ if(p.preview) URL.revokeObjectURL(p.preview); });
  }
  document.getElementById('eventModalOverlay').style.display = 'none';
  Modal = null;
  syncScrollLock();
}

function suggestNewColor(){
  const used = {};
  PRESET_TYPES.forEach(function(t){ used[t.color] = true; });
  MyCategories.forEach(function(c){ used[String(c.color).toLowerCase()] = true; });
  return NEW_KIND_SUGGEST.find(function(c){ return !used[c]; }) || NEW_KIND_SUGGEST[0];
}

function renderKindButtons(){
  const wrap = document.getElementById('kindBtns');
  if(!wrap || !Modal) return;
  const ro = Modal.readOnly ? ' disabled' : '';
  wrap.innerHTML = kindList().map(function(k){
    const sel = k.name === Modal.kind;
    return '<button type="button" class="kind-btn' + (sel ? ' sel' : '') + '" style="background:' + esc(k.color) + '" data-kind="' + esc(k.name) + '" data-color="' + esc(k.color) + '"' + ro + '>' +
      esc(k.name) + (k.catId && !Modal.readOnly ? '<span class="x" data-delcat="' + k.catId + '" title="이 항목 지우기">×</span>' : '') + '</button>';
  }).join('');
  wrap.onclick = function(e){
    if(Modal.readOnly) return;
    const x = e.target.closest('[data-delcat]');
    if(x){ e.stopPropagation(); deleteCategory(x.dataset.delcat); return; }
    const b = e.target.closest('[data-kind]');
    if(!b) return;
    Modal.kind = b.dataset.kind;
    Modal.color = b.dataset.color;
    renderKindButtons();
  };
}
function renderTargetButtons(){
  const wrap = document.getElementById('tgtBtns');
  if(!wrap || !Modal) return;
  wrap.innerHTML = Modal.targets.map(function(t){
    return '<button type="button" class="kind-btn tgt-btn' + (t.id === Modal.target ? ' sel' : '') + '" data-tgt="' + t.id + '">' + esc(t.label) + '</button>';
  }).join('');
  wrap.onclick = function(e){
    const b = e.target.closest('[data-tgt]');
    if(!b) return;
    Modal.target = b.dataset.tgt;
    renderTargetButtons();
  };
}

async function addCategory(){
  const nameEl = document.getElementById('kindName');
  const name = nameEl.value.trim();
  const color = document.getElementById('kindColor').value;
  if(!name){ nameEl.focus(); return; }
  const existing = kindList().find(function(k){ return k.name === name; });
  if(existing){ Modal.kind = existing.name; Modal.color = existing.color; }
  else {
    if(!CategoriesReady){ alert('새 항목 저장 기능이 아직 준비되지 않았어요.\n관리자가 schedule_migration_2.sql을 먼저 실행해야 해요.'); return; }
    const { data, error } = await supabaseClient.from('schedule_categories').insert({ owner_uid: Me.id, name: name, color: color }).select().single();
    if(error){ alert('항목 추가 실패: ' + error.message); return; }
    MyCategories.push(data);
    Modal.kind = data.name; Modal.color = data.color;
  }
  nameEl.value = '';
  document.getElementById('kindForm').classList.remove('open');
  document.getElementById('kindColor').value = suggestNewColor();
  renderKindButtons();
}
async function deleteCategory(catId){
  const c = MyCategories.find(function(x){ return x.id === catId; });
  if(!c || !confirm('"' + c.name + '" 항목을 목록에서 지울까요?\n(이미 저장된 일정의 색은 그대로 남아요)')) return;
  const { error } = await supabaseClient.from('schedule_categories').delete().eq('id', catId);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  MyCategories = MyCategories.filter(function(x){ return x.id !== catId; });
  if(Modal && Modal.ev && Modal.ev.kind === c.name) Modal.extraKind = { name: c.name, color: c.color };
  else if(Modal && Modal.kind === c.name){ Modal.kind = PRESET_TYPES[0].key; Modal.color = PRESET_TYPES[0].color; }
  renderKindButtons();
}

async function handleSaveEvent(){
  if(!Modal || Modal.readOnly) return;
  const label = document.getElementById('evLabel').value.trim();
  if(!label){ alert('제목을 입력해주세요'); document.getElementById('evLabel').focus(); return; }
  const n = leadNum(label);
  const orderNum = isFinite(n) ? Math.min(n, 9999) : 9999;
  const ev = Modal.ev;
  const dateEl = document.getElementById('evDate');
  const newDate = (dateEl && /^\d{4}-\d{2}-\d{2}$/.test(dateEl.value)) ? dateEl.value : Modal.dateStr;

  // 기존 일정을 다른 날짜로 바꿨으면 이동/복사를 먼저 묻는다
  let moveTo = null;
  if(ev && newDate !== ev.event_date){
    const choice = await askMoveCopy(label, ev.event_date, newDate);
    if(!choice) return;                        // 취소 - 창은 그대로
    if(choice === 'copy'){
      // 원래 일정은 그대로 두고, 지금 고친 내용으로 채운 복사 창을 연다
      const draft = { label: label, kind: Modal.kind, color: Modal.color };
      closeEventModal();
      openEventModal(null, newDate, { copyOf: ev, draft: draft });
      return;
    }
    moveTo = newDate;
  }

  const btn = document.getElementById('evSaveTop');
  btn.disabled = true;
  try{
    if(ev){
      const patch = { label: label, kind: Modal.kind, color: Modal.color, order_num: orderNum, updated_at: new Date().toISOString() };
      if(moveTo) patch.event_date = moveTo;
      const { error } = await supabaseClient.from('schedule_events').update(patch).eq('id', ev.id);
      if(error){ alert('저장 실패: ' + error.message); return; }
    } else {
      Modal.dateStr = newDate;
      const tgt = Modal.target;
      const calId = (tgt && tgt.indexOf('cal:') === 0) ? tgt.slice(4) : null;
      const isCommon = tgt === 'common';
      const owner = (calId || isCommon) ? null : tgt;
      const { data, error } = await supabaseClient.from('schedule_events').insert({
        owner_uid: owner, is_common: isCommon, calendar_id: calId, event_date: Modal.dateStr, order_num: orderNum,
        kind: Modal.kind, label: label, color: Modal.color, author_uid: Me.id, author_name: myName()
      }).select().single();
      if(error){ alert('저장 실패: ' + error.message); return; }
      // 저장 전에 미리 써둔 대화/첨부(아직 보내기 안 누른 것 포함)도 같이 올린다
      const queued = Modal.pending.slice();
      const leftText = document.getElementById('chatInput').value.trim();
      if(leftText || Modal.staged.length) queued.push.apply(queued, buildRows(leftText, Modal.staged));
      for(const row of queued){
        const r = await postChatRow(data.id, row);
        if(!r.ok){ alert('대화 일부를 올리지 못했어요: ' + r.message); break; }
      }
      // 꺼져 있는 곳에 저장했으면 바로 보이도록 켜준다
      if(calId) setCalOn(calId, true);
      else if(isCommon) Active.common = true;
      else if(owner === Me.id) Active.mine = true;
      else if(Active.members.indexOf(owner) < 0) Active.members.push(owner);
      saveActive();
    }
    closeEventModal();
    await refreshMonth();
  } finally {
    if(btn) btn.disabled = false;
  }
}
async function handleDeleteEvent(){
  if(!Modal || !Modal.ev) return;
  if(!confirm('이 일정을 삭제할까요?\n(대화 내용도 같이 지워져요)')) return;
  const { error } = await supabaseClient.from('schedule_events').delete().eq('id', Modal.ev.id);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  closeEventModal();
  await refreshMonth();
}

/* ---------------------------- 대화창 ---------------------------- */
function wireChat(){
  const input = document.getElementById('chatInput');
  const box = document.getElementById('chatBox');
  document.getElementById('chatAttachBtn').addEventListener('click', function(){
    const f = document.getElementById('chatFile');
    f.value = '';
    f.click();
  });
  document.getElementById('chatSendBtn').addEventListener('click', sendChat);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(); }
  });
  input.addEventListener('input', function(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });
  box.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('drag'); });
  box.addEventListener('dragleave', function(){ box.classList.remove('drag'); });
  box.addEventListener('drop', function(e){
    e.preventDefault(); box.classList.remove('drag');
    if(e.dataTransfer && e.dataTransfer.files) stageFiles(e.dataTransfer.files);
  });
}

/** 복사해둔 이미지를 일정 화면 어디서든 Ctrl+V 하면 대화창에 올린다(글자 붙여넣기는 그대로) */
function onModalPaste(e){
  if(!Modal) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for(let i = 0; i < items.length; i++){
    if(items[i].kind === 'file'){ const f = items[i].getAsFile(); if(f) files.push(f); }
  }
  if(!files.length) return;
  e.preventDefault();
  stageFiles(files);
  const input = document.getElementById('chatInput');
  if(input) input.focus();
}

function stageFiles(fileList){
  if(!Modal) return;
  Array.prototype.forEach.call(fileList, function(f){
    if(f.size > MAX_FILE_MB * 1048576){ alert('"' + (f.name || '파일') + '"은(는) ' + MAX_FILE_MB + 'MB를 넘어서 올릴 수 없어요.'); return; }
    let name = f.name;
    if(!name || name === 'image.png'){ // 붙여넣은 이미지는 이름이 없거나 image.png로 온다
      const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
      name = '붙여넣은이미지_' + Date.now() + '.' + ext;
    }
    Modal.staged.push({ file: f, name: name, type: f.type || 'application/octet-stream', preview: isImageType(f.type) ? URL.createObjectURL(f) : null });
  });
  renderStaged();
}
function renderStaged(){
  const wrap = document.getElementById('chatPend');
  if(!wrap || !Modal) return;
  wrap.classList.toggle('has', Modal.staged.length > 0);
  wrap.innerHTML = Modal.staged.map(function(s, i){
    return '<div class="pend-item">' + (s.preview ? '<img src="' + s.preview + '" alt="">' : '<div class="fn">' + (s.type === 'application/pdf' ? '📄 ' : '📎 ') + esc(s.name) + '</div>') +
      '<button type="button" class="rm" data-unstage="' + i + '">×</button></div>';
  }).join('');
  wrap.onclick = function(e){
    const b = e.target.closest('[data-unstage]');
    if(!b) return;
    const s = Modal.staged.splice(Number(b.dataset.unstage), 1)[0];
    if(s && s.preview) URL.revokeObjectURL(s.preview);
    renderStaged();
  };
}

/** 보낼 묶음 -> 대화 한 줄씩(글 1개 + 파일마다 1개) */
function buildRows(text, staged){
  const rows = [];
  if(text) rows.push({ message: text });
  staged.forEach(function(s){ rows.push({ file: s.file, name: s.name, type: s.type, preview: s.preview }); });
  return rows;
}

/** 큰 사진은 올리기 전에 줄인다(휴대폰 원본 사진은 수 MB라 대화창이 느려짐) */
async function shrinkImage(file, type){
  if(!isImageType(type) || /gif|svg/i.test(type) || file.size < 1.5 * 1048576) return { blob: file, type: type };
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise(function(res, rej){ const im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = url; });
    URL.revokeObjectURL(url);
    const scale = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.85); });
    return blob ? { blob: blob, type: 'image/jpeg' } : { blob: file, type: type };
  }catch(e){ return { blob: file, type: type }; }
}

async function postChatRow(eventId, row){
  const base = { event_id: eventId, uid: Me.id, author_name: myName() };
  if(!row.file){
    const { error } = await supabaseClient.from('schedule_comments').insert(Object.assign(base, { message: row.message }));
    return error ? { ok: false, message: error.message } : { ok: true };
  }
  const shrunk = await shrinkImage(row.file, row.type);
  const extMatch = /\.([A-Za-z0-9]{1,6})$/.exec(row.name || '');
  const ext = shrunk.type === 'image/jpeg' && shrunk.blob !== row.file ? 'jpg' : (extMatch ? extMatch[1].toLowerCase() : 'bin');
  const path = Me.id + '/' + eventId + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  const up = await supabaseClient.storage.from(FILE_BUCKET).upload(path, shrunk.blob, { contentType: shrunk.type, upsert: false });
  if(up.error) return { ok: false, message: up.error.message + (/bucket/i.test(up.error.message) ? ' (schedule_migration_3.sql을 먼저 실행해야 해요)' : '') };
  const { error } = await supabaseClient.from('schedule_comments').insert(Object.assign(base, {
    message: null, file_path: path, file_name: row.name, file_type: shrunk.type, file_size: shrunk.blob.size
  }));
  return error ? { ok: false, message: error.message } : { ok: true };
}

async function sendChat(){
  if(!Modal) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text && !Modal.staged.length) return;
  const rows = buildRows(text, Modal.staged);
  input.value = ''; input.style.height = '';
  Modal.staged = [];
  renderStaged();

  if(!Modal.ev){
    // 아직 저장 전인 새 일정 - 저장 버튼을 누를 때 같이 올라간다
    rows.forEach(function(r){ r.at = new Date().toISOString(); Modal.pending.push(r); });
    renderChatList([]);
    return;
  }
  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.disabled = true;
  const eventId = Modal.ev.id;
  try{
    for(const r of rows){
      const res = await postChatRow(eventId, r);
      if(!res.ok){ alert('전송 실패: ' + res.message); break; }
    }
  } finally {
    rows.forEach(function(r){ if(r.preview) URL.revokeObjectURL(r.preview); });
    if(Modal && Modal.ev && Modal.ev.id === eventId){
      sendBtn.disabled = false;
      await refreshChat(true);
    }
  }
}

async function refreshChat(force){
  if(!Modal || !Modal.ev) return;
  const eventId = Modal.ev.id;
  const { data, error } = await supabaseClient.from('schedule_comments').select('*').eq('event_id', eventId).order('created_at', { ascending: true });
  if(!Modal || !Modal.ev || Modal.ev.id !== eventId) return;
  if(error){ document.getElementById('chatList').innerHTML = '<div class="chat-empty">대화를 불러오지 못했어요</div>'; return; }
  const rows = data || [];
  if(!force && rows.length === Modal.seenCount) return; // 새 대화가 없으면 그대로(이미지 깜빡임 방지)
  Modal.seenCount = rows.length;
  const paths = rows.filter(function(r){ return r.file_path; }).map(function(r){ return r.file_path; });
  const urls = {};
  if(paths.length){
    const s = await supabaseClient.storage.from(FILE_BUCKET).createSignedUrls(paths, 3600);
    (s.data || []).forEach(function(x){ if(x && x.path && x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  if(!Modal || !Modal.ev || Modal.ev.id !== eventId) return;
  renderChatList(rows.map(function(r){
    return { id: r.id, canDel: r.uid === Me.id || isSM(Me), mine: r.uid === Me.id, who: nameOf(r.uid, r.author_name), at: r.created_at, message: r.message,
      name: r.file_name, type: r.file_type, size: r.file_size, url: r.file_path ? (urls[r.file_path] || '') : null };
  }));
}

/** 대화 지우기 - 내가 쓴 것(SM은 전부). 저장 전 새 일정의 대화는 목록에서만 뺀다. */
async function deleteChatItem(btn){
  if(!Modal) return;
  if(!confirm('이 대화를 지울까요?')) return;
  if(btn.dataset.delpend != null){
    const p = Modal.pending.splice(Number(btn.dataset.delpend), 1)[0];
    if(p && p.preview) URL.revokeObjectURL(p.preview);
    renderChatList([]);
    return;
  }
  const { error } = await supabaseClient.from('schedule_comments').delete().eq('id', btn.dataset.delmsg);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  await refreshChat(true);
}

function renderChatList(items){
  const wrap = document.getElementById('chatList');
  if(!wrap || !Modal) return;
  const pend = Modal.pending.map(function(p, i){
    return { pendIdx: i, canDel: true, mine: true, who: myName(), at: p.at, message: p.message, name: p.name, type: p.type, size: p.file ? p.file.size : 0, url: p.preview || (p.file ? '#' : null), pending: true };
  });
  const all = items.concat(pend);
  if(!all.length){
    wrap.innerHTML = '<div class="chat-empty">💬 이 일정에 대한 대화를 남겨보세요<br><small>' + (IS_TOUCH ? '📎 버튼으로 사진·PDF 첨부' : '사진·PDF 첨부, 복사한 이미지는 Ctrl+V') + '</small></div>';
    return;
  }
  wrap.innerHTML = all.map(function(m){
    let bub;
    if(m.message != null && m.message !== '' && !m.name){
      bub = '<div class="bub">' + esc(m.message) + '</div>';
    } else if(isImageType(m.type) && m.url && m.url !== '#'){
      bub = '<div class="bub media"><img src="' + esc(m.url) + '" alt="' + esc(m.name || '') + '" data-open="' + esc(m.url) + '"></div>';
    } else {
      const icon = m.type === 'application/pdf' ? '📄' : (isImageType(m.type) ? '🖼️' : '📎');
      const link = (m.url && m.url !== '#' && !m.pending) ? ' href="' + esc(m.url) + '" target="_blank" rel="noopener"' : '';
      bub = '<div class="bub media"><a class="file"' + link + '>' + icon + ' ' + esc(m.name || '파일') + ' <small>' + fmtSize(m.size) + '</small></a></div>';
    }
    let del = '';
    if(m.canDel) del = m.pending
      ? '<button type="button" class="cdel" data-delpend="' + m.pendIdx + '" title="지우기">×</button>'
      : '<button type="button" class="cdel" data-delmsg="' + esc(m.id) + '" title="지우기">×</button>';
    return '<div class="cmsg' + (m.mine ? ' me' : '') + (m.pending ? ' pending' : '') + '">' +
      (m.mine ? '' : '<div class="who">' + esc(m.who || '-') + '</div>') +
      '<div class="bwrap">' + bub + del + '</div>' +
      '<div class="t">' + (m.pending ? '저장하면 올라가요' : fmtTime(m.at)) + '</div></div>';
  }).join('');
  wrap.scrollTop = wrap.scrollHeight;
  wrap.onclick = function(e){
    const d = e.target.closest('.cdel');
    if(d){ e.stopPropagation(); deleteChatItem(d); return; }
    const im = e.target.closest('[data-open]');
    if(im && !im.closest('.pending')) window.open(im.dataset.open, '_blank', 'noopener');
  };
}

/* ---------------------------- 인천출근(SM 전용) ---------------------------- */
async function toggleIncheon(dateStr){
  const cur = DayFlags[dateStr];
  if(cur && cur.incheon){
    const { error } = await supabaseClient.from('schedule_day_flags').update({ incheon: false, updated_at: new Date().toISOString() }).eq('event_date', dateStr);
    if(error){ alert('처리 실패: ' + error.message); return; }
  } else {
    const used = {};
    dayEventsFor(dateStr).forEach(function(e){ used[e.color] = true; });
    const pick = INCHEON_PALETTE.find(function(c){ return !used[c]; }) || INCHEON_PALETTE[0];
    const { error } = await supabaseClient.from('schedule_day_flags').upsert({
      event_date: dateStr, incheon: true, incheon_color: pick, set_by_uid: Me.id, set_by_name: myName(), updated_at: new Date().toISOString()
    });
    if(error){ alert('처리 실패: ' + error.message); return; }
  }
  await loadDayFlags();
  renderLegend();
  renderGrid();
}

/* ---------------------------- 이벤트 연결 ---------------------------- */
function wireUi(){
  document.getElementById('prevMonthBtn').addEventListener('click', function(){ changeMonth(-1); });
  document.getElementById('nextMonthBtn').addEventListener('click', function(){ changeMonth(1); });
  document.getElementById('todayBtn').addEventListener('click', async function(){
    const now = new Date(); ViewYear = now.getFullYear(); ViewMonth = now.getMonth() + 1;
    await refreshMonth();
    scrollToToday();
  });

  document.querySelectorAll('#calToggles [data-cal]').forEach(function(b){
    b.addEventListener('click', function(){
      Active[b.dataset.cal] = !Active[b.dataset.cal];
      saveActive();
      renderAll();
    });
  });
  document.getElementById('calChips').addEventListener('click', function(e){
    const ed = e.target.closest('[data-caledit]');
    if(ed){ e.stopPropagation(); openCalModal(ed.dataset.caledit); return; }
    const b = e.target.closest('[data-calid]');
    if(!b) return;
    setCalOn(b.dataset.calid, !calOn(b.dataset.calid));
    saveActive();
    renderAll();
  });
  document.getElementById('calAddBtn').addEventListener('click', function(){ openCalModal(null); });

  const memPop = document.getElementById('memPop');
  document.getElementById('memBtn').addEventListener('click', function(e){
    e.stopPropagation();
    memPop.classList.toggle('open');
    fitMemPop();
  });
  memPop.addEventListener('click', function(e){
    e.stopPropagation();
    const all = e.target.closest('[data-memall]');
    if(all){
      Active.members = all.dataset.memall === '1' ? teammates().map(function(u){ return u.uid; }) : [];
      saveActive(); renderAll(); memPop.classList.add('open');
    }
  });
  memPop.addEventListener('change', function(e){
    const cb = e.target.closest('[data-mem]');
    if(!cb) return;
    const uid = cb.dataset.mem;
    Active.members = Active.members.filter(function(x){ return x !== uid; });
    if(cb.checked) Active.members.push(uid);
    saveActive();
    renderAll();
    memPop.classList.add('open');
  });
  document.addEventListener('click', function(){ memPop.classList.remove('open'); });

  // 날짜 칸 클릭 = 일정 추가, 일정 클릭 = 수정/삭제/대화
  const grid = document.getElementById('calGrid');
  // PC: 일정을 다른 날짜 칸으로 끌어다 놓으면 이동/복사를 묻는다
  let dragId = null, dropDay = null;
  function clearDrop(){ if(dropDay){ dropDay.classList.remove('drop-target'); dropDay = null; } }
  grid.addEventListener('dragstart', function(e){
    const chip = e.target.closest('.sch-chip[draggable="true"]');
    if(!chip){ return; }
    dragId = chip.dataset.id;
    e.dataTransfer.effectAllowed = 'copyMove';
    try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
    chip.classList.add('dragging');
  });
  grid.addEventListener('dragend', function(e){
    const chip = e.target.closest && e.target.closest('.sch-chip');
    if(chip) chip.classList.remove('dragging');
    clearDrop(); dragId = null;
  });
  grid.addEventListener('dragover', function(e){
    if(!dragId) return;
    const day = e.target.closest('.sch-day');
    if(!day) return;
    e.preventDefault();
    if(day !== dropDay){ clearDrop(); dropDay = day; day.classList.add('drop-target'); }
  });
  grid.addEventListener('drop', function(e){
    if(!dragId) return;
    e.preventDefault();
    const day = e.target.closest('.sch-day');
    const id = dragId;
    clearDrop(); dragId = null;
    if(day) dropEventOn(id, day.dataset.date);
  });

  grid.addEventListener('click', function(e){
    if(e.target.closest('[data-incheon]')) return;
    const x = e.target.closest('[data-delev]');
    if(x){ e.stopPropagation(); quickDeleteEvent(x.dataset.delev); return; }
    const chip = e.target.closest('.sch-chip');
    if(chip){
      if(chip.dataset.id) openEventModal(chip.dataset.id, null);
      return;
    }
    const day = e.target.closest('.sch-day');
    if(day) openEventModal(null, day.dataset.date);
  });
  document.getElementById('calGrid').addEventListener('change', function(e){
    const cb = e.target.closest('[data-incheon]');
    if(cb) toggleIncheon(cb.dataset.incheon);
  });

  // 창 바깥(어두운 배경)을 손가락으로 밀어도 뒤 화면이 움직이지 않게
  ['eventModalOverlay', 'calModalOverlay', 'mcOverlay'].forEach(function(id){
    document.getElementById(id).addEventListener('touchmove', function(e){ if(e.target === this) e.preventDefault(); }, { passive: false });
  });

  document.getElementById('evSaveTop').addEventListener('click', handleSaveEvent);
  document.getElementById('eventModalClose').addEventListener('click', closeEventModal);
  document.getElementById('eventModalOverlay').addEventListener('click', function(e){ if(e.target.id === 'eventModalOverlay') closeEventModal(); });
  document.getElementById('eventModalOverlay').addEventListener('paste', onModalPaste);
  document.getElementById('chatFile').addEventListener('change', function(){ if(this.files && this.files.length) stageFiles(this.files); });

  document.getElementById('calSaveBtn').addEventListener('click', saveCalendar);
  document.getElementById('calDeleteBtn').addEventListener('click', deleteCalendar);
  document.getElementById('calModalClose').addEventListener('click', closeCalModal);
  document.getElementById('calModalOverlay').addEventListener('click', function(e){ if(e.target.id === 'calModalOverlay') closeCalModal(); });
  document.getElementById('calName').addEventListener('keydown', function(e){ if(e.key === 'Enter') saveCalendar(); });
  document.getElementById('calMemList').addEventListener('change', function(e){
    const cb = e.target.closest('[data-calmem]');
    if(!cb || !CalEdit) return;
    CalEdit.members[cb.dataset.calmem] = cb.checked;
    renderCalMembers();
  });
  document.getElementById('calMemAll').addEventListener('click', function(){
    if(!CalEdit) return;
    calCandidates().forEach(function(u){ CalEdit.members[u.uid] = true; });
    renderCalMembers();
  });
  document.getElementById('calMemNone').addEventListener('click', function(){
    if(!CalEdit) return;
    CalEdit.members = {};
    renderCalMembers();
  });

  document.getElementById('exportImgBtn').addEventListener('click', async function(){
    const btn = this;
    btn.disabled = true; const orig = btn.innerHTML; btn.textContent = '만드는 중...';
    try{
      const canvas = await html2canvas(document.getElementById('calendarCapture'), {
        backgroundColor: '#ffffff', scale: 2,
        // 휴대폰에서 저장해도 이미지는 PC 화면 모양(칸 상자 + 줄바꿈, 한 달 전체)으로 만든다
        windowWidth: 1200,
        ignoreElements: function(el){ return el.classList && (el.classList.contains('sch-incheon-toggle') || el.classList.contains('chip-x')); },
        onclone: function(doc){
          const cap = doc.getElementById('calendarCapture'); if(cap) cap.style.width = '1100px';
          const t = doc.getElementById('capTitle'); if(t) t.style.display = 'block';
          // 이미지에는 오늘 표시(굵은 테두리)를 넣지 않는다
          doc.querySelectorAll('.sch-day.is-today').forEach(function(el){ el.classList.remove('is-today'); });
        }
      });
      const fname = '일정_' + ViewYear + '-' + pad2(ViewMonth) + '.png';
      const dataUrl = canvas.toDataURL('image/png');
      const bridge = window.AndroidAutoFill;
      if(bridge && typeof bridge.saveImageToGallery === 'function'){
        // 위드파트너스 앱: 휴대폰 갤러리(사진 > 위드파트너스 앨범)에 바로 저장
        const ok = bridge.saveImageToGallery(dataUrl.slice(dataUrl.indexOf(',') + 1), fname);
        if(ok === false) alert('갤러리 저장에 실패했어요. 다시 시도해주세요.');
      } else {
        // PC/휴대폰 브라우저: 다운로드. 링크를 화면에 붙였다가 눌러야 휴대폰·예전 앱에서도 저장된다
        // (붙이지 않고 누르면 앱 안 브라우저는 아무 반응이 없었다 - "어디 저장됐는지 모르는" 원인)
        const link = document.createElement('a');
        link.download = fname;
        link.href = dataUrl;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function(){ link.remove(); }, 1500);
      }
    }catch(err){
      alert('이미지 생성에 실패했습니다: ' + (err && err.message ? err.message : err));
    }finally{
      btn.disabled = false; btn.innerHTML = orig;
    }
  });

  document.getElementById('logoutLink').addEventListener('click', async function(e){ e.preventDefault(); await logout(); });
}

async function changeMonth(delta){
  ViewMonth += delta;
  if(ViewMonth < 1){ ViewMonth = 12; ViewYear--; }
  if(ViewMonth > 12){ ViewMonth = 1; ViewYear++; }
  await refreshMonth();
}

/* ---------------------------- 시작 ---------------------------- */
(async function init(){
  const session = await requireLogin();
  if(!session) return;
  Me = await getMyProfile();
  if(!Me){ alert('프로필을 불러오지 못했습니다.'); return; }
  if(Me.approval_status !== 'approved' && Me.role !== 'admin'){
    document.getElementById('approvalNotice').style.display = 'block';
    return;
  }
  await loadRoster();
  if(!RosterByUid[Me.id]){
    const self = { uid: Me.id, name: myName(), role: Me.role, grade: Me.role === 'admin' ? 'SM' : '후보자', tlMembers: [], birth: '', hidden: false, disabled: false };
    Roster.push(self); RosterByUid[Me.id] = self;
  }
  loadActive();
  const now = new Date();
  ViewYear = now.getFullYear(); ViewMonth = now.getMonth() + 1;
  await Promise.all([loadHolidays(), loadCategories(), loadCalendars()]);
  document.getElementById('schBody').style.display = 'block';
  wireUi();
  await refreshMonth();
  scrollToToday();
})();
</script>
